  <style>
    :root{--ink:#292c23;--muted:#77786d;--paper:#f8f6f0;--card:#fffefa;--green:#315d42;--green2:#e7eee4;--orange:#dc8057;--line:#e9e5d9;--shadow:0 10px 30px #3a39210d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#eff0e4 0,transparent 34rem),var(--paper)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #dc805766;outline-offset:2px}.shell{max-width:1120px;margin:auto;padding:0 22px 64px}.topbar{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;font-weight:750;letter-spacing:-.03em}.brandmark{display:grid;place-items:center;width:38px;height:38px;background:var(--green);color:white;border-radius:13px;font-size:20px}.top-actions{display:flex;gap:10px;align-items:center}.icon-button,.quiet-button,.primary-button,.text-button,.danger-button{border:0;border-radius:13px;padding:11px 15px;font-weight:650}.quiet-button,.icon-button{background:#eeece4;color:var(--ink)}.primary-button{background:var(--green);color:white;box-shadow:0 5px 14px #315d4226}.primary-button:hover{background:#244a33}.danger-button{background:#faeae4;color:#a4432c}.text-button{background:transparent;color:var(--green);padding-left:0;padding-right:0}.main{padding-top:36px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--green);font-weight:800}.heading{font-family:Georgia,serif;font-size:clamp(34px,6vw,52px);letter-spacing:-.045em;line-height:1.06;margin:10px 0 10px;font-weight:500}.subheading{color:var(--muted);margin:0;line-height:1.55}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:15px}.crumb{border:0;background:none;padding:0;color:inherit}.crumb:hover{color:var(--green)}.crumb.current{color:var(--ink);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.tile{min-height:190px;position:relative;overflow:hidden;text-align:left;padding:21px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);transition:transform .18s,box-shadow .18s}.tile:hover{transform:translateY(-3px);box-shadow:0 15px 32px #3a392119}.tile.has-photo:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#fffefa9c,#fffefa45);z-index:1}.tile-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88}.tile.has-photo:after{z-index:1}.tile.has-photo>*:not(.tile-photo){position:relative;z-index:2}.tile:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:var(--tint,#e7eee4);right:-48px;bottom:-58px;opacity:.72}.tile-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--tint,#e7eee4);font-size:22px;margin-bottom:21px}.tile-title{font-family:Georgia,serif;font-size:var(--tile-title-size,26px);font-weight:var(--tile-title-weight,700);line-height:1.08;display:block;letter-spacing:-.02em}.recipe-tile .tile-title{font-size:var(--tile-title-size,26px)}.tile-meta{display:block;margin-top:7px;color:var(--muted);font-size:13px}.tile-arrow{position:absolute;right:19px;top:22px;color:var(--green);font-size:20px}.recipe-tile{min-height:154px}.recipe-tile .tile-icon{width:38px;height:38px;margin-bottom:14px;font-size:19px}.recipe-tile .tile-title{font-size:21px}.empty{border:1px dashed #d7d2c4;border-radius:24px;padding:42px 24px;text-align:center;background:#fffdf899}.empty-icon{font-size:35px}.empty h2{font:500 25px Georgia,serif;margin:13px 0 7px}.empty p{color:var(--muted);max-width:390px;margin:0 auto 18px;line-height:1.55}.toolbar{display:flex;gap:10px;margin:0 0 23px}.search{max-width:420px;width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:#fffefa}.search::placeholder{color:#99988c}.recipe-screen{zoom:var(--recipe-zoom,1 tor{border:1px solid var(--line);border-radius:18px;background:#fffefa;padding:17px}.section-editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.stage-actions{display:flex;gap:6px}.stage-actions button{min-width:38px;min-height:36px;border:0;border-radius:9px;background:#eeece4;color:var(--green);font-weight:700}.stage-actions button:disabled{opacity:.4}.section-editor-head input{font-weight:750}.ingredient-editor{display:grid;grid-template-columns:minmax(85px,.75fr) 2fr auto;gap:8px;margin:8px 0}.ingredient-editor input{min-width:0;background:white;border:1px solid var(--line);border-radius:10px;padding:10px}.remove-small{border:0;background:transparent;color:#a4432c;font-size:19px}.add-link{border:0;background:transparent;color:var(--green);font-weight:750;padding:8px 0}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 17px;background:#283b2d;color:white;border-radius:13px;z-index:9;box-shadow:var(--shadow)}.footer-note{color:#88887d;font-size:12px;text-align:center;margin-top:38px}.hidden{display:none!important}
    @media(max-width:600px){.shell{padding:0 16px 44px}.topbar{height:68px}.brand-name{font-size:14px}.top-actions .backup-label{display:none}.main{padding-top:26px}.page-head{align-items:flex-start;flex-direction:column}.page-head .primary-button{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:158px;padding:15px;border-radius:19px}.tile-icon{width:39px;height:39px;border-radius:14px;margin-bottom:16px}.tile-title{font-size:19px}.tile-meta{font-size:12px}.tile-arrow{right:13px;top:15px}.recipe-tile{min-height:139px}.recipe-tile .tile-title{font-size:18px}.empty{padding:33px 17px}.toolbar{width:100%}.search{max-width:none}.recipe-cover{padding:22px;min-height:180px}.recipe-section{padding:19px}.amount{min-width:75px}.form-overlay{padding:0;align-items:end}.dialog{border-radius:25px 25px 0 0;max-height:94dvh;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}.field-row{grid-template-columns:1fr}.ingredient-editor{grid-template-columns:minmax(70px,.8fr) 2fr auto;gap:6px}.ingredient-editor input{padding:9px 8px;font-size:14px}}
  </style>

<style>@media print{body{background:#fff!important}.shell{max-width:none!important;padding:0!important;margin:0!important}.topbar,.crumbs,.footer-note,.portion-control,.recipe-tools,.recipe-view .top-actions{display:none!important}.main{padding:0!important}.recipe-screen{zoom:1!important}.recipe-view{max-width:none!important}.recipe-cover,.recipe-section{box-shadow:none!important;border:1px solid #ddd;break-inside:avoid}.recipe-cover{min-height:0;padding:16px;margin-bottom:10px}.recipe-section{padding:16px;margin-bottom:10px}.ingredient-list li{padding:5px 0}}</style>
<style>.recipe-tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;max-width:780px;margin:0 auto 12px;color:var(--muted);font-size:14px}.recipe-tools output{min-width:45px;text-align:center;font-weight:700;color:var(--green)}@media(max-width:600px){.recipe-tools{justify-content:flex-start}.recipe-tools>span{flex-basis:100%}}</style>
<style>.recipe-photo{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:18px;margin:0 0 18px}.recipe-photo-preview{max-width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:#eeece4}.photo-preview-box{display:grid;gap:8px}</style>

  <style>
    @media (max-width: 900px), (pointer: coarse) {
      :root {-webkit-text-size-adjust:100%}
      input,textarea,select {font-size:18px!important}
    }
    body.form-open {
      position:fixed;
      inset:var(--form-page-top,0px) 0 auto;
      width:100%;
      overflow:hidden;
    }
    .form-overlay {
      top:var(--form-viewport-top,0px);
      height:var(--form-viewport-height,100dvh);
      overscroll-behavior:contain;
    }

      max-height:min(950px,calc(var(--form-viewport-height,100dvh) - 32px));

<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" id="home-link"><span class="brandmark">✳</span><span class="brand-name">Moja kuchnia</span></a>
    <div class="top-actions"><button class="quiet-button" id="import-button" title="Wczytaj kopię zapasową">↥ <span class="backup-label">Wczytaj kopię</span></button><button class="quiet-button" id="export-button" title="Zapisz kopię zapasową">↧ <span class="backup-label">Kopia zapasowa</span></button><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div>
  </header>
  <main id="main" class="main"></main>
  <p class="footer-note">Twoje przepisy są zapisane na tym urządzeniu.</p>
</div>
<div id="overlay-root"></div><div id="toast-root"></div>
<script src="./tesseract.min.js"></script>
<script>
(()=>{
  const KEY='domowa-kuchnia-v1';
  const colors=['#e7eee4','#f7e8dc','#eee8f4','#e5eef1','#f2ebd8','#f3e5e7'];
  const icons=['📖','🍃','🍲','🥣','🍰','🫙','🥗','🍋'];
  let state=load(), route={type:'home'}, search='', homeSearch='';
  const main=document.querySelector('#main');
  function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.books)?d:{books:[]}}catch{return{books:[]}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const bookBy=id=>state.books.find(x=>x.id===id), catBy=(b,id)=>b?.categories.find(x=>x.id===id), recipeBy=(b,c,id)=>c?.recipes.find(x=>x.id===id);
  function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function crumb(items){return `<nav class="crumbs">${items.map((x,i)=>i<items.length-1?`<button class="crumb" data-route="${x.route}">${esc(x.label)}</button><span>›</span>`:`<span class="crumb current">${esc(x.label)}</span>`).join('')}</nav>`}
  function card(title,meta,icon,tint,action,cls='',photo='',tileStyle={}){const size=[22,26,30,34].includes(Number(tileStyle.size))?Number(tileStyle.size):26,weight=[400,500,600,700,800].includes(Number(tileStyle.weight))?Number(tileStyle.weight):700;return `<button class="tile ${cls}${photo?' has-photo':''}" data-action="${action}" style="--tint:${tint};--tile-title-size:${size}px;--tile-title-weight:${weight}">${photo?`<img class="tile-photo" src="${esc(photo)}" alt="">`:''}<span class="tile-arrow">↗</span>${photo?'':`<span class="tile-icon">${icon}</span>`}<span class="tile-title">${esc(title)}</span><span class="tile-meta">${esc(meta)}</span></button>`}
  function empty(title,body,button,action){return `<div class="empty"><div class="empty-icon">🥄</div><h2>${title}</h2><p>${body}</p><button class="primary-button" data-action="${action}">${button}</button></div>`}
  function tileStyleFields(item={}){const size=[22,26,30,34].includes(Number(item?.tileTitleSize))?Number(item.tileTitleSize):26,weight=[400,500,600,700,800].includes(Number(item?.tileTitleWeight))?Number(item.tileTitleWeight):700;return '<div class="field-row"><div class="field"><label>Wielkość nazwy na kafelku</label><select name="tileTitleSize"><option value="22" '+(size===22?'selected':'')+'>Mała</option><option value="26" '+(size===26?'selected':'')+'>Średnia</option><option value="30" '+(size===30?'selected':'')+'>Duża</option><option value="34" '+(size===34?'selected':'')+'>Bardzo duża</option></select></div><div class="field"><label>Grubość czcionki</label><select name="tileTitleWeight"><option value="400" '+(weight===400?'selected':'')+'>Zwykła</option><option value="500" '+(weight===500?'selected':'')+'>Lekko pogrubiona</option><option value="600" '+(weight===600?'selected':'')+'>Średnia</option><option value="700" '+(weight===700?'selected':'')+'>Pogrubiona</option><option value="800" '+(weight===800?'selected':'')+'>Bardzo pogrubiona</option></select></div></div>'}
  function render(){
    if (appleTouchDevice && isInlineEditor(document.activeElement)) document.activeElement.blur();
    if(route.type==='home')return renderHome();
    if(route.type==='book')return renderBook();
    if(route.type==='category')return renderCategory();
    if(route.type==='recipe')return renderRecipe();
  }
  function renderHome(){
    const books=state.books;
    main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Twoje domowe zbiory</div><h1 class="heading">Smaki, do których<br>chce się wracać.</h1><p class="subheading">Wszystkie Twoje przepisy w jednym, przytulnym miejscu.</p></div><button class="primary-button" data-action="new-book">＋ Dodaj książkę</button></section>
      <div class="toolbar"><input id="home-recipe-search" class="search" type="search"
        aria-label="Szukaj przepisu we wszystkich książkach" placeholder="Szukaj przepisu we wszystkich książkach"
        value="${esc(homeSearch)}"></div>
      <div id="home-recipe-results" hidden></div>
      <div id="home-books">${books.length?`<div class="grid">${books.map((b,i)=>`<div class="tile-edit-wrap">${card(b.name,`${b.categories.length} ${plural(b.categories.length,'dział','działy','działów')}`,icons[i%icons.length],colors[i%colors.length],`book:${b.id}`,'',b.photo||'',{size:b.tileTitleSize,weight:b.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-book:${b.id}">Edytuj nazwę i zdjęcie książki</button></div>`).join('')}</div>`:empty('Zacznij od swojej pierwszej książki','Utwórz książkę kucharską i poukładaj w niej przepisy tak, jak lubisz.','＋ Dodaj pierwszą książkę','new-book')}</div>`;
    const input = main.querySelector('#home-recipe-search');
    const results = main.querySelector('#home-recipe-results');
    const bookList = main.querySelector('#home-books');
    function refreshResults() {
      const query = homeSearch.trim().toLocaleLowerCase('pl');
      results.hidden = !query;
      bookList.hidden = Boolean(query);
      if (!query) {
        results.replaceChildren();
        return;
      }
      const matches = books.flatMap(book => book.categories.flatMap(category =>
        category.recipes.filter(recipe => recipeMatches(recipe,query)).map(recipe => ({book,category,recipe}))));
      results.innerHTML = matches.length ? `<div class="grid">${matches.map(({book,category,recipe},i) =>
        card(recipe.name,`${book.name} · ${category.name}`,'📖',colors[i%colors.length],
          `recipe:${book.id}:${category.id}:${recipe.id}`,'recipe-tile',recipe.photo||'',
          {size:recipe.tileTitleSize,weight:recipe.tileTitleWeight})).join('')}</div>` :
        '<div class="empty"><h2>Nie znaleziono przepisu</h2><p>Spróbuj wpisać inną nazwę.</p></div>';
    }
    input.addEventListener('input', () => {
      homeSearch = input.value;
      refreshResults();
    });
    refreshResults();
  }

  function recipeMatches(recipe,query) {
    return `${recipe.name} ${recipe.description || ''}`.toLocaleLowerCase('pl').includes(query);
  }
  function renderBook(){const b=bookBy(route.book);if(!b){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'}, {label:b.name}])}<section class="page-head"><div><div class="eyebrow">Książka kucharska</div><h1 class="heading">${esc(b.name)}</h1><p class="subheading">Wybierz dział albo dodaj nowy.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-book:${b.id}">Edytuj</button><button class="primary-button" data-action="new-category:${b.id}">＋ Dodaj dział</button></div></section>${b.categories.length?`<div class="grid">${b.categories.map((c,i)=>`<div class="tile-edit-wrap">${card(c.name,`${c.recipes.length} ${plural(c.recipes.length,'przepis','przepisy','przepisów')}`,icons[(i+1)%icons.length],colors[(i+2)%colors.length],`category:${b.id}:${c.id}`,'',c.photo||'',{size:c.tileTitleSize,weight:c.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-category:${b.id}:${c.id}">Edytuj dział i zdjęcie</button></div>`).join('')}</div>`:empty('Dodaj pierwszy dział','Działy pomagają uporządkować przepisy, na przykład na „Sosy”, „Zupy” albo „Ciasta”.','＋ Dodaj dział',`new-category:${b.id}`)}`;
  }
  function renderCategory(){const b=bookBy(route.book),c=catBy(b,route.category);if(!b||!c){route={type:'home'};return renderHome()};

  }
  async function scanPhoto(file,book,cat){const imageUrl=URL.createObjectURL(file);showForm('Czytam zdjęcie',`<img class="scan-preview" src="${imageUrl}" alt="Wybrane zdjęcie przepisu"><div class="progress-track"><span style="width:30%"></span></div><p class="scan-status">Rozpoznaję tekst na urządzeniu… Przy pierwszym użyciu może to chwilę potrwać.</p><p class="scan-help" style="text-align:center">Najlepszy efekt dają wyraźne, równo ułożone zdjęcia drukowanego przepisu.</p>`);let worker;try{if(!window.Tesseract)throw new Error('Brak plików OCR');worker=await Tesseract.createWorker('pol',1,{workerPath:new URL('./worker.min.js',location.href).href,corePath:new URL('./tesseract-core-lstm.wasm.js',location.href).href,langPath:new URL('./',location.href).href,gzip:true});const result=await worker.recognize(file);const text=result.data.text||'';await worker.terminate();worker=null;URL.revokeObjectURL(imageUrl);if(!text.trim()){closeForm();toast('Nie udało się odczytać tekstu. Spróbuj wyraźniejszego zdjęcia.');return}const sourcePhoto=await compressRecipePhoto(file);reviewOcrText(text,book,cat,sourcePhoto)}catch(error){if(worker)try{await worker.terminate()}catch{}URL.revokeObjectURL(imageUrl);closeForm();toast('Nie udało się odczytać zdjęcia. Otwórz aplikację w przeglądarce przez plik startowy i spróbuj ponownie.')}}
  function navigate(value){const p=value.split(':');if(p[0]==='home'){route={type:'home'};search=''}else if(p[0]==='book'){route={type:'book',book:p[1]}}else if(p[0]==='category'){route={type:'category',book:p[1],category:p[2]};search=''}else if(p[0]==='recipe'){route={type:'recipe',book:p[1],category:p[2],recipe:p[3]}}render();window.scrollTo(0,0)}
  function toast(msg){const el=document.querySelector('#toast-root');el.innerHTML=`<div class="notice">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',2600)}
  let formPageScroll = null;
  let viewportRestoreTimer;
  const viewportMeta = document.querySelector('meta[name=viewport]');
  const defaultViewport = viewportMeta.content;
  const appleTouchDevice = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function lockEditingViewport() {
    clearTimeout(viewportRestoreTimer);
    viewportMeta.content = defaultViewport + ', maximum-scale=1';
  }

  function restoreEditingViewport(onRestore) {
    clearTimeout(viewportRestoreTimer);
    viewportRestoreTimer = setTimeout(() => {
      if (formPageScroll !== null || isInlineEditor(document.activeElement)) return;
      viewportMeta.content = defaultViewport;
      onRestore?.();
    },350);
  }

  function isInlineEditor(element) {
    return element instanceof HTMLElement && main.contains(element) &&
      element.matches('select, textarea, input:not([type=hidden]):not([type=file]):not([type=checkbox]):not([type=radio])');
  }

  if (appleTouchDevice) {
    let inlineScroll;
    main.addEventListener('pointerdown',event => {
      if (!isInlineEditor(event.target)) return;
      inlineScroll ??= window.scrollY;
      lockEditingViewport();
      restoreEditingViewport(() => { inlineScroll = undefined; });
    });
    main.addEventListener('focusin',event => {
      if (!isInlineEditor(event.target)) return;
      inlineScroll ??= window.scrollY;
      lockEditingViewport();
    });
    main.addEventListener('focusout',event => {
      const field = event.target;
      if (!isInlineEditor(field)) return;
      const scroll = inlineScroll;
      inlineScroll = undefined;
      restoreEditingViewport(() => {
        requestAnimationFrame(() => {
          if (field.isConnected && scroll !== undefined && !isInlineEditor(document.activeElement)) {
            window.scrollTo(0,scroll);
          }
        });
      });
    });
    main.addEventListener('keydown',event => {
      if (event.key !== 'Enter' || !event.target.matches('#portion-count,#scale-target')) return;
      event.preventDefault();
      event.target.blur();
    });
  }

  function fitFormToViewport() {
    const overlay = document.querySelector('.form-overlay');
    const viewport = window.visualViewport;
    if (!overlay || !viewport) return;
    overlay.style.setProperty('--form-viewport-top', viewport.offsetTop + 'px');
    overlay.style.setProperty('--form-viewport-height', viewport.height + 'px');
  }

  function showForm(title,content,onSave) {
    if (formPageScroll === null) {
      formPageScroll = window.scrollY;
      document.body.style.setProperty('--form-page-top', -formPageScroll + 'px');
      document.body.classList.add('form-open');
      if (appleTouchDevice) lockEditingViewport();
      window.visualViewport?.addEventListener('resize', fitFormToViewport);
      window.visualViewport?.addEventListener('scroll', fitFormToViewport);
    }
    const root = document.querySelector('#overlay-root');
    root.innerHTML = `<div class="form-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="dialog-head"><div><h2>${esc(title)}</h2><p class="dialog-intro">Zmiany zapisują się na tym urządzeniu.</p></div><button type="button" class="icon-button" data-close aria-label="Zamknij">✕</button></header>${content}</section></div>`;
    fitFormToViewport();
    root.firstElementChild.addEventListener('click',event => {
      if (event.target === event.currentTarget || event.target.closest('button[data-close]')) closeForm();
    });
    const form = root.querySelector('#edit-form');
    form?.addEventListener('submit',event => {
      event.preventDefault();
      onSave(new FormData(form),form);
    });
  }

  function closeForm() {
    const root = document.querySelector('#overlay-root');
    if (root.contains(document.activeElement)) document.activeElement.blur();
    root.innerHTML = '';
    if (formPageScroll === null) return;
    window.visualViewport?.removeEventListener('resize', fitFormToViewport);
    window.visualViewport?.removeEventListener('scroll', fitFormToViewport);
    document.body.classList.remove('form-open');
    document.body.style.removeProperty('--form-page-top');
    window.scrollTo(0,formPageScroll);
    formPageScroll = null;
    if (appleTouchDevice) restoreEditingViewport();
  }

  function bookForm(book=null){
    const existing=Boolean(book);
    const content='<form id="edit-form" class="form"><div class="field"><label for="item-name">Nazwa książki kucharskiej</label><input id="item-name" name="name" required maxlength="70" value="'+esc(book?.name||'')+'" placeholder="np. Moje ulubione przepisy"></div><div class="field"><label for="book-photo">Zdjęcie książki</label><input id="book-photo" type="file" accept="image/*"><span class="scan-help">Wybierz zdjęcie z galerii albo zrób je aparatem. Pojawi się na kafelku książki.</span><div class="photo-preview-box" id="book-photo-preview">'+(book?.photo?'<img class="recipe-photo-preview" src="'+esc(book.photo)+'" alt="Podgląd zdjęcia książki">':'<span class="scan-help">Nie dodano jeszcze zdjęcia.</span>')+'</div>'+(book?.photo?'<label><input type="checkbox" name="removePhoto"> Usuń obecne zdjęcie przy zapisie</label>':'')+'</div>'+tileStyleFields(book)+'<div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">'+(existing?'Zapisz zmiany':'Utwórz książkę')+'</button></div></form>';
    showForm(existing?'Edytuj książkę':'Nowa książka',content,async(fd,form)=>{const name=String(fd.get('name')).trim();if(!name)return;let photo=book?.photo||'';const file=form.querySelector('#book-photo').files?.[0];if(fd.get('removePhoto')==='on')photo='';else if(file){try{photo=await compressRecipePhoto(file)}catch(err){toast('Nie udało się wczytać zdjęcia. Spróbuj wybrać je ponownie.');return}}if(existing){book.name=name;book.photo=photo;book.tileTitleSize=Number(fd.get('tileTitleSize'))||26;book.tileTitleWeight=Number(fd.get('tileTitleWeight'))||700}else state.books.push({id:id(),name,photo,tileTitleSize:Number(fd.get('tileTitleSize'))||26,tileTitleWeight:Number(fd.get('tileTitleWeight'))||700,categories:[]});save();closeForm();render();toast(existing?'Książka zaktualizowana':'Książka dodana')});
    const input=document.querySelector('#book-photo'),preview=document.querySelector('#book-photo-preview');input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;const url=URL.createObjectURL(file);preview.innerHTML='<img class="recipe-photo-preview" src="'+url+'" alt="Podgląd wybranego zdjęcia">';const remove=document.querySelector('#edit-form [name=removePhoto]');if(remove)remove.checked=false})
  }
  function categoryForm(book,category=null){
    const existing=Boolean(category);
    const content='<form id="edit-form" class="form"><div class="field"><label for="item-name">Nazwa działu</label><input id="item-name" name="name" required maxlength="70" value="'+esc(category?.name||'')+'" placeholder="np. Sosy"></div><div class="field"><label for="category-photo">Zdjęcie działu</label><input id="category-photo" type="file" accept="image/*"><span class="scan-help">Wybierz zdjęcie z galerii albo zrób je aparatem. Pojawi się na kafelku działu.</span><div class="photo-preview-box" id="category-photo-preview">'+(category?.photo?'<img class="recipe-photo-preview" src="'+esc(category.photo)+'" alt="Podgląd zdjęcia działu">':'<span class="scan-help">Nie dodano jeszcze zdjęcia.</span>')+'</div>'+(category?.photo?'<label><input type="checkbox" name="removePhoto"> Usuń obecne zdjęcie przy zapisie</label>':'')+'</div>'+tileStyleFields(category)+(existing?'<div><button type="button" class="danger-button" id="delete-category">Usuń dział</button></div>':'')+'<div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">'+(existing?'Zapisz zmiany':'Dodaj dział')+'</button></div></form>';
    showForm(existing?'Edytuj dział':'Nowy dział',content,async(fd,form)=>{const name=String(fd.get('name')).trim();if(!name)return;let photo=category?.photo||'';const file=form.querySelector('#category-photo').files?.[0];if(fd.get('removePhoto')==='on')photo='';else if(file){try{photo=await compressRecipePhoto(file)}catch(err){toast('Nie udało się wczytać zdjęcia. Spróbuj wybrać je ponownie.');return}}if(existing){category.name=name;category.photo=photo;category.tileTitleSize=Number(fd.get('tileTitleSize'))||26;category.tileTitleWeight=Number(fd.get('tileTitleWeight'))||700}else book.categories.push({id:id(),name,photo,tileTitleSize:Number(fd.get('tileTitleSize'))||26,tileTitleWeight:Number(fd.get('tileTitleWeight'))||700,recipes:[]});save();closeForm();render();toast(existing?'Dział zaktualizowany':'Dział dodany')});
    const input=document.querySelector('#category-photo'),preview=document.querySelector('#category-photo-preview');input.addEventListener('change',()=>{const file=input.files?.[0];if(!file)return;const url=URL.createObjectURL(file);preview.innerHTML='<img class="recipe-photo-preview" src="'+url+'" alt="Podgląd wybranego zdjęcia">';const remove=document.querySelector('#edit-form [name=removePhoto]');if(remove)remove.checked=false})
    document.querySelector('#delete-category')?.addEventListener('click',()=>{
      const count = category.recipes.length;
      const warning = count ? ` Wraz z działem usuniesz wszystkie jego przepisy (liczba: ${count}).` : '';
      if (!confirm(`Usunąć dział „${category.name}”?${warning}`)) return;
      const previousCategories = book.categories;
      book.categories = previousCategories.filter(item=>item.id!==category.id);
      try {
        save();
      } catch {
        book.categories = previousCategories;
        toast('Nie udało się usunąć działu.');
        return;
      }
      closeForm();
      navigate(`book:${book.id}`);
      toast('Dział usunięty');
    });
  }
  function simpleForm(title,label,value,saveText,save){showForm(title,`<form id="edit-form" class="form"><div class="field"><label for="item-name">${label}</label><input id="item-name" name="name" required maxlength="70" value="${esc(value)}" placeholder="Wpisz nazwę" autofocus></div><div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">${saveText}</button></div></form>`,f=>{const name=String(f.get('name')).trim();if(!name)return;save(name);closeForm();render()})}
  function sectionMarkup(s={},i=0){const ingredients=s.ingredients?.length?s.ingredients:[{amount:'',name:''}];return `<div class="section-editor" data-section><div class="section-editor-head"><span class="eyebrow">Część przepisu ${i+1}</span><span class="stage-actions"><button type="button" data-move-section="up" aria-label="Przenieś etap wyżej" title="Przenieś wyżej">↑</button><button type="button" data-move-section="down" aria-label="Przenieś etap niżej" title="Przenieś niżej">↓</button><button type="button" class="remove-small" data-remove-section title="Usuń część">×</button></span></div><div class="form" style="gap:11px"><div class="field"><label>Nazwa części / etapu</label><input data-s-name required maxlength="60" value="${esc(s.name||'')}" placeholder="np. Sos, ciasto, nadzienie"></div><div class="field"><span class="label">Składniki</span><div data-ingredients>${ingredients.map(ing=>ingredientMarkup(ing)).join('')}</div><button type="button" class="add-link" data-add-ingredient>＋ Dodaj składnik</button></div><div class="field"><label>Sposób przygotowania</label><textarea data-s-instructions placeholder="Opisz, co zrobić w tym etapie…">${esc(s.instructions||'')}</textarea></div></div></div>`}
  function ingredientMarkup(x={}){return `<div class="ingredient-editor"><input data-amount aria-label="Ilość" value="${esc(x.amount||'')}" placeholder="Ilość"><input data-ing-name aria-label="Składnik" value="${esc(x.name||'')}" placeholder="np. mąki"><button class="remove-small" type="button" data-remove-ingredient aria-label="Usuń składnik">×</button></div>`}
  function compressRecipePhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=1400,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Invalid image'))};img.src=url})}
  function recipeForm(book,cat,old,draft=false){const existing=Boolean(old&&!draft);const initialServings=existing?(Number(old.servings)||4):1;const sections=old?.sections?.length?old.sections:[{name:'',ingredients:[{amount:'',name:''}],instructions:''}];
    const content=`<form id="edit-form" class="form"><div class="field"><label for="recipe-name">Nazwa przepisu</label><input id="recipe-name" name="name" required maxlength="90" value="${esc(old?.name||'')}" placeholder="np. Sos pomidorowy"></div><div class="field"><label for="recipe-description">Krótki opis</label><textarea id="recipe-description" name="description" class="small-area" maxlength="280" placeholder="Kilka słów o tym przepisie…">${esc(old?.description||'')}</textarea></div><div class="field"><label for="recipe-photo-edit">Zdjęcie przepisu</label><input id="recipe-photo-edit" type="file" accept="image/*"><span class="scan-help">Możesz wybrać zdjęcie z galerii albo zrobić nowe aparatem.</span><div class="photo-preview-box" id="recipe-photo-preview">${old?.photo?`<img class="recipe-photo-preview" src="${esc(old.photo)}" alt="Podgląd zdjęcia przepisu">`:'<span class="scan-help">Nie dodano jeszcze zdjęcia.</span>'}</div>${old?.photo?`<label><input type="checkbox" name="removePhoto"> Usuń obecne zdjęcie przy zapisie</label>`:''}</div>${tileStyleFields(old)}<div class="field"><label for="recipe-servings">Podstawowa liczba porcji</label><input id="recipe-servings" name="servings" type="number" min="1" max="100" step="1" value="${initialServings}"><span class="scan-help">Na tej podstawie aplikacja przeliczy ilości składników.</span></div><div id="sections">${sections.map((s,i)=>sectionMarkup(s,i)).join('')}</div><button type="button" class="add-link" id="add-section">＋ Dodaj część / etap</button><div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">${existing?'Zapisz zmiany':'Zapisz przepis'}</button></div></form>`;
    showForm(existing?'Edytuj przepis':'Nowy przepis',content,async(fd,form)=>{const name=String(fd.get('name')).trim();if(!name)return;const blocks=[...form.querySelectorAll('[data-section]')];const parsed=blocks.map(el=>({name:el.querySelector('[data-s-name]').value.trim(),instructions:el.querySelector('[data-s-instructions]').value.trim(),ingredients:[...el.querySelectorAll('.ingredient-editor')].map(row=>({amount:row.querySelector('[data-amount]').value.trim(),name:row.querySelector('[data-ing-name]').value.trim()})).filter(x=>x.name||x.amount)})).filter(s=>s.name||s.instructions||s.ingredients.length);let photo=old?.photo||'';const photoInput=form.querySelector('#recipe-photo-edit'),photoFile=photoInput?.files?.[0];if(fd.get('removePhoto')==='on')photo='';else if(photoFile){try{photo=await compressRecipePhoto(photoFile)}catch(err){toast('Nie udało się wczytać zdjęcia. Spróbuj wybrać je ponownie.');return}}const recipe={id:existing?old.id:id(),name,photo,tileTitleSize:Number(fd.get('tileTitleSize'))||26,tileTitleWeight:Number(fd.get('tileTitleWeight'))||700,description:String(fd.get('description')).trim(),servings:Math.min(100,Math.max(1,Number(fd.get('servings'))||initialServings)),sections:parsed};if(existing)Object.assign(old,recipe);else cat.recipes.push(recipe);save();closeForm();render();toast(existing?'Przepis zaktualizowany':'Przepis zapisany')});
    const photoInput=document.querySelector('#recipe-photo-edit'),photoPreview=document.querySelector('#recipe-photo-preview');photoInput.addEventListener('change',()=>{const file=photoInput.files?.[0];if(!file)return;const url=URL.createObjectURL(file);photoPreview.innerHTML=`<img class="recipe-photo-preview" src="${url}" alt="Podgląd wybranego zdjęcia">`;const remove=form=>form.querySelector('[name=removePhoto]');const removeCheck=document.querySelector('#edit-form [name=removePhoto]');if(removeCheck)removeCheck.checked=false});
    const sectionsRoot=document.querySelector('#sections');const updateSectionOrder=()=>[...sectionsRoot.children].forEach((el,i)=>{el.querySelector('.section-editor-head .eyebrow').textContent=`Część przepisu ${i+1}`;el.querySelector('[data-move-section="up"]').disabled=i===0;el.querySelector('[data-move-section="down"]').disabled=i===sectionsRoot.children.length-1});updateSectionOrder();sectionsRoot.addEventListener('click',e=>{const move=e.target.closest('[data-move-section]');if(move){const item=move.closest('[data-section]');if(move.dataset.moveSection==='up'&&item.previousElementSibling)sectionsRoot.insertBefore(item,item.previousElementSibling);else if(move.dataset.moveSection==='down'&&item.nextElementSibling)sectionsRoot.insertBefore(item.nextElementSibling,item);updateSectionOrder();return}if(e.target.closest('[data-add-ingredient]')){const container=e.target.closest('[data-section]').querySelector('[data-ingredients]');container.insertAdjacentHTML('beforeend',ingredientMarkup());container.lastElementChild.querySelector('[data-amount]').focus()}if(e.target.closest('[data-remove-ingredient]')){const group=e.target.closest('[data-ingredients]');if(group.children.length>1)e.target.closest('.ingredient-editor').remove();else{group.firstElementChild.querySelectorAll('input').forEach(x=>x.value='')}}if(e.target.closest('[data-remove-section]')){if(sectionsRoot.children.length>1)e.target.closest('[data-section]').remove();else toast('Przepis musi mieć przynajmniej jeden etap');updateSectionOrder()}});
    document.querySelector('#add-section').addEventListener('click',()=>{sectionsRoot.insertAdjacentHTML('beforeend',sectionMarkup({},sectionsRoot.children.length));sectionsRoot.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'});updateSectionOrder()});
  }
  document.addEventListener('click',e=>{const cr=e.target.closest('[data-route]');if(cr){navigate(cr.dataset.route);return}const a=e.target.closest('[data-action]');if(!a)return;const [act,...p]=a.dataset.action.split(':');
    if(act==='book')return navigate(`book:${p[0]}`);if(act==='category')return navigate(`category:${p[0]}:${p[1]}`);if(act==='recipe')return navigate(`recipe:${p[0]}:${p[1]}:${p[2]}`);
    if(act==='new-book')return bookForm()
    if(act==='edit-book'){const b=bookBy(p[0]);return bookForm(b)}
    if(act==='new-category'){const b=bookBy(p[0]);return categoryForm(b)}
    if(act==='edit-category'){const b=bookBy(p[0]),c=catBy(b,p[1]);return categoryForm(b,c)}
    if(act==='new-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]));
    if(act==='scan-photo')return document.querySelector('#recipe-photo').click();
    if(act==='edit-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),recipeBy(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),p[2]));
    if(act==='delete-recipe'){const b=bookBy(p[0]),c=catBy(b,p[1]),r=recipeBy(b,c,p[2]);if(confirm(`Usunąć przepis „${r.name}”?`)){c.recipes=c.recipes.filter(x=>x.id!==r.id);save();navigate(`category:${b.id}:${c.id}`);toast('Przepis usunięty')}}
  });
  document.addEventListener('change',e=>{if(e.target.id==='recipe-photo'&&e.target.files?.[0]){const b=bookBy(route.book),c=catBy(b,route.category);if(b&&c)scanPhoto(e.target.files[0],b,c);e.target.value=''}});
  document.querySelector('#home-link').addEventListener('click',e=>{e.preventDefault();navigate('home')});
  document.querySelector('#export-button').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'domowa-kuchnia',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moja-ksiazka-kucharska.json';a.click();URL.revokeObjectURL(a.href);toast('Kopia zapasowa pobrana')});
  document.querySelector('#import-button').addEventListener('click',()=>document.querySelector('#import-file').click());
  document.querySelector('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.books)||!data.books.every(b=>typeof b.name==='string'&&Array.isArray(b.categories)))throw new Error('bad');if(confirm('Wczytać kopię zapasową? Obecne przepisy zostaną zastąpione zawartością kopii.')){state={books:data.books};save();navigate('home');toast('Kopia zapasowa wczytana')}}catch{toast('Nie udało się wczytać tego pliku')}e.target.value=''});
  try { localStorage.removeItem('domowa-kuchnia-sync-key'); } catch {}
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
