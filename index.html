  }

  function updateCustomTable(table) {
    const exists = state.tables.some(item=>item.id===table.id);
    return storeCustomTables(exists ? state.tables.map(item=>item.id===table.id?table:item) : [...state.tables,table]);
  }

  function editCustomTable(table,template=tableTemplates.blank) {
    const columns = table?.columns || template.labels.map(label=>({id:id(),label}));
    function columnField(column) {
      return `<div class="custom-column-field" data-column-id="${esc(column.id)}">
        <input required maxlength="70" aria-label="Nazwa kolumny" value="${esc(column.label)}">
        <button type="button" class="quiet-button" data-remove-table-column aria-label="Usuń kolumnę">Usuń</button></div>`;
    }
    showForm(table?'Edytuj tabelę':'Nowa tabela',`<form id="edit-form" class="form">
      <div class="field"><label for="custom-table-name">Nazwa tabeli i kafelka</label>
        <input id="custom-table-name" name="name" required maxlength="70" value="${esc(table?.name||template.name)}"></div>
      <div class="field"><label for="custom-table-photo">Zdjęcie kafelka</label>
        <input id="custom-table-photo" type="file" accept="image/*">
        ${table?.photo?`<img class="recipe-photo-preview" src="${esc(table.photo)}" alt="Obecne zdjęcie kafelka">
          <label><input type="checkbox" name="removePhoto"> Usuń obecne zdjęcie przy zapisie</label>`:''}
      </div>
      <div class="field"><span class="label">Kolumny</span><div id="custom-table-columns">${columns.map(columnField).join('')}</div>
        <div><button type="button" class="text-button" id="add-table-column">＋ Dodaj kolumnę</button></div></div>
      ${table?`<div><button type="button" class="danger-button" id="delete-custom-table">Usuń tabelę</button></div>`:''}
      <div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button>
        <button type="submit" class="primary-button">Zapisz tabelę</button></div>
    </form>`,async (data,form)=>{
      const name = String(data.get('name')).trim();
      const savedColumns = [...form.querySelectorAll('[data-column-id]')].map(field=>
        ({id:field.dataset.columnId,label:field.querySelector('input').value.trim()}));
      const button = form.querySelector('[type=submit]');
      if (!name || savedColumns.some(column=>!column.label) || button.disabled) return;
      button.disabled = true;
      try {
        let photo = table?.photo || '';
        const file = form.querySelector('#custom-table-photo').files[0];
        if (data.get('removePhoto')==='on') photo='';
        else if (file) {
          try {photo=await compressRecipePhoto(file,720,.7);} catch {
            toast('Nie udało się wczytać zdjęcia.');
            return;
          }
        }
        if (!form.isConnected) return;
        const rows = (table?.rows||[]).map(row=>({...row,
          cells:Object.fromEntries(savedColumns.map(column=>[column.id,row.cells[column.id]||'']))}));
        const updated = {...table,id:table?.id||id(),name,photo,columns:savedColumns,rows};
        if (!updateCustomTable(updated)) return;
        closeForm();
        navigate(`custom-table:${updated.id}`);
        toast('Tabela zapisana');
      } finally {
        button.disabled = false;
      }
    });
    const list = document.querySelector('#custom-table-columns');
    document.querySelector('#add-table-column').addEventListener('click',()=>{
      list.insertAdjacentHTML('beforeend',columnField({id:id(),label:''}));
      list.lastElementChild.querySelector('input').focus();
    });
    list.addEventListener('click',event=>{
      const button = event.target.closest('[data-remove-table-column]');
      if (!button) return;
      if (list.children.length===1) {
        toast('Tabela musi mieć co najmniej jedną kolumnę.');
        return;
      }
      const column = button.closest('[data-column-id]');
      if (table?.rows.some(row=>row.cells[column.dataset.columnId]) &&
          !confirm('Usunąć kolumnę wraz z jej danymi po zapisaniu zmian?')) return;
      column.remove();
    });
    document.querySelector('#delete-custom-table')?.addEventListener('click',()=>{
      if (!confirm(`Usunąć tabelę „${table.name}” razem z jej wierszami (${table.rows.length})?`)) return;
      if (!storeCustomTables(state.tables.filter(item=>item.id!==table.id))) return;
      closeForm();
      navigate('home');
      toast('Tabela usunięta');
    });
  }

  function renderCustomTable(table) {
    if (!table) {
      route={type:'home'};
      return renderHome();
    }
    main.innerHTML = `<div class="recipe-screen" id="recipe-zoom-area">
      ${crumb([{label:'Moja kuchnia',route:'home'},{label:table.name}])}
      <section class="page-head"><h1 class="heading">${esc(table.name)}</h1>
        <div class="top-actions custom-table-actions">
          <button type="button" class="quiet-button" data-action="edit-custom-table:${table.id}">Ustawienia tabeli</button>
          <button type="button" class="primary-button" data-action="add-table-row:${table.id}">＋ Dodaj wiersz</button>
        </div></section>
      <div class="toolbar custom-table-search"><input type="search" class="search" id="custom-table-search"
        aria-label="Szukaj w tabeli" placeholder="Szukaj w tabeli"></div>
      ${viewZoomControls('Widok tabeli','<button type="button" class="quiet-button" id="custom-table-print">Zapisz / drukuj PDF</button>')}
      <div id="custom-table-results"></div></div>`;
    bindViewZoom(table.viewZoom,zoom=>{
      table.viewZoom = zoom;
      save();
    });
    const input = main.querySelector('#custom-table-search');
    const results = main.querySelector('#custom-table-results');
    const print = main.querySelector('#custom-table-print');
    function refresh() {
      const query = input.value.trim().toLocaleLowerCase('pl');
      const rows = table.rows.filter(row=>table.columns.some(column=>
        String(row.cells[column.id]||'').toLocaleLowerCase('pl').includes(query)) ||
        row.components?.some(item=>`${item.amount} ${item.name}`.toLocaleLowerCase('pl').includes(query)));
      print.disabled = !rows.length;
      results.innerHTML = rows.length ? `<div class="prep-table-scroll prep-list" tabindex="0" role="region" aria-label="${esc(table.name)}">
        <table class="custom-table"><thead><tr>${table.columns.map(column=>`<th scope="col">${esc(column.label)}</th>`).join('')}
          <th scope="col" class="custom-table-row-action"><span class="custom-table-visually-hidden">Edycja</span></th></tr></thead>
          <tbody>${rows.map(row=>`<tr>${table.columns.map((column,i)=>`<td>${esc(row.cells[column.id]||'—')}
            ${i===0&&row.components?.length?`<button type="button" class="text-button table-components-open"
              data-action="open-linked-table-row:${esc(table.id)}:${esc(row.id)}">Składniki (${row.components.length})</button>`:''}</td>`).join('')}
            <td class="custom-table-row-action"><button type="button" class="custom-table-row-edit" aria-label="Edytuj wiersz" title="Edytuj wiersz" data-action="edit-table-row:${table.id}:${row.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4.5-1 12-12a2 2 0 0 0-4-4l-12 12Z"/></svg>
            </button></td>
          </tr>`).join('')}</tbody>
        </table></div>` : `<div class="empty"><h2>${query?'Brak wyników':'Tabela jest pusta'}</h2></div>`;
    }
    input.addEventListener('input',refresh);
    print.addEventListener('click',()=>window.print());
    refresh();
  }

  function tableComponentFields(item = {}) {
    return `<div class="table-component-fields" data-table-component>
      <input aria-label="Ilość składnika" data-component-amount maxlength="70" placeholder="Ilość" value="${esc(item.amount||'')}">
      <input aria-label="Nazwa składnika" data-component-name maxlength="140" placeholder="Składnik" value="${esc(item.name||'')}">
      <button type="button" class="remove-small" data-remove-table-component aria-label="Usuń składnik">×</button>
    </div>`;
  }

  function editCustomTableRow(table,row) {
    showForm(row?'Edytuj wiersz':'Dodaj wiersz',`<form id="edit-form" class="form">
      ${table.columns.map(column=>`<div class="field"><label>${esc(column.label)}
        <textarea name="cell-${esc(column.id)}" rows="1" maxlength="3000">${esc(row?.cells[column.id]||'')}</textarea></label></div>`).join('')}
      <details class="table-components-editor" ${row?.components?.length?'open':''}>
        <summary>Składniki</summary>
        <div id="table-component-list">${(row?.components||[]).map(tableComponentFields).join('')}</div>
        <button type="button" class="text-button" id="add-table-component">＋ Dodaj składnik</button>
      </details>
      ${row?'<div><button type="button" class="danger-button" id="delete-table-row">Usuń wiersz</button></div>':''}
      <div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button>
        <button type="submit" class="primary-button">Zapisz wiersz</button></div>
    </form>`,(data,form)=>{
      const cells = Object.fromEntries(table.columns.map(column=>[column.id,String(data.get('cell-'+column.id)||'').trim()]));
      const components = [...form.querySelectorAll('[data-table-component]')].map(item=>({
        amount:item.querySelector('[data-component-amount]').value.trim(),
        name:item.querySelector('[data-component-name]').value.trim()
      })).filter(item=>item.name || item.amount);
      if (!Object.values(cells).some(Boolean) && !components.length) {
        toast('Wpisz wartość przynajmniej w jednym polu.');
        return;
      }
      const updated = {...row,id:row?.id||id(),cells,components};
      const rows = row ? table.rows.map(item=>item.id===row.id?updated:item) : [...table.rows,updated];
      if (!updateCustomTable({...table,rows})) return;
      closeForm();
      render();
    });
    const componentList = document.querySelector('#table-component-list');
    document.querySelector('#add-table-component').addEventListener('click',()=>{
      componentList.insertAdjacentHTML('beforeend',tableComponentFields());
      componentList.lastElementChild.querySelector('[data-component-name]').focus();
    });
    componentList.addEventListener('click',event=>{
      event.target.closest('[data-remove-table-component]')?.closest('[data-table-component]').remove();
    });
    document.querySelector('#delete-table-row')?.addEventListener('click',()=>{
      if (!confirm('Usunąć ten wiersz z tabeli?')) return;
      if (!updateCustomTable({...table,rows:table.rows.filter(item=>item.id!==row.id)})) return;
      closeForm();
      render();
    });
  }

  document.addEventListener('click',e=>{const cr=e.target.closest('[data-route]');if(cr){navigate(cr.dataset.route);return}const a=e.target.closest('[data-action]');if(!a)return;const [act,...p]=a.dataset.action.split(':');
    if(act==='book')return navigate(`book:${p[0]}`);if(act==='category')return navigate(`category:${p[0]}:${p[1]}`);if(act==='recipe')return navigate(`recipe:${p[0]}:${p[1]}:${p[2]}`);
    if (act==='add-home-item') return addHomeItem();
    if (act==='choose-table-template') return chooseTableTemplate();
    if (act==='open-linked-table-row') return openLinkedTableRow(p.join(':'));
    if (act==='custom-table') return navigate(`custom-table:${p[0]}`);
    if (act==='edit-custom-table' || act==='add-table-row' || act==='edit-table-row') {
      const table = state.tables.find(item=>item.id===p[0]);
      if (!table) return;
      if (act==='edit-custom-table') return editCustomTable(table);
      const row = table.rows.find(item=>item.id===p[1]);
      if (act==='add-table-row' || row) return editCustomTableRow(table,row);
    }
    if(act==='new-book')return bookForm()
    if(act==='edit-book'){const b=bookBy(p[0]);return bookForm(b)}
    if(act==='new-category'){const b=bookBy(p[0]);return categoryForm(b)}
    if(act==='edit-category'){const b=bookBy(p[0]),c=catBy(b,p[1]);return categoryForm(b,c)}
    if (act==='prep-index') return navigate('prep-index');
    if (act==='edit-prep-tile') return bookForm(null,true);
    if (act==='add-index-prep') return prepForm();
    if (act==='prep-entry') return navigate(`prep-entry:${p[0]}`);
    if (act==='edit-index-prep' || act==='delete-index-prep') {
      const entry = state.prepEntries.find(item=>item.id===p[0]);
      if (!entry) return;
      if (act==='edit-index-prep') return prepForm(entry);
      return removePrep(entry);
    }
    if (act==='edit-table-prep') {
      const category = catBy(bookBy(p[0]),p[1]);
      const entry = category?.recipes.find(item=>item.id===p[2]);
      if (entry) return prepForm(entry,category);
    }
    if(act==='new-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]));
    if (act==='dictate-recipe') {
      const book = bookBy(p[0]);
      const category = catBy(book,p[1]);
      if (category) return dictateRecipe(book,category);
    }
    if(act==='scan-photo')return document.querySelector('#recipe-photo').click();
    if(act==='edit-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),recipeBy(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),p[2]));
    if (act==='journal-recipe' || act==='cook-recipe') {
      const book = bookBy(p[0]);
      const category = catBy(book,p[1]);
      const recipe = recipeBy(book,category,p[2]);
      if (!recipe) return;
      return act==='journal-recipe' ? openBakeJournal(recipe) : startCooking(recipe);
    }
    if(act==='copy-recipe'){
      const book = bookBy(p[0]);
      const category = catBy(book,p[1]);
      const recipe = recipeBy(book,category,p[2]);
      if (recipe) return recipeForm(book,category,{...recipe,name:recipe.name.slice(0,82)+' (kopia)'},true);
    }
    if(act==='delete-recipe'){const b=bookBy(p[0]),c=catBy(b,p[1]),r=recipeBy(b,c,p[2]);if(confirm(`Usunąć ${r.kind==='prep-sv'?'prep':'przepis'} „${r.name}”?`)){c.recipes=c.recipes.filter(x=>x.id!==r.id);save();navigate(`category:${b.id}:${c.id}`);toast(r.kind==='prep-sv'?'Prep usunięty':'Przepis usunięty')}}
  });
  document.addEventListener('change',e=>{if(e.target.id==='recipe-photo'&&e.target.files?.[0]){const b=bookBy(route.book),c=catBy(b,route.category);if(b&&c)scanPhoto(e.target.files[0],b,c);e.target.value=''}});
  document.querySelector('#home-link').addEventListener('click',e=>{e.preventDefault();navigate('home')});
  document.querySelector('#export-button').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'domowa-kuchnia',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moja-ksiazka-kucharska.json';a.click();URL.revokeObjectURL(a.href);toast('Kopia zapasowa pobrana')});
  document.querySelector('#import-button').addEventListener('click',()=>document.querySelector('#import-file').click());
  function importSelectedRecipes(entries) {
    const books = structuredClone(state.books);
    const importedIds = new Map(entries.map(({recipe})=>[recipe.id,id()]));
    for (const {book:sourceBook,category:sourceCategory,recipe,destination} of entries) {
      let book = destination
        ? books.find(item=>item.id===destination.book.id)
        : books.find(item=>item.name===sourceBook.name);
      if (!book) {
        book = {...sourceBook,id:id(),categories:[]};
        books.push(book);
      }
      let category = destination?.category
        ? book.categories.find(item=>item.id===destination.category.id)
        : book.categories.find(item=>item.name===sourceCategory.name);
      if (!category) {
        category = {...sourceCategory,id:id(),recipes:[]};
        book.categories.push(category);
      }
      const copy = structuredClone(recipe);
      copy.id = importedIds.get(recipe.id);
      for (const section of copy.sections||[]) {
        for (const ingredient of section.ingredients||[]) {
          if (importedIds.has(ingredient.recipeLink)) ingredient.recipeLink = importedIds.get(ingredient.recipeLink);
        }
      }
      delete copy.notes;
      delete copy.hideFromPrepIndex;
      category.recipes.push(copy);
    }
    const updated = {...state,books};
    localStorage.setItem(KEY,JSON.stringify(updated));
    state = updated;
  }

  function reviewBackup(data) {
    const entries = data.books.flatMap(book=>book.categories.flatMap(category=>
      category.recipes.map(recipe=>({book,category,recipe}))));
    const destinations = state.books.flatMap(book=>book.categories.map(category=>({book,category})));
    const categoryOptions = destinations.map(({book,category},i)=>
      `<option value="category:${i}">${esc(book.name)} · ${esc(category.name)}</option>`).join('');
    const bookOptions = state.books.map((book,i)=>
      `<option value="book:${i}">${esc(book.name)}</option>`).join('');
    showForm('Wczytaj kopię zapasową',`<form id="edit-form" class="form">
      ${entries.length ? `<p class="scan-help">Zaznacz przepisy i wybierz miejsce dla każdego z nich albo ustaw jedno domyślne miejsce. Zdjęcia zostaną skopiowane. Dziennik wypieków zostaje w kopii.</p>
        <div class="field"><label for="backup-search">Szukaj w kopii</label>
          <input type="search" id="backup-search" placeholder="Nazwa przepisu, książki lub działu"></div>
        <div class="backup-recipe-list" role="group" aria-label="Przepisy z kopii">
          ${entries.map(({book,category,recipe},i)=>`<div class="backup-recipe">
            <label class="backup-recipe-label"><input type="checkbox" name="recipes" value="${i}">
            <span><strong>${esc(recipe.name)}</strong><small>${esc(book.name)} · ${esc(category.name)}</small></span></label>
            <div class="field backup-recipe-route" hidden>
              <label for="import-route-${i}">Gdzie dodać ten przepis</label>
              <select id="import-route-${i}" name="route-${i}"></select>
            </div>
          </div>`).join('')}
        </div>
        <div class="field"><label for="backup-destination">Domyślne miejsce dla zaznaczonych przepisów</label>
          <select id="backup-destination" name="destination">
            <option value="">Książki i działy według nazw z kopii</option>
            ${categoryOptions}
          </select></div>` : '<p class="scan-help">W kopii nie ma przepisów do wybrania.</p>'}
      <p class="scan-help" id="backup-import-status" role="status" hidden></p>
      <div class="form-actions backup-import-actions">
        <button type="button" class="quiet-button" data-close>Anuluj</button>
        <button type="button" class="danger-button" id="restore-full-backup">Odtwórz całą kopię</button>
        ${entries.length?'<button type="submit" class="primary-button">Dodaj zaznaczone</button>':''}
      </div>
    </form>`,(formData,form)=>{
      const selected = formData.getAll('recipes').map(index=>{
        const entry = entries[Number(index)];
        const value = formData.get('route-'+index) || formData.get('destination') || '';
        const [kind,destinationIndex] = value.split(':');
        const destination = kind==='category' ? destinations[Number(destinationIndex)]
          : kind==='book' ? {book:state.books[Number(destinationIndex)]} : null;
        return {...entry,destination};
      });
      const message = form.querySelector('#backup-import-status');
      if (!selected.length) {
        message.textContent = 'Zaznacz co najmniej jeden przepis.';
        message.hidden = false;
        return;
      }
      try {
        importSelectedRecipes(selected);
      } catch {
        message.textContent = 'Nie udało się zapisać wybranych przepisów na tym urządzeniu.';
        message.hidden = false;
        return;
      }
      closeForm();
      navigate('home');
      toast(`Dodano przepisy: ${selected.length}`);
    });
    document.querySelector('.backup-recipe-list')?.addEventListener('change',event=>{
      if (!event.target.matches('[name=recipes]')) return;
      const checkbox = event.target;
      const route = checkbox.closest('.backup-recipe').querySelector('.backup-recipe-route');
      route.hidden = !checkbox.checked;
      const select = route.querySelector('select');
      if (checkbox.checked && !select.options.length) {
        select.innerHTML = `<option value="">Użyj domyślnego miejsca</option>
          <option value="source">Książka i dział z kopii</option>
          ${categoryOptions?`<optgroup label="Istniejący dział">${categoryOptions}</optgroup>`:''}
          ${bookOptions?`<optgroup label="Dział z kopii w mojej książce">${bookOptions}</optgroup>`:''}`;
      }
    });
    const search = document.querySelector('#backup-search');
    search?.addEventListener('input',()=>{
      const query = search.value.trim().toLocaleLowerCase('pl');
      document.querySelectorAll('.backup-recipe').forEach(row=>{
        row.hidden = !row.querySelector('.backup-recipe-label').textContent.toLocaleLowerCase('pl').includes(query);
      });
    });
    document.querySelector('#restore-full-backup').addEventListener('click',()=>{
      if (!confirm('Odtworzyć całą kopię? Obecne książki, przepisy i tabele zostaną zastąpione zawartością kopii.')) return;
      try {
        localStorage.setItem(KEY,JSON.stringify(data));
        state = data;
      } catch {
        const message = document.querySelector('#backup-import-status');
        message.textContent = 'Nie udało się odtworzyć kopii na tym urządzeniu.';
        message.hidden = false;
        return;
      }
      closeForm();
      navigate('home');
      toast('Kopia zapasowa wczytana');
    });
  }

  document.querySelector('#import-file').addEventListener('change',async event=>{
    const input = event.target;
    const file = input.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data?.books) || !data.books.every(book=>
        typeof book?.name==='string' && Array.isArray(book.categories) && book.categories.every(category=>
          typeof category?.name==='string' && Array.isArray(category.recipes) &&
          category.recipes.every(recipe=>typeof recipe?.name==='string')))) throw Error('bad backup');
      reviewBackup(normalizeCookbook(data));
    } catch {
      toast('Nie udało się wczytać tego pliku.');
    } finally {
      input.value = '';
    }
  });
  try { localStorage.removeItem('domowa-kuchnia-sync-key'); } catch {}
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  setupBackNavigation();
  render();
})();
</script>
</body>
</html>
