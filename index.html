  <style>
    @media (max-width: 900px), (pointer: coarse) {
      :root {-webkit-text-size-adjust:100%}
      input,textarea,select {font-size:18px!important}
    }
    .recipe-actions {flex-wrap:wrap}
    .ingredient-actions {display:flex;align-items:center;gap:3px}
    .ingredient-actions [data-drag-ingredient] {
      width:38px;min-height:40px;padding:0;border:0;border-radius:8px;background:#eeece4;
      color:var(--green);font-size:20px;cursor:grab;touch-action:none;user-select:none
    }
    .ingredient-dragging {background:var(--green2);border-radius:8px}
    .ingredient-dragging [data-drag-ingredient] {cursor:grabbing}
    .ingredient-link-button {width:32px;min-height:36px;padding:0;border:0;border-radius:8px;background:#eeece4}
    .ingredient-link-button.is-linked {background:var(--green2);outline:1px solid var(--green)}
    .ingredient-link-picker {grid-column:1/-1}
    .ingredient-link-picker[hidden] {display:none}
    .ingredient-link-picker select {width:100%;padding:7px}
    .ingredient-linked-open {display:block;padding:3px 0;text-align:left;font-size:.9em}
    .ingredient-linked-values {margin:12px 0 0}
    .ingredient-linked-values dt {font-weight:750}
    .ingredient-linked-values dd {margin:4px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
    .ingredient-actions .remove-small {min-width:24px;padding:0}
    .ingredient-dictation {margin-top:6px}
    .ingredient-dictation summary {cursor:pointer;color:var(--green);font-weight:700}
    .ingredient-dictation .field {margin-top:9px}
    .ingredient-dictation textarea {min-height:76px}
    .bake-journal {display:grid;gap:12px}
    .bake-entry {border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--card)}
    .bake-entry summary {cursor:pointer;color:var(--green);font-weight:700}
    .bake-entry p {white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}
    .bake-entry img {display:block;max-width:100%;max-height:360px;border-radius:12px;margin-top:10px}
    .bake-journal-button {display:flex;justify-content:flex-end;margin:14px 0 0}
    .cooking-nav {display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
    .cooking-nav a {text-decoration:none}
    .cooking-ingredients {list-style:none;padding:0}
    .cooking-ingredients label {display:flex;align-items:center;gap:12px;min-height:44px}
    .cooking-ingredients input {width:22px;height:22px}
    .cooking-ingredients input:checked + span {text-decoration:line-through;color:var(--muted)}
    .prep-list {margin:0 0 20px}
    .table-components-editor {border:1px solid var(--line);border-radius:10px;padding:10px}
    .table-components-editor summary {cursor:pointer;color:var(--green);font-weight:700}
    .table-component-fields {display:grid;grid-template-columns:minmax(62px,.8fr) minmax(0,1.5fr) auto;gap:6px;margin:8px 0}
    .table-component-fields input {min-width:0}
    .table-components-list {padding-left:20px;margin:8px 0}
    .table-components-open {display:block;font-size:.88em;padding:5px 0;text-align:left}
    .custom-table-actions {flex-wrap:wrap}
    .custom-table th,.custom-table td {min-width:100px;white-space:pre-wrap;vertical-align:top}
    .custom-table .custom-table-row-action {min-width:34px;width:34px;padding:3px;white-space:nowrap;vertical-align:top}
    .custom-table-row-edit {
      display:grid;place-items:center;width:28px;height:30px;padding:0;border:0;border-radius:7px;
      background:transparent;color:var(--green)
    }
    .custom-table-row-edit svg {width:17px;height:17px}
    .custom-table-visually-hidden {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
    .custom-column-field {display:flex;gap:8px;margin-bottom:8px}
    .custom-column-field input {min-width:0}
    @media print {
      .custom-table-actions,.custom-table-search,.custom-table-row-action,.table-components-open {display:none!important}
      .custom-table {table-layout:fixed}
      .custom-table th,.custom-table td {min-width:0;overflow-wrap:anywhere}
      .custom-table tr {break-inside:avoid}
    }
    .prep-list h2 {font:500 25px Georgia,serif;margin:0 0 12px}
    .prep-list table {width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
    .prep-list th,.prep-list td {text-align:left;overflow-wrap:anywhere;padding:9px;border-bottom:1px solid var(--line)}
    .prep-list th[scope=col] {color:var(--muted);font-size:13px}
    .prep-list button {text-align:left}
    .prep-table-scroll {overflow-x:auto}
    .prep-index-table {min-width:490px}
    .prep-index-table th,.prep-index-table td {overflow-wrap:normal;word-break:normal;vertical-align:top}
    .prep-index-table td {white-space:pre-wrap}
    .prep-index-table th:first-child {min-width:118px}
    .prep-index-table td:nth-child(2) {white-space:nowrap}
    .prep-index-table th:last-child {min-width:110px}
    .prep-row-edit {display:block;font-size:13px;padding:6px 0}
    .prep-index-toolbar {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    @media print {
      .prep-index-toolbar,.prep-index-add,.prep-row-edit {display:none!important}
      .prep-table-scroll {overflow:visible}
      .prep-index-table {min-width:0;table-layout:fixed}
      .prep-index-table th,.prep-index-table td {min-width:0!important;overflow-wrap:anywhere}
      .prep-index-table tr {break-inside:avoid}
      .prep-index-table th button {padding:0}
    }
    .prep-index-table th:nth-child(2) {min-width:95px}
    .prep-index-table th:nth-child(3) {min-width:70px}
    .prep-numbers {display:flex;gap:18px;flex-wrap:wrap}
    .prep-numbers strong {display:block;margin-top:5px;color:var(--green);font-size:25px}
    .baking-settings {flex-basis:100%}
    .baking-settings summary {cursor:pointer;color:var(--green);font-weight:700}
    .baking-fields {display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .baker-percent {display:block;color:var(--muted);font-size:13px}
    .baker-percent[hidden] {display:none}
    .baker-summary {margin:10px 0;color:var(--green);font-weight:700}
    .baker-starter {margin-top:8px}
    .baker-starter[hidden] {display:none}
    .baker-carry {grid-column:1/-1}
    .section-editor:first-child .baker-carry {display:none}
    .stage-mass {
      margin:12px 0 0;
      text-align:right;
      color:var(--green);
      font-weight:750;
    }
    .backup-recipe-list {max-height:35vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
    .backup-recipe {display:grid;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
    .backup-recipe-label {display:flex;gap:10px;align-items:center}
    .backup-recipe-route[hidden] {display:none}
    .backup-recipe-route select {width:100%;min-width:0}
    .backup-recipe:last-child {border-bottom:0}
    .backup-recipe[hidden] {display:none}
    .backup-recipe small {display:block;color:var(--muted);margin-top:3px}
    .backup-import-actions {flex-wrap:wrap}
    .backup-button {display:inline-flex;align-items:center;gap:7px}
    .backup-icon {width:17px;height:17px;flex:none}
    html.app-swipe {overscroll-behavior-x:none}
    body.form-open {
      position:fixed;
      inset:var(--form-page-top,0px) 0 auto;
      width:100%;
      overflow:hidden;
    }
    .form-overlay {
      top:var(--form-viewport-top,0px);
      height:var(--form-viewport-height,100dvh);
      overscroll-behavior:contain;
    }
    .form-overlay .dialog {
      max-height:min(950px,calc(var(--form-viewport-height,100dvh) - 32px));
      overscroll-behavior:contain;
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" id="home-link"><span class="brandmark">✳</span><span class="brand-name">Moja kuchnia</span></a>
    <div class="top-actions">
      <button type="button" class="quiet-button backup-button" id="import-button" title="Wczytaj kopię zapasową" aria-label="Wczytaj kopię zapasową">
        <svg class="backup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 3h7a2 2 0 0 1 2 2v1M3 18l3-7a2 2 0 0 1 2-1h12a1 1 0 0 1 1 1.4l-3 7.4a2 2 0 0 1-2 1.2H5a2 2 0 0 1-2-2Z"/></svg>
        <span class="backup-label">Wczytaj kopię</span>
      </button>
      <button type="button" class="quiet-button backup-button" id="export-button" title="Zapisz kopię zapasową" aria-label="Zapisz kopię zapasową">
        <svg class="backup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M7 3v6h9V3M7 21v-8h10v8"/></svg>
        <span class="backup-label">Zapisz kopię</span>
      </button>
      <input id="import-file" type="file" accept="application/json,.json" class="hidden">
    </div>
  </header>
  <main id="main" class="main"></main>
  <p class="footer-note">Twoje przepisy są zapisane na tym urządzeniu.</p>
</div>
<div id="overlay-root"></div><div id="toast-root"></div>
<script src="./tesseract.min.js"></script>
<script>
(()=>{
  const KEY='domowa-kuchnia-v1';
  const colors=['#e7eee4','#f7e8dc','#eee8f4','#e5eef1','#f2ebd8','#f3e5e7'];
  const icons=['📖','🍃','🍲','🥣','🍰','🫙','🥗','🍋'];
  let state=load(), route={type:'home'}, search='', homeSearch='';
  const main=document.querySelector('#main');
  function normalizeCookbook(data) {
    const prepEntries = [...(Array.isArray(data.prepEntries) ? data.prepEntries : [])];
    const ids = new Set(prepEntries.map(entry=>entry.id));
    for (const book of data.books) {
      for (const category of book.categories) {
        category.recipes = category.recipes.filter(recipe=>{
          if (recipe.kind!=='prep-sv') return true;
          if (!ids.has(recipe.id)) {
            prepEntries.push(recipe);
            ids.add(recipe.id);
          }
          return false;
        });
      }
    }
    return {books:data.books,prepEntries,prepTile:data.prepTile||{},tables:Array.isArray(data.tables)?data.tables:[]};
  }
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(data?.books)) return normalizeCookbook(data);
    } catch {}
    return {books:[],prepEntries:[],prepTile:{},tables:[]};
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const bookBy=id=>state.books.find(x=>x.id===id), catBy=(b,id)=>b?.categories.find(x=>x.id===id), recipeBy=(b,c,id)=>c?.recipes.find(x=>x.id===id);
  function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function crumb(items){return `<nav class="crumbs">${items.map((x,i)=>i<items.length-1?`<button class="crumb" data-route="${x.route}">${esc(x.label)}</button><span>›</span>`:`<span class="crumb current">${esc(x.label)}</span>`).join('')}</nav>`}
  function card(title,meta,icon,tint,action,cls='',photo='',tileStyle={}){const size=[22,26,30,34].includes(Number(tileStyle.size))?Number(tileStyle.size):26,weight=[400,500,600,700,800].includes(Number(tileStyle.weight))?Number(tileStyle.weight):700;return `<button class="tile ${cls}${photo?' has-photo':''}" data-action="${action}" style="--tint:${tint};--tile-title-size:${size}px;--tile-title-weight:${weight}">${photo?`<img class="tile-photo" src="${esc(photo)}" alt="">`:''}<span class="tile-arrow">↗</span>${photo?'':`<span class="tile-icon">${icon}</span>`}<span class="tile-title">${esc(title)}</span><span class="tile-meta">${esc(meta)}</span></button>`}
  function empty(title,body,button,action){return `<div class="empty"><div class="empty-icon">🥄</div><h2>${title}</h2><p>${body}</p><button class="primary-button" data-action="${action}">${button}</button></div>`}
  function tileStyleFields(item={}){const size=[22,26,30,34].includes(Number(item?.tileTitleSize))?Number(item.tileTitleSize):26,weight=[400,500,600,700,800].includes(Number(item?.tileTitleWeight))?Number(item.tileTitleWeight):700;return '<div class="field-row"><div class="field"><label>Wielkość nazwy na kafelku</label><select name="tileTitleSize"><option value="22" '+(size===22?'selected':'')+'>Mała</option><option value="26" '+(size===26?'selected':'')+'>Średnia</option><option value="30" '+(size===30?'selected':'')+'>Duża</option><option value="34" '+(size===34?'selected':'')+'>Bardzo duża</option></select></div><div class="field"><label>Grubość czcionki</label><select name="tileTitleWeight"><option value="400" '+(weight===400?'selected':'')+'>Zwykła</option><option value="500" '+(weight===500?'selected':'')+'>Lekko pogrubiona</option><option value="600" '+(weight===600?'selected':'')+'>Średnia</option><option value="700" '+(weight===700?'selected':'')+'>Pogrubiona</option><option value="800" '+(weight===800?'selected':'')+'>Bardzo pogrubiona</option></select></div></div>'}
  function render(){
    if (appleTouchDevice && isInlineEditor(document.activeElement)) document.activeElement.blur();
    if(route.type==='home')return renderHome();
    if(route.type==='prep-index')return renderPrepIndex();
    if(route.type==='custom-table')return renderCustomTable(state.tables.find(table=>table.id===route.id));
    if(route.type==='prep-entry')return renderPrep(state.prepEntries.find(entry=>entry.id===route.id));
    if(route.type==='book')return renderBook();
    if(route.type==='category')return renderCategory();
    if(route.type==='recipe')return renderRecipe();
  }
  function renderHome(){
    const books=state.books;
    const prepTile=state.prepTile;
    const showPrep=hasPrepTile();
    const hasTiles=showPrep || books.length || state.tables.length;
    main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Twoje domowe zbiory</div><h1 class="heading">Smaki, do których<br>chce się wracać.</h1><p class="subheading">Wszystkie Twoje przepisy w jednym, przytulnym miejscu.</p></div><button type="button" class="primary-button" data-action="add-home-item">＋ Dodaj</button></section>
      <div class="toolbar"><input id="home-recipe-search" class="search" type="search"
        aria-label="Szukaj przepisu we wszystkich książkach" placeholder="Szukaj przepisu we wszystkich książkach"
        value="${esc(homeSearch)}"></div>
      <div id="home-recipe-results" hidden></div>
      <div id="home-books">${hasTiles?`<div class="grid">${showPrep?`<div class="tile-edit-wrap">${card(prepTile.name||'Prep sous-vide','Temperatury i czasy obróbki','🌡️',colors[2],
        'prep-index','',prepTile.photo||'',{size:prepTile.tileTitleSize,weight:prepTile.tileTitleWeight})}
        <button type="button" class="text-button tile-edit-link" data-action="edit-prep-tile">Edytuj kafelek Prep</button></div>`: ''}${state.tables.map((table,i)=>`<div class="tile-edit-wrap">
        ${card(table.name,'Tabela','📋',colors[(i+3)%colors.length],`custom-table:${table.id}`,'',table.photo||'')}
        <button type="button" class="text-button tile-edit-link" data-action="edit-custom-table:${table.id}">Edytuj tabelę</button></div>`).join('')}${books.map((b,i)=>`<div class="tile-edit-wrap">${card(b.name,`${b.categories.length} ${plural(b.categories.length,'dział','działy','działów')}`,icons[i%icons.length],colors[i%colors.length],`book:${b.id}`,'',b.photo||'',{size:b.tileTitleSize,weight:b.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-book:${b.id}">Edytuj nazwę i zdjęcie książki</button></div>`).join('')}</div>`:empty('Tu pojawią się Twoje książki i tabele','Dodaj pierwszą książkę lub własną tabelę albo wczytaj kopię zapasową.','＋ Dodaj','add-home-item')}</div>`;
    const input = main.querySelector('#home-recipe-search');
    const results = main.querySelector('#home-recipe-results');
    const bookList = main.querySelector('#home-books');
    function refreshResults() {
      const query = homeSearch.trim().toLocaleLowerCase('pl');
      results.hidden = !query;
      bookList.hidden = Boolean(query);
      if (!query) {
        results.replaceChildren();
        return;
      }
      const matches = books.flatMap(book => book.categories.flatMap(category =>
        category.recipes.filter(recipe => recipeMatches(recipe,query)).map(recipe => ({book,category,recipe}))));
      matches.push(...state.prepEntries.filter(recipe=>recipeMatches(recipe,query)).map(recipe=>({recipe})));
      results.innerHTML = matches.length ? `<div class="grid">${matches.map(({book,category,recipe},i) =>
        card(recipe.name,recipe.kind==='prep-sv'?
          `${prepTemperature(recipe)} · ${recipe.prep.duration} · Prep sous-vide`:`${book.name} · ${category.name}`,'📖',colors[i%colors.length],
          book?`recipe:${book.id}:${category.id}:${recipe.id}`:`prep-entry:${recipe.id}`,'recipe-tile',recipe.photo||'',
          {size:recipe.tileTitleSize,weight:recipe.tileTitleWeight})).join('')}</div>` :
        '<div class="empty"><h2>Nie znaleziono przepisu</h2><p>Spróbuj wpisać inną nazwę.</p></div>';
    }
    input.addEventListener('input', () => {
      homeSearch = input.value;
      refreshResults();
    });
    refreshResults();
  }

  function recipeMatches(recipe,query) {
    const prep = recipe.prep;
    const values = [recipe.name,recipe.description];
    if (prep) values.push('prep sous-vide',prep.name,prep.temperature == null ? '' : prepTemperature(recipe),prep.duration,prep.size,prep.notes);
    return values.join(' ').toLocaleLowerCase('pl').includes(query);
  }
  function renderBook(){const b=bookBy(route.book);if(!b){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'}, {label:b.name}])}<section class="page-head"><div><div class="eyebrow">Książka kucharska</div><h1 class="heading">${esc(b.name)}</h1><p class="subheading">Wybierz dział albo dodaj nowy.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-book:${b.id}">Edytuj</button><button class="primary-button" data-action="new-category:${b.id}">＋ Dodaj dział</button></div></section>${b.categories.length?`<div class="grid">${b.categories.map((c,i)=>`<div class="tile-edit-wrap">${card(c.name,`${c.recipes.length} ${plural(c.recipes.length,'przepis','przepisy','przepisów')}`,icons[(i+1)%icons.length],colors[(i+2)%colors.length],`category:${b.id}:${c.id}`,'',c.photo||'',{size:c.tileTitleSize,weight:c.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-category:${b.id}:${c.id}">Edytuj dział i zdjęcie</button></div>`).join('')}</div>`:empty('Dodaj pierwszy dział','Działy pomagają uporządkować przepisy, na przykład na „Sosy”, „Zupy” albo „Ciasta”.','＋ Dodaj dział',`new-category:${b.id}`)}`;
  }
  function renderCategory(){const b=bookBy(route.book),c=catBy(b,route.category);if(!b||!c){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name}])}<section class="page-head"><div><div class="eyebrow">Dział w książce „${esc(b.name)}”</div><h1 class="heading">${esc(c.name)}</h1><p class="subheading">Twoje sprawdzone przepisy, zawsze pod ręką.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-category:${b.id}:${c.id}">Edytuj dział</button><button class="quiet-button" data-action="scan-photo:${b.id}:${c.id}">▧ Ze zdjęcia</button><button type="button" class="quiet-button" data-action="dictate-recipe:${b.id}:${c.id}">Podyktuj przepis</button><button class="primary-button" data-action="new-recipe:${b.id}:${c.id}">＋ Dodaj przepis</button></div></section><input id="recipe-photo" class="hidden" type="file" accept="image/*">${c.recipes.length?`<div class="toolbar"><input id="recipe-search" class="search" type="search" placeholder="⌕  Szukaj przepisu…" value="${esc(search)}"></div><div id="recipe-search-results"></div>`:empty('Ten dział czeka na przepisy','Dodaj pierwszy przepis ze zdjęcia albo wpisz go ręcznie.','＋ Dodaj przepis',`new-recipe:${b.id}:${c.id}`)}`;
    const input = main.querySelector('#recipe-search');
    if (input) {
      const results = main.querySelector('#recipe-search-results');
      const refreshResults = () => {
        const q = search.trim().toLocaleLowerCase('pl');
        const recipes = c.recipes.filter(r=>recipeMatches(r,q));
        results.innerHTML = recipes.length ? `<div class="grid">${recipes.map((r,i)=>card(r.name,r.sections.length?`${r.sections.length} ${plural(r.sections.length,'etap','etapy','etapów')}`:'Otwórz przepis',['🍲','🥘','🍝','🥧','🥗','🍮'][i%6],colors[(i+1)%colors.length],`recipe:${b.id}:${c.id}:${r.id}`,'recipe-tile',r.photo||'',{size:r.tileTitleSize,weight:r.tileTitleWeight})).join('')}</div>`:`<div class="empty"><div class="empty-icon">⌕</div><h2>Nie znaleziono przepisu</h2><p>Spróbuj wpisać inną nazwę.</p></div>`;
      };
      input.addEventListener('input', () => {
        search = input.value;
        refreshResults();
      });
      refreshResults();
    }
  }
  function renderRecipe(){const b=bookBy(route.book),c=catBy(b,route.category),r=recipeBy(b,c,route.recipe);if(!b||!c||!r){route={type:'home'};return renderHome()};
    const base=Number(r.servings)||4;
    const ingredientRows=r.sections.flatMap((section,si)=>(section.ingredients||[]).map((ingredient,ii)=>({section:si,index:ii,sectionName:section.name||`Etap ${si+1}`,amount:ingredient.amount||'',name:ingredient.name||''})));
    const scaleable=ingredientRows.filter(item=>{const parsed=readQuantity(item.amount);return parsed&&Number.isFinite(parsed.value)&&parsed.value>0});
    main.innerHTML=`<div class="recipe-screen" id="recipe-zoom-area">${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name,route:`category:${b.id}:${c.id}`},{label:r.name}])}${viewZoomControls('Widok przepisu','<button type="button" class="quiet-button" id="recipe-print">Zapisz / drukuj PDF</button>')}<article class="recipe-view"><header class="recipe-cover">${r.photo?`<img class="recipe-photo" src="${esc(r.photo)}" alt="Zdjęcie przepisu">`:''}<div class="eyebrow">${esc(c.name)} · ${esc(b.name)}</div><h1 class="heading">${esc(r.name)}</h1>${r.description?`<p class="recipe-description">${esc(r.description)}</p>`:''}</header><section class="portion-control" aria-label="Przeliczanie przepisu"><div class="calc-field"><label for="scale-scope">Przelicz</label><select id="scale-scope"><option value="all">Cały przepis</option>${r.sections.map((s,i)=>`<option value="${i}">Tylko: ${esc(s.name||`Etap ${i+1}`)}</option>`).join('')}</select></div><div class="calc-field"><label for="scale-mode">Według</label><select id="scale-mode"><option value="portions">Liczby porcji</option><option value="ingredient">Ilości składnika</option><option value="mass">Docelowej masy</option>${r.showPansAndMixer!==false?'<option value="pans">Liczby foremek</option>':''}</select></div><div class="calc-field portion-field" id="portion-setting"><label for="portion-count">Porcje</label><input id="portion-count" type="number" min="1" max="100" step="1" value="${base}"></div><div id="ingredient-setting" class="calc-field" hidden><label for="scale-ingredient">Składnik</label><select id="scale-ingredient"></select></div><div id="target-setting" class="calc-field" hidden><label for="scale-target">Nowa ilość</label><input id="scale-target" type="text" placeholder="np. 300 g"></div><div class="calc-field" id="fixed-goal-setting" hidden><label for="fixed-goal">Cel dla etapu</label><select id="fixed-goal">
      <option value="">Przelicz proporcjonalnie</option><option value="mass">Zachowaj składnik i dopasuj masę</option>
      ${r.showPansAndMixer!==false?'<option value="pans">Zachowaj składnik i dopasuj foremki</option>':''}
    </select></div><div class="calc-field" id="target-mass-setting" hidden><label for="target-mass">Docelowa masa etapu (g)</label><input id="target-mass" type="number" min="1" inputmode="decimal"></div><div class="calc-field" id="pan-count-setting" hidden><label for="pan-count">Liczba foremek</label><input id="pan-count" type="number" min="1" step="1" inputmode="numeric"></div><details class="baking-settings" ${r.showPansAndMixer===false?'hidden':''}><summary>Foremki i limit robota</summary><div class="baking-fields"><div class="calc-field"><label for="pan-mass">Ciasto na foremkę (g)</label><input id="pan-mass" type="number" min="1" inputmode="decimal"></div><div class="calc-field"><label for="mixer-limit">Limit masy ciasta robota (g)</label><input id="mixer-limit" type="number" min="1" inputmode="decimal"></div></div></details><p id="baking-summary" class="calc-note" aria-live="polite" hidden></p><p id="scale-note" class="calc-note">Wybierz, czy przeliczać cały przepis, czy tylko jeden etap.</p></section><div class="top-actions recipe-actions" style="justify-content:flex-end;margin:0 0 14px">${r.sections.length ? `<button type="button" class="quiet-button" data-action="cook-recipe:${b.id}:${c.id}:${r.id}">Tryb gotowania</button>` : ''}<button class="quiet-button" data-action="edit-recipe:${b.id}:${c.id}:${r.id}">Edytuj przepis</button><button type="button" class="quiet-button" data-action="copy-recipe:${b.id}:${c.id}:${r.id}">Skopiuj przepis</button><button class="danger-button" data-action="delete-recipe:${b.id}:${c.id}:${r.id}">Usuń</button></div>${r.sections.map((s,i)=>`<section class="recipe-section" data-scale-section="${i}"><h2>${esc(s.name||`Etap ${i+1}`)}</h2>${s.description?`<p class="section-description">${esc(s.description)}</p>`:''}${s.ingredients?.length?`<div class="label">Składniki</div><ul class="ingredient-list">${s.ingredients.map((x,j)=>`<li><span class="amount" data-base-amount="${esc(x.amount||'')}" data-scale-section="${i}" data-scale-item="${i}:${j}">${esc(x.amount||'')}</span><span>${esc(x.name||'')}${linkedIngredientButton(x)}${r.bakerPercentages?`<small class="baker-percent" data-baker-percent hidden></small>`:''}</span></li>`).join('')}</ul>`:''}${s.instructions?`<div class="label" style="margin-bottom:8px">Jak przygotować</div><p class="instructions">${esc(s.instructions)}</p>`:''}${r.bakerPercentages?`<p class="baker-summary" data-baker-summary hidden></p>`:''}<p class="stage-mass" data-stage-mass hidden></p></section>`).join('')}<div class="bake-journal-button"><button type="button" class="quiet-button" data-action="journal-recipe:${b.id}:${c.id}:${r.id}">Dziennik wypieków</button></div></article></div>`;
    setupRecipeScaling(r,base,scaleable);
    bindViewZoom(r.viewZoom,zoom=>{r.viewZoom=zoom;save();});
    main.querySelector('#recipe-print').addEventListener('click',()=>window.print());
  }

  function viewZoomControls(label,extra='') {
    return `<div class="recipe-tools"><span>${label}</span>
      <button type="button" class="quiet-button" id="recipe-zoom-out" aria-label="Pomniejsz widok">−</button>
      <output id="recipe-zoom-level">100%</output>
      <button type="button" class="quiet-button" id="recipe-zoom-in" aria-label="Powiększ widok">＋</button>${extra}</div>`;
  }

  function bindViewZoom(initialValue,onChange) {
    const area = main.querySelector('#recipe-zoom-area');
    const level = main.querySelector('#recipe-zoom-level');
    let zoom;
    function setZoom(value,persist) {
      zoom = Math.min(1.4,Math.max(.4,Math.round(value*10)/10));
      area.style.setProperty('--recipe-zoom',zoom);
      level.textContent = Math.round(zoom*100)+'%';
      if (persist) onChange(zoom);
    }
    setZoom(Number(initialValue)||1,false);
    main.querySelector('#recipe-zoom-out').addEventListener('click',()=>setZoom(zoom-.1,true));
    main.querySelector('#recipe-zoom-in').addEventListener('click',()=>setZoom(zoom+.1,true));
  }

  function mentionsPrepMethod(text) {
    return /\bsv\b|\bsous[-–\s]+vide\b|(?<![\p{L}\d])(?:konfit(?!ur)\p{L}*|confit)(?![\p{L}\d])/iu.test(text);
  }

  function recipeBelongsToPrep(recipe,category) {
    if (recipe.hideFromPrepIndex) return false;
    if (recipe.prep || mentionsPrepMethod(category.name)) return true;
    return mentionsPrepMethod([recipe.name,recipe.description,
      ...(recipe.sections||[]).flatMap(stage=>[stage.name,stage.instructions])].join(' '));
  }

  function hasPrepTile() {
    if (state.prepTile.hidden) return false;
    return Boolean(state.prepTile.name || state.prepEntries.length || state.books.some(book=>
      book.categories.some(category=>category.recipes.some(recipe=>recipeBelongsToPrep(recipe,category)))));
  }

  function renderPrepIndex() {
    const categories = state.books.flatMap(book=>book.categories.map(category=>({book,category})));
    const existing = categories.flatMap(({book,category})=>category.recipes
      .filter(recipe=>recipeBelongsToPrep(recipe,category)).map(recipe=>({book,category,recipe})));
    const prepName = ({recipe})=>recipe.prep?.name || recipe.name;
    const collator = new Intl.Collator('pl');
    const entries = [...state.prepEntries.map(recipe=>({recipe})),...existing]
      .sort((a,b)=>collator.compare(prepName(a),prepName(b)));
    main.innerHTML = `<div class="recipe-screen" id="recipe-zoom-area">${crumb([{label:'Moja kuchnia',route:'home'},{label:'Prep sous-vide'}])}
      <section class="page-head"><h1 class="heading">Prep sous-vide</h1>
        <button type="button" class="primary-button prep-index-add" data-action="add-index-prep">＋ Dodaj prep SV</button></section>
      <div class="prep-index-toolbar"><input id="prep-index-search" class="search" type="search"
        aria-label="Szukaj prepu sous-vide" placeholder="Szukaj mięsa lub kawałka">
</div>
      ${viewZoomControls('Widok tabeli','<button type="button" class="quiet-button" id="prep-print">Zapisz / drukuj PDF</button>')}
      <div id="prep-index-results"></div></div>`;
    const zoomKey = 'domowa-kuchnia-prep-zoom';
    bindViewZoom(localStorage.getItem(zoomKey),zoom=>localStorage.setItem(zoomKey,String(zoom)));
    const input = main.querySelector('#prep-index-search');
    const results = main.querySelector('#prep-index-results');
    const print = main.querySelector('#prep-print');
    function refresh() {
      const query = input.value.trim().toLocaleLowerCase('pl');
      const matches = entries.filter(({book,category,recipe})=>{
        return recipeMatches(recipe,query) ||
          Boolean(book && `${book.name} ${category.name}`.toLocaleLowerCase('pl').includes(query));
      });
      print.disabled = !matches.length;
      results.innerHTML = matches.length ? `<section class="prep-list">
        <div class="prep-table-scroll" tabindex="0" role="region" aria-label="Tabela prep sous-vide">
        <table class="prep-index-table"><thead><tr>
          <th scope="col">Mięso i kawałek</th><th scope="col">Temperatura (°C)</th>
          <th scope="col">Czas obróbki</th><th scope="col">Porcja / grubość</th><th scope="col">Uwagi</th>
        </tr></thead><tbody>${matches.map(({book,category,recipe})=>{
          const prep = recipe.prep;
          const parameters = prep ? {
            temperature:prep.temperature == null ? '' : prepTemperature(recipe),duration:prep.duration
          } : readPrepParameters(recipe);
          const values = [parameters?.temperature,parameters?.duration,prep?.size,prep?.notes];
          return `<tr><th scope="row"><button type="button" class="text-button"
            data-action="${book?`recipe:${book.id}:${category.id}:${recipe.id}`:`prep-entry:${recipe.id}`}">${esc(prep?.name||recipe.name)}</button>
            <button type="button" class="text-button prep-row-edit" aria-label="Edytuj prep ${esc(prep?.name||recipe.name)}"
              data-action="${book?`edit-table-prep:${book.id}:${category.id}:${recipe.id}`:`edit-index-prep:${recipe.id}`}">Edytuj</button></th>
            ${values.map(value=>`<td>${esc(value||'—')}</td>`).join('')}</tr>`;
        }).join('')}</tbody></table></div></section>` :

          ${query?'Spróbuj wpisać inną nazwę.':'Dodaj prep, aby zapisać pierwszą temperaturę i czas.'}</p></div>`;

    input.addEventListener('input',refresh);

    refresh();
  }

  function readPrepParameters(recipe) {
    const text = [recipe.name,recipe.description,
      ...(recipe.sections||[]).flatMap(stage=>[stage.name,stage.instructions])].join('\n');
    const pairs = new Map();
    for (const line of text.split(/\r?\n/)) {
      if (!mentionsPrepMethod(line) && !/kąpiel/iu.test(line)) continue;
      const temperatures = [...line.matchAll(/(?<![\d.,+–−-])(\d+(?:[,.]\d+)?)\s*°\s*C(?![\p{L}\d])/giu)];
      const durations = [...line.matchAll(/(?<![\d.,+–−-])\d+(?:[,.]\d+)?\s*(?:godz(?:in(?:a|y)?)?\.?|h|min(?:ut(?:a|y)?)?\.?)(?![\p{L}\d])/giu)];
      if (temperatures.length!==1 || durations.length!==1 ||
          /\d\s*[–−-]\s*\d/u.test(line)) continue;
      const temperature = Number(temperatures[0][1].replace(',','.'));
      if (!Number.isFinite(temperature) || temperature<=0) continue;
      const duration = durations[0][0].trim();
      pairs.set(`${temperature}:${duration}`,{temperature:`${String(temperature).replace('.',',')} °C`,duration});
    }
    if (pairs.size===1) return pairs.values().next().value;
  }

  function prepTemperature(recipe) {
    return new Intl.NumberFormat('pl',{maximumFractionDigits:2}).format(recipe.prep.temperature)+' °C';
  }

    const prep = recipe?.prep || {

        <div class="field"><label for="prep-duration">Czas obróbki</label>
          <input id="prep-duration" name="duration" ${existingRecipe?'':'required'} maxlength="80" placeholder="np. 8 godz." value="${esc(prep.duration||'')}"></div>
      </div>

    </form>`,(data,form)=>{
      const field = name=>String(data.get(name)||'').trim();
      const name = field('name'), duration = field('duration');
      const enteredTemperature = field('temperature');
      const temperature = enteredTemperature ? Number(enteredTemperature.replace(',','.')) : null;
      const error = form.querySelector('#prep-error');
      const invalidTemperature = enteredTemperature &&
        (!/^\d+(?:[,.]\d{1,2})?$/.test(enteredTemperature) || !Number.isFinite(temperature) || temperature<=0);
      if (!name || invalidTemperature || (!existingRecipe && (!duration || temperature===null))) {
        error.textContent = existingRecipe
          ? 'Podaj nazwę wpisu. Temperatura, jeśli ją podajesz, musi być powyżej 0 °C.'
          : 'Wpisz nazwę, czas i temperaturę obróbki powyżej 0 °C.';
        error.hidden = false;
        return;
      }
      const previous = category ? category.recipes : state.prepEntries;
      const updatedPrep = {...recipe?.prep,size:field('size'),temperature,duration,notes:field('notes')};
      const entry = existingRecipe
        ? {...recipe,prep:{...updatedPrep,name}}
        : {...recipe,id:recipe?.id||id(),kind:'prep-sv',name,sections:[],prep:updatedPrep};
      const updated = recipe ? previous.map(item=>item.id===recipe.id?entry:item) : [...previous,entry];
      if (category) category.recipes = updated;
      else state.prepEntries = updated;
      try {
        save();
      } catch {
        if (category) category.recipes = previous;
        else state.prepEntries = previous;
        error.textContent = 'Nie udało się zapisać wpisu na tym urządzeniu.';
        error.hidden = false;
        return;

      closeForm();

  function removePrep(entry,category) {

      : `Usunąć prep „${label}”?`;

    else state.prepEntries = previous.filter(item=>item.id!==entry.id);

      save();

      if (category) delete entry.hideFromPrepIndex;
      else state.prepEntries = previous;
      toast('Nie udało się usunąć wpisu.');
      return;
    }
    closeForm();
    navigate('prep-index');
    toast(category?'Wpis usunięty z tabeli':'Prep usunięty');

  function startCooking(recipe) {
    const displayed = new Map([...main.querySelectorAll('[data-scale-item]')].map(el=>[el.dataset.scaleItem,el.textContent]));
    const checked = new Set();
    let step = 0;
    let deadline = 0;
    let timer, audio, alarm;
    showForm('Tryb gotowania',`<div id="cook-stage"></div>
      <div class="cooking-nav"><button type="button" class="quiet-button" id="cook-back">Wstecz</button>
        <button type="button" class="quiet-button" id="cook-next">Dalej</button></div>
      <div class="cooking-nav"><output id="cook-timer" role="status"></output>
        <button type="button" class="quiet-button" id="cook-stop" hidden>Zatrzymaj minutnik</button></div>`);
    const stage = document.querySelector('#cook-stage');
    const back = document.querySelector('#cook-back');
    const next = document.querySelector('#cook-next');
    const clock = document.querySelector('#cook-timer');
    const stop = document.querySelector('#cook-stop');

    function stopTimer() {
      clearInterval(timer);
      clearTimeout(alarm?.hideStop);
      alarm?.oscillator.stop();
      alarm = undefined;
      deadline = 0;
      stop.hidden = true;
      clock.textContent = '';
    }

    function playAlarm() {
      if (!audio || audio.state!=='running') return;
      const oscillator = audio.createOscillator();
      const volume = audio.createGain();
      const start = audio.currentTime+.02;
      volume.gain.value = 0;
      for (let i=0;i<8;i++) {
        const pulse = start+i*.8;
        oscillator.frequency.setValueAtTime(i%2 ? 940 : 720,pulse);
        volume.gain.setValueAtTime(0,pulse);
        volume.gain.linearRampToValueAtTime(.8,pulse+.03);
        volume.gain.setValueAtTime(.8,pulse+.32);
        volume.gain.linearRampToValueAtTime(0,pulse+.42);
      }
      oscillator.connect(volume).connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start+6.4);
      stop.hidden = false;
      alarm = {oscillator,hideStop:setTimeout(()=>{
        alarm = undefined;
        stop.hidden = true;
      },6500)};
    }

    function tick() {
      const seconds = Math.max(0,Math.ceil((deadline-Date.now())/1000));
      if (!seconds) {
        if (document.hidden) return;
        stopTimer();
        clock.textContent = 'Czas minął!';
        navigator.vibrate?.([250,150,250,150,250]);
        if (audio?.state==='running') playAlarm();
        else audio?.resume().then(()=>{
          if (clock.isConnected && clock.textContent==='Czas minął!') playAlarm();
        }).catch(()=>{});
        return;
      }
      clock.textContent = `Minutnik: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
    }

    function resumeTimer() {
      if (deadline && !document.hidden) tick();
    }

    function renderStage() {
      const section = recipe.sections[step];
      const times = new Map();
      const text = section.instructions || '';
      for (const match of text.matchAll(/(\d+(?:[,.]\d+)?)\s*(godz(?:in(?:y|a)?)?|h|min(?:ut(?:y|a)?)?|sek(?:und(?:y|a)?)?|s)(?![\p{L}\d])/giu)) {
        const unit = match[2].toLowerCase();
        const multiplier = unit==='h'||unit.startsWith('godz') ? 3600 : unit.startsWith('min') ? 60 : 1;
        const seconds = Math.round(Number(match[1].replace(',','.'))*multiplier);
        if (seconds>0 && seconds<=86400) times.set(seconds,match[0]);
      }
      stage.innerHTML = `<p class="eyebrow">Etap ${step+1} z ${recipe.sections.length}</p>
        <h3>${esc(section.name || `Etap ${step+1}`)}</h3>
        ${section.description ? `<p>${esc(section.description)}</p>` : ''}
        <ul class="cooking-ingredients">${(section.ingredients||[]).map((item,i)=>{
          const key = `${step}:${i}`;
          const amount = displayed.get(key) ?? item.amount ?? '';
          return `<li><label><input type="checkbox" data-cook-ingredient="${key}" ${checked.has(key)?'checked':''}>
            <span>${esc(amount)} ${esc(item.name||'')}</span></label></li>`;
        }).join('')}</ul>
        ${text ? `<p class="instructions">${esc(text)}</p>` : ''}
        <div class="cooking-nav">${[...times].map(([seconds,label])=>
          `<button type="button" class="quiet-button" data-cook-timer="${seconds}">Minutnik · ${esc(label)}</button>
          ${appleTouchDevice ? `<a class="quiet-button" href="shortcuts://run-shortcut?name=Minutnik%20Moja%20kuchnia&amp;input=text&amp;text=${seconds}">Zegar iPhone’a · ${esc(label)}</a>` : ''}`).join('')}</div>
        ${appleTouchDevice && times.size ? '<p class="scan-help">Po zablokowaniu telefonu użyj opcji „Zegar iPhone’a”. Wymaga skrótu „Minutnik Moja kuchnia”.</p>' : ''}`;
      back.disabled = step===0;
      next.disabled = step===recipe.sections.length-1;
    }
    stage.addEventListener('change',event=>{
      const key = event.target.dataset.cookIngredient;
      if (!key) return;
      if (event.target.checked) checked.add(key);
      else checked.delete(key);
    });
    stage.addEventListener('click',event=>{
      const button = event.target.closest('[data-cook-timer]');
      if (!button) return;
      stopTimer();
      const Audio = window.AudioContext || window.webkitAudioContext;
      if (Audio && !audio) {
        try { audio = new Audio(); } catch {}
      }
      audio?.resume().catch(()=>{});
      deadline = Date.now()+Number(button.dataset.cookTimer)*1000;
      stop.hidden = false;
      tick();
      timer = setInterval(tick,250);
    });
    back.addEventListener('click',()=>{step--;renderStage();});
    next.addEventListener('click',()=>{step++;renderStage();});
    stop.addEventListener('click',stopTimer);
    document.addEventListener('visibilitychange',resumeTimer);
    formCleanup = () => {
      stopTimer();
      document.removeEventListener('visibilitychange',resumeTimer);
      audio?.close().catch(()=>{});
    };
    renderStage();
  }

  function setupRecipeScaling(recipe,base,scaleable) {
    const scope = main.querySelector('#scale-scope');
    const mode = main.querySelector('#scale-mode');
    const portions = main.querySelector('#portion-count');
    const items = main.querySelector('#scale-ingredient');
    const target = main.querySelector('#scale-target');
    const targetMass = main.querySelector('#target-mass');
    const fixedGoal = main.querySelector('#fixed-goal');
    const panCount = main.querySelector('#pan-count');
    const panMass = main.querySelector('#pan-mass');
    const mixerLimit = main.querySelector('#mixer-limit');
    const note = main.querySelector('#scale-note');
    const bakingSummary = main.querySelector('#baking-summary');
    const sections = [...main.querySelectorAll('.recipe-section[data-scale-section]')];
    const amountsBySection = sections.map(section => [...section.querySelectorAll('[data-base-amount]')]);
    const baseMasses = amountsBySection.map((amounts,i) => summarizeMass(amounts.map(el=>el.dataset.baseAmount),recipe.sections[i].ingredients));
    const defaultStage = baseMasses.findLastIndex(mass=>mass?.max>0);
    if (recipe.showPansAndMixer!==false) mixerLimit.value = localStorage.getItem('domowa-kuchnia-mixer-limit') || '';

    function refreshItems() {
      const previous = items.value;
      const visible = scaleable.filter(item=>scope.value==='all'||String(item.section)===scope.value);
      items.innerHTML = visible.length ? visible.map(item=>
        `<option value="${item.section}:${item.index}">${esc(item.sectionName)} · ${esc(item.name)} (${esc(item.amount)})</option>`
      ).join('') : '<option value="">Brak składników z podaną ilością</option>';
      const selected = visible.find(item=>`${item.section}:${item.index}`===previous) || visible[0];
      if (selected) items.value = `${selected.section}:${selected.index}`;
      target.value = selected?.amount || '';
    }

    function recalculate() {
      const ingredientMode = mode.value==='ingredient';
      const fixed = ingredientMode && Boolean(fixedGoal.value);
      const byMass = mode.value==='mass' || (fixed && fixedGoal.value==='mass');
      const byPans = mode.value==='pans' || (fixed && fixedGoal.value==='pans');
      const baking = byMass || byPans;
      const selected = ingredientMode ? scaleable.find(item=>`${item.section}:${item.index}`===items.value) : null;
      scope.options[0].disabled = baking && !fixed;
      if (baking && !fixed && scope.value==='all' && defaultStage>=0) scope.value = String(defaultStage);
      main.querySelector('#portion-setting').hidden = mode.value!=='portions';
      main.querySelector('#ingredient-setting').hidden = !ingredientMode;
      main.querySelector('#target-setting').hidden = !ingredientMode;
      main.querySelector('label[for=scale-target]').textContent = fixed ? 'Ilość stała' : 'Nowa ilość';
      main.querySelector('#fixed-goal-setting').hidden = !ingredientMode;
      main.querySelector('#target-mass-setting').hidden = !byMass;
      main.querySelector('#pan-count-setting').hidden = !byPans;
      const selectedStage = fixed && selected ? selected.section : scope.value==='all' ? defaultStage : Number(scope.value);
      const gramsPerPan = Number(panMass.value);
      let ratio = Math.min(100,Math.max(1,Number(portions.value)||base))/base;
      let targetLabel = '';
      let plannedMass, plannedEstimated, fixedIngredientRatio;
      let explanation = 'Przeliczenie zmienia tylko podgląd.';
      if (ingredientMode) {
        const source = readQuantity(selected?.amount);
        const desired = readQuantity(target.value);
        const sourceMass = ingredientMassUnit(source?.tail,selected?.name);
        const desiredMass = ingredientMassUnit(desired?.tail,selected?.name);
        const sourceVolume = !sourceMass && volumeUnit(source?.tail);
        const desiredVolume = !desiredMass && volumeUnit(desired?.tail);
        const sourceFactor = sourceMass || sourceVolume;
        const desiredFactor = desiredMass || desiredVolume;
        if (!source || !desired || !Number.isFinite(desired.value) || desired.value<=0 ||
            (desired.tail.trim() && (Boolean(sourceMass)!==Boolean(desiredMass) || Boolean(sourceVolume)!==Boolean(desiredVolume)))) {
          ratio = 1;
          explanation = 'Wpisz dodatnią ilość w zgodnej jednostce.';
        } else {
          ratio = (desired.value*(desiredFactor||sourceFactor||1))/(source.value*(sourceFactor||1));
          targetLabel = desired.tail.trim() ? target.value.trim() : target.value.trim()+source.tail;
        }
      }
      if (baking) {
        const weight = baseMasses[selectedStage];
        const pans = Number(panCount.value);
        const wanted = byMass ? Number(targetMass.value) : (Number.isInteger(pans) && pans>0 ? pans*gramsPerPan : 0);
        const fixedLabel = targetLabel;
        ratio = 1;
        targetLabel = '';
        if (fixed && !fixedLabel) {
          explanation = 'Wybierz składnik i wpisz dodatnią ilość w zgodnej jednostce.';
        } else if (!Number.isFinite(wanted) || wanted<=0) {
          explanation = byMass ? 'Wpisz docelową masę etapu w gramach.' : 'Wpisz liczbę foremek i masę ciasta na jedną foremkę.';
        } else if (fixed) {
          const ingredient = recipe.sections[selectedStage].ingredients[selected.index];
          const amounts = amountsBySection[selectedStage].map(el=>el.dataset.baseAmount);
          const others = summarizeMass(amounts.filter((_,i)=>i!==selected.index),
            recipe.sections[selectedStage].ingredients.filter((_,i)=>i!==selected.index));
          const fixedMass = summarizeMass([fixedLabel],[ingredient]);
          const originalFixed = summarizeMass([selected.amount],[ingredient]);
          if (!fixedMass || fixedMass.min!==fixedMass.max || !originalFixed || originalFixed.min!==originalFixed.max || !others || others.min<=0 ||
              others.partial || others.min!==others.max) {
            explanation = 'Podaj masę stałego składnika i dokładne ilości pozostałych składników w tym etapie.';
          } else if (wanted<fixedMass.min) {
            explanation = 'Stały składnik waży więcej niż docelowa masa całego etapu.';
          } else {
            ratio = (wanted-fixedMass.min)/others.min;
            targetLabel = fixedLabel;
            plannedMass = wanted;
            plannedEstimated = fixedMass.estimated || others.estimated;
            if (/^(zaczyn|zakwas)(?=\s|$)/iu.test((ingredient.name||'').trim()) && originalFixed?.min>0) {
              fixedIngredientRatio = fixedMass.min/originalFixed.min;
            }
            explanation = `Stała ilość: ${formatGrams(fixedMass.min)}. Pozostałe składniki: ${formatGrams(wanted-fixedMass.min)}. Przeliczono tylko etap „${selected.sectionName}”.`;
          }
        } else if (!weight || weight.min<=0 || weight.partial || weight.min!==weight.max) {

    const depth = history.state?.cookbook ? history.state.depth : 0;
    if (changed) {
      if (useAppBackStack) appBackStack.push(navigationState(appBackStack.length));
      else history.replaceState(navigationState(depth),'');
    }
    route = next;
    if (type==='home' || type==='category') search='';
    render();
    window.scrollTo(0,0);
    if (useAppBackStack) return;
    if (changed) {
      displayedDepth = depth+1;
      history.pushState(navigationState(displayedDepth),'');
    }
    else history.replaceState(navigationState(depth),'');
  }

  function setupBackNavigation() {
    history.scrollRestoration = 'manual';
    const standalone = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    useAppBackStack = appleTouchDevice && standalone;
    if (!useAppBackStack) {
      history.replaceState(navigationState(0),'');
      window.addEventListener('popstate',event=>{
        const previous = event.state;
        if (!previous?.cookbook || previous.depth===displayedDepth) return;
        if (previous.depth<displayedDepth-1) {
          history.go(displayedDepth-1-previous.depth);
          return;
        }
        displayedDepth = previous.depth;
        showPreviousView(previous);
      });
      return;
    }

    document.documentElement.classList.add('app-swipe');
    let edgeTouch;
    document.addEventListener('touchstart',event=>{
      edgeTouch = undefined;
      if (!appBackStack.length || event.touches.length!==1 || document.querySelector('.form-overlay') ||
          event.target.closest('button,a,input,textarea,select,.prep-table-scroll')) return;
      const touch = event.touches[0];
      if (touch.clientX>24 || window.visualViewport?.scale>1.05 || !event.cancelable) return;
      // Claim the edge before iOS can show a screenshot from browser history.
      event.preventDefault();
      edgeTouch = {id:touch.identifier,x:touch.clientX,y:touch.clientY,depth:appBackStack.length,claimed:false};
    },{capture:true,passive:false});
    document.addEventListener('touchmove',event=>{
      if (!edgeTouch) return;
      const touch = event.touches[0];
      if (event.touches.length!==1 || touch.identifier!==edgeTouch.id) {
        edgeTouch = undefined;
        return;
      }
      const x = touch.clientX-edgeTouch.x;
      const y = Math.abs(touch.clientY-edgeTouch.y);
      if (!edgeTouch.claimed && (y>18 && y>=x || x<-8)) {
        edgeTouch = undefined;
        return;
      }
      if (x>14 && x>y*1.5) edgeTouch.claimed = true;
      if (edgeTouch.claimed && event.cancelable) event.preventDefault();
    },{passive:false});
    document.addEventListener('touchend',event=>{
      if (!edgeTouch) return;
      const touch = [...event.changedTouches].find(item=>item.identifier===edgeTouch.id);
      const gesture = edgeTouch;
      edgeTouch = undefined;
      if (!touch || !gesture.claimed) return;
      const x = touch.clientX-gesture.x;
      const y = Math.abs(touch.clientY-gesture.y);
      if (x>=65 && x>y*1.5 && gesture.depth===appBackStack.length) {
        showPreviousView(appBackStack.pop());
      }
    },{passive:true});
    document.addEventListener('touchcancel',()=>{edgeTouch=undefined;},{passive:true});
  }

  function readBakingStage(section,index) {
    const flour = Number(section.querySelector('[data-starter-flour]').value);
    const water = Number(section.querySelector('[data-starter-water]').value);
    return {
      ...(flour>0?{starterFlourGrams:flour}:{}),
      ...(water>0?{starterWaterGrams:water}:{}),
      ...(index>0&&section.querySelector('[data-baker-continue]').checked?{continuesPreviousStage:true}:{})
    };
  }
  function parseDictatedStage(text,defaultName,numbered) {
    const method = /(?:^|[\s.!?:;,])(?:sposób przygotowania|przygotowanie|wykonanie)(?=[\s:.,;]|$)\s*[:.,;]?\s*/iu.exec(text);
    const beforeMethod = method ? text.slice(0,method.index) : text;
    const ingredientHeading = /(?:^|[\s.!?:;,])(?:lista składników|składniki)(?=[\s:.,;]|$)\s*[:.,;]?\s*/iu.exec(beforeMethod);
    const firstQuantity = numbered && !ingredientHeading
      ? /(?:^|[\s:;,])(?=\d+(?:[,.]\d+)?\s*(?:g|gram\p{L}*|kg|kilogram\p{L}*|mg|ml|mililitr\p{L}*|l|litr\p{L}*|dag|dkg|łyż\p{L}*|szklan\p{L}*|szt\.?|sztuk\p{L}*)(?=\s))/iu.exec(beforeMethod)
      : null;
    const start = ingredientHeading || firstQuantity;
    const nameText = (start ? beforeMethod.slice(0,start.index) : beforeMethod)
      .replace(/^[\s:.,;–—-]+|[\s:.,;–—-]+$/gu,'').trim();
    const ingredientText = start ? beforeMethod.slice(start.index+start[0].length) : '';
    const ingredients = parseDictatedIngredients(ingredientText.replace(/\bprzecinek\b/giu,','));
    const instructions = method ? text.slice(method.index+method[0].length).trim() : '';
    if (!ingredients.length && !instructions) return null;
    return {name:nameText||defaultName,ingredients,instructions};
  }

  function parseDictatedRecipe(text) {
    const source = text.trim().replace(/\bnowy wiersz\b/giu,'\n');
    const markers = [...source.matchAll(/(?<![\p{L}\d])etap\s+(?:nr\.?\s+)?(?:\d+|pierwszy|drugi|trzeci|czwarty|piąty|piaty|szósty|szosty|siódmy|siodmy|ósmy|osmy|dziewiąty|dziewiaty|dziesiąty|dziesiaty|jeden|dwa|trzy|cztery|pięć)(?=[\s:.,;–—-]|$)[\s:.,;–—-]*/giu)];
    const title = value => value.trim().replace(/^tytuł(?: przepisu)?[\s:.,;]+/iu,'')
      .replace(/[\s:.,;]+$/u,'').slice(0,90).trim();
    if (markers.length) {
      const name = title(source.slice(0,markers[0].index)) || 'Podyktowany przepis';
      const sections = markers.map((marker,i)=>parseDictatedStage(
        source.slice(marker.index+marker[0].length,markers[i+1]?.index),`Etap ${i+1}`,true));
      if (sections.some(section=>!section)) return null;
      return {name,servings:1,sections};
    }
    const stage = parseDictatedStage(source,'',false);
    const name = title(stage?.name||'');
    if (!name || !stage.ingredients.length || !stage.instructions) return null;
    return {name,servings:1,sections:[{...stage,name:'Przygotowanie'}]};
  }

  function parseDictatedIngredients(text) {
    const units = [
      ['mg','mg|miligram(?:a|y|ów)?'], ['g','g|gram(?:a|y|ów)?'],
      ['dag','dag|dkg|dekagram(?:a|y|ów)?'], ['kg','kg|kilogram(?:a|y|ów)?'],
      ['ml','ml|mililitr(?:a|y|ów)?'], ['l','l|litr(?:a|y|ów)?'],
      ['szt.','szt\\.?|sztuk(?:a|i|ę)?'], ['łyżka','łyż(?:ka|ki|kę|ek)'],
      ['łyżeczka','łyżecz(?:ka|ki|kę|ek)'], ['szklanka','szkl(?:anka|anki|ankę|anek)']
    ];
    const unitPattern = units.map(([,pattern])=>pattern).join('|');
    const unitStart = new RegExp(String.raw`^(?:${unitPattern})(?=\s|$)`,'iu');
    const nextMeasured = new RegExp(String.raw`\s+(?:i\s+)?(?=\d+(?:[,.]\d+)?\s*(?:${unitPattern})(?=\s|$))`,'giu');
    const lastMeasured = new RegExp(String.raw`^(\p{L}.*?)\s+(\d+\s+\d+/\d+|\d+/\d+|\d+(?:[,.]\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])\s*(${unitPattern})$`,'iu');
    const canonicalUnit = unit => units.find(([,pattern])=>new RegExp('^(?:'+pattern+')$','iu').test(unit))?.[0] || unit;
    const basicNumbers = {pół:'0,5',jeden:'1',jedna:'1',jedną:'1',jedno:'1',dwa:'2',dwie:'2',trzy:'3',cztery:'4',pięć:'5',sześć:'6',siedem:'7',osiem:'8',dziewięć:'9',dziesięć:'10'};
    return text.split(/\r?\n|;|(?<!\d),|,(?!\d)/u)
      .map(line=>line.trim().replace(/^i\s+/iu,'').replace(/^[•–-]\s*/u,'').replace(/[.!?]+$/u,'').trim())
      .flatMap(line=>lastMeasured.test(line) ? [line] : line.split(nextMeasured))
      .map(chunk=>chunk.trim())
      .filter(Boolean)
      .map(chunk=>{
        const reversed = chunk.match(lastMeasured);
        if (reversed) {
          const [,name,number,unit] = reversed;
          return {amount:number+' '+canonicalUnit(unit),name:name.trim().replace(/\s*[:–—-]$/u,'')};
        }
        const first = chunk.match(/^([\p{L}]+)\s+/u);
        const word = first?.[1].toLocaleLowerCase('pl');
        const normalized = first && Object.hasOwn(basicNumbers,word) ? basicNumbers[word]+' '+chunk.slice(first[0].length) : chunk;
        const quantity = readQuantity(normalized);
        if (!quantity || !Number.isFinite(quantity.value)) return {amount:'',name:chunk};
        const number = normalized.slice(0,normalized.length-quantity.tail.length).trim();
        const tail = quantity.tail.trim();
        const unit = tail.match(unitStart)?.[0];
        const name = unit ? tail.slice(unit.length).trim() : tail;
        if (!name) return {amount:'',name:chunk};
        return {amount:unit ? number+' '+canonicalUnit(unit) : number,name};
      });
  }

  function bindIngredientDragging(root) {
    const scroller = root.closest('.dialog');
    let drag;
    let frame;

    function reorder() {
      const {row,group,y} = drag;
      const next = [...group.children].find(candidate=>{
        if (candidate===row) return false;
        const bounds = candidate.getBoundingClientRect();
        return y<bounds.top+bounds.height/2;
      }) || null;
      if (row.nextElementSibling!==next) group.insertBefore(row,next);
    }

    function autoScroll() {
      if (!drag?.active || !root.isConnected) return;
      const bounds = scroller.getBoundingClientRect();
      const list = drag.group.getBoundingClientRect();
      const margin = 48;
      let speed = 0;
      if (drag.y<bounds.top+margin && list.top<bounds.top) {
        speed = -Math.min(16,(bounds.top+margin-drag.y)/3);
      }
      if (drag.y>bounds.bottom-margin && list.bottom>bounds.bottom) {
        speed = Math.min(16,(drag.y-bounds.bottom+margin)/3);
      }
      if (speed) {
        scroller.scrollTop += speed;
        reorder();
      }
      frame = requestAnimationFrame(autoScroll);
    }

    function finish(event,cancelled=false) {
      if (!drag || event.pointerId!==drag.pointer) return;
      const {row,group,next,pointer} = drag;
      drag = undefined;
      cancelAnimationFrame(frame);
      row.classList.remove('ingredient-dragging');
      if (cancelled && group.contains(row)) group.insertBefore(row,next);
      if (root.hasPointerCapture(pointer)) root.releasePointerCapture(pointer);
    }

    root.addEventListener('pointerdown',event=>{
      const handle = event.target.closest('[data-drag-ingredient]');
      if (!handle || drag || event.button!==0 || !event.isPrimary) return;
      const row = handle.closest('.ingredient-editor');
      const group = row.parentElement;
      if (group.children.length<2) return;
      drag = {row,group,next:row.nextElementSibling,pointer:event.pointerId,startY:event.clientY,y:event.clientY,active:false};
      root.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    root.addEventListener('pointermove',event=>{
      if (!drag || event.pointerId!==drag.pointer) return;
      drag.y = event.clientY;
      if (!drag.active) {
        if (Math.abs(drag.y-drag.startY)<5) return;
        drag.active = true;
        drag.row.classList.add('ingredient-dragging');
        frame = requestAnimationFrame(autoScroll);
      }
      reorder();
    });
    root.addEventListener('pointerup',event=>finish(event));
    root.addEventListener('pointercancel',event=>finish(event,true));
    root.addEventListener('lostpointercapture',event=>finish(event,true));
    root.addEventListener('keydown',event=>{
      const handle = event.target.closest('[data-drag-ingredient]');
      if (!handle || (event.key!=='ArrowUp' && event.key!=='ArrowDown')) return;
      const row = handle.closest('.ingredient-editor');
      event.preventDefault();
      if (event.key==='ArrowUp') row.previousElementSibling?.before(row);
      else row.nextElementSibling?.after(row);
      handle.focus();
    });
  }
