    <div class="top-actions">
      <button type="button" class="quiet-button backup-button" id="import-button" title="Wczytaj kopię zapasową" aria-label="Wczytaj kopię zapasową">
        <svg class="backup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 3h7a2 2 0 0 1 2 2v1M3 18l3-7a2 2 0 0 1 2-1h12a1 1 0 0 1 1 1.4l-3 7.4a2 2 0 0 1-2 1.2H5a2 2 0 0 1-2-2Z"/></svg>
        <span class="backup-label">Wczytaj kopię</span>
      </button>
      <button type="button" class="quiet-button backup-button" id="export-button" title="Zapisz kopię zapasową" aria-label="Zapisz kopię zapasową">
        <svg class="backup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h13l4 4v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M7 3v6h9V3M7 21v-8h10v8"/></svg>
        <span class="backup-label">Zapisz kopię</span>
      </button>
      <input id="import-file" type="file" accept="application/json,.json" class="hidden">
    </div>
  </header>
  <aside id="storage-warning" class="empty" hidden aria-live="polite">
    <p id="storage-warning-text"></p>
    <button type="button" id="reload-cookbook" class="quiet-button">Wczytaj najnowsze dane</button>
  </aside>
  <main id="main" class="main"></main>
  <p class="footer-note">Twoje przepisy są zapisane na tym urządzeniu.</p>
</div>
<aside id="cooking-timer-dock" class="cooking-timer-dock" aria-label="Minutnik gotowania" hidden>
  <output aria-live="off"></output><button type="button" class="quiet-button">Zatrzymaj</button>
</aside>
<div id="overlay-root"></div><div id="toast-root"></div>
<script src="./recipe-link-import.js"></script>
<script src="./cookbook-storage.js"></script>
<script>
(()=>{
  const KEY='domowa-kuchnia-v1';
  const colors=['#e7eee4','#f7e8dc','#eee8f4','#e5eef1','#f2ebd8','#f3e5e7'];
  const icons=['📖','🍃','🍲','🥣','🍰','🫙','🥗','🍋'];
  let savedCookbook = null;
  let damagedCookbook = false;
  let state=load(), route={type:'home'}, search='', homeSearch='';
  const main=document.querySelector('#main');
  function load() {
    try {
      savedCookbook = localStorage.getItem(KEY);
      if (savedCookbook!==null) return cookbookStorage.normalize(JSON.parse(savedCookbook));
    } catch {
      damagedCookbook = true;
    }
    return {books:[],prepEntries:[],prepTile:{},tables:[]};
  }

  function showStorageWarning(message,canReload) {
    document.querySelector('#storage-warning-text').textContent = message;
    document.querySelector('#reload-cookbook').hidden = !canReload;
    document.querySelector('#storage-warning').hidden = false;
  }

  function warnAboutNewerCookbook() {
    showStorageWarning('Książka zmieniła się w innej karcie. Przed zapisem wczytaj najnowsze dane.',true);
  }

  function save(next=state,{allowReplacement=false}={}) {
    if (damagedCookbook && !allowReplacement) {
      throw Object.assign(new Error('Odtwórz prawidłową kopię przed zapisaniem zmian.'),{name:'CookbookRecoveryError'});
    }
    if (localStorage.getItem(KEY)!==savedCookbook) {
      warnAboutNewerCookbook();
      throw Object.assign(new Error('Książka zmieniła się w innej karcie. Wczytaj najnowsze dane.'),{name:'CookbookConflictError'});
    }
    const snapshot = JSON.stringify(next);
    localStorage.setItem(KEY,snapshot);
    savedCookbook = snapshot;
    damagedCookbook = false;
    document.querySelector('#storage-warning').hidden = true;
  }

  window.addEventListener('storage',event=>{
    if (event.storageArea===localStorage && (event.key===KEY || event.key===null) &&
        localStorage.getItem(KEY)!==savedCookbook) warnAboutNewerCookbook();
  });
  document.querySelector('#reload-cookbook').addEventListener('click',()=>location.reload());
  if (damagedCookbook) {
    showStorageWarning('Dane zapisane w przeglądarce są nieczytelne. Możesz je pobrać lub odtworzyć prawidłową kopię.',false);
  }
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const bookBy=id=>state.books.find(x=>x.id===id), catBy=(b,id)=>b?.categories.find(x=>x.id===id), recipeBy=(b,c,id)=>c?.recipes.find(x=>x.id===id);
  function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function crumb(items){return `<nav class="crumbs">${items.map((x,i)=>i<items.length-1?`<button class="crumb" data-route="${x.route}">${esc(x.label)}</button><span>›</span>`:`<span class="crumb current">${esc(x.label)}</span>`).join('')}</nav>`}
  function card(title,meta,icon,tint,action,cls='',photo='',tileStyle={}){const size=[22,26,30,34].includes(Number(tileStyle.size))?Number(tileStyle.size):26,weight=[400,500,600,700,800].includes(Number(tileStyle.weight))?Number(tileStyle.weight):700;return `<button class="tile ${cls}${photo?' has-photo':''}" data-action="${action}" style="--tint:${tint};--tile-title-size:${size}px;--tile-title-weight:${weight}">${photo?`<img class="tile-photo" src="${esc(photo)}" loading="lazy" decoding="async" alt="">`:''}<span class="tile-arrow">↗</span>${photo?'':`<span class="tile-icon">${icon}</span>`}<span class="tile-title">${esc(title)}</span><span class="tile-meta">${esc(meta)}</span></button>`}
  function empty(title,body,button,action){return `<div class="empty"><div class="empty-icon">🥄</div><h2>${title}</h2><p>${body}</p><button class="primary-button" data-action="${action}">${button}</button></div>`}
  function tileStyleFields(item={}){const size=[22,26,30,34].includes(Number(item?.tileTitleSize))?Number(item.tileTitleSize):26,weight=[400,500,600,700,800].includes(Number(item?.tileTitleWeight))?Number(item.tileTitleWeight):700;return '<div class="field-row"><div class="field"><label>Wielkość nazwy na kafelku</label><select name="tileTitleSize"><option value="22" '+(size===22?'selected':'')+'>Mała</option><option value="26" '+(size===26?'selected':'')+'>Średnia</option><option value="30" '+(size===30?'selected':'')+'>Duża</option><option value="34" '+(size===34?'selected':'')+'>Bardzo duża</option></select></div><div class="field"><label>Grubość czcionki</label><select name="tileTitleWeight"><option value="400" '+(weight===400?'selected':'')+'>Zwykła</option><option value="500" '+(weight===500?'selected':'')+'>Lekko pogrubiona</option><option value="600" '+(weight===600?'selected':'')+'>Średnia</option><option value="700" '+(weight===700?'selected':'')+'>Pogrubiona</option><option value="800" '+(weight===800?'selected':'')+'>Bardzo pogrubiona</option></select></div></div>'}
  function render(){
    if (appleTouchDevice && isInlineEditor(document.activeElement)) document.activeElement.blur();
    if(route.type==='home')return renderHome();
    if(route.type==='prep-index')return renderPrepIndex();
    if(route.type==='custom-table')return renderCustomTable(state.tables.find(table=>table.id===route.id));
    if(route.type==='prep-entry')return renderPrep(state.prepEntries.find(entry=>entry.id===route.id));
    if(route.type==='book')return renderBook();
    if(route.type==='category')return renderCategory();
    if(route.type==='recipe')return renderRecipe();
  }
  function renderHome(){
    const books=state.books;
    const prepTile=state.prepTile;
    const showPrep=hasPrepTile();
    const hasTiles=showPrep || books.length || state.tables.length;
    main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Twoje domowe zbiory</div><h1 class="heading">Smaki, do których<br>chce się wracać.</h1><p class="subheading">Wszystkie Twoje przepisy w jednym, przytulnym miejscu.</p></div><button type="button" class="primary-button" data-action="add-home-item">＋ Dodaj</button></section>
      <div class="toolbar"><input id="home-recipe-search" class="search" type="search"
        aria-label="Szukaj przepisu we wszystkich książkach" placeholder="Szukaj przepisu we wszystkich książkach"
        value="${esc(homeSearch)}"></div>
      <div id="home-recipe-results" hidden></div>
      <div id="home-books">${hasTiles?`<div class="grid">${showPrep?`<div class="tile-edit-wrap">${card(prepTile.name||'Prep sous-vide','Temperatury i czasy obróbki','🌡️',colors[2],
        'prep-index','',prepTile.photo||'',{size:prepTile.tileTitleSize,weight:prepTile.tileTitleWeight})}
        <button type="button" class="text-button tile-edit-link" data-action="edit-prep-tile">Edytuj kafelek Prep</button></div>`: ''}${state.tables.map((table,i)=>`<div class="tile-edit-wrap">
        ${card(table.name,'Tabela','📋',colors[(i+3)%colors.length],`custom-table:${table.id}`,'',table.photo||'')}
        <button type="button" class="text-button tile-edit-link" data-action="edit-custom-table:${table.id}">Edytuj tabelę</button></div>`).join('')}${books.map((b,i)=>`<div class="tile-edit-wrap">${card(b.name,`${b.categories.length} ${plural(b.categories.length,'dział','działy','działów')}`,icons[i%icons.length],colors[i%colors.length],`book:${b.id}`,'',b.photo||'',{size:b.tileTitleSize,weight:b.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-book:${b.id}">Edytuj nazwę i zdjęcie książki</button></div>`).join('')}</div>`:empty('Tu pojawią się Twoje książki i tabele','Dodaj pierwszą książkę lub własną tabelę albo wczytaj kopię zapasową.','＋ Dodaj','add-home-item')}</div>`;
    const input = main.querySelector('#home-recipe-search');
    const results = main.querySelector('#home-recipe-results');
    const bookList = main.querySelector('#home-books');
    const homePager = recipePager(results);
    function refreshResults() {
      const query = searchText(homeSearch);
      results.hidden = !query;
      bookList.hidden = Boolean(query);
      if (!query) {
        homePager.set([]);
        return;
      }
      const matches = books.flatMap(book => book.categories.flatMap(category =>
        category.recipes.filter(recipe => recipeMatches(recipe,query)).map(recipe => ({book,category,recipe}))));
      matches.push(...state.prepEntries.filter(recipe=>recipeMatches(recipe,query)).map(recipe=>({recipe})));
      homePager.set(matches,({book,category,recipe},i)=>card(recipe.name,recipe.kind==='prep-sv'?
          `${prepTemperature(recipe)} · ${recipe.prep.duration} · Prep sous-vide`:`${book.name} · ${category.name}`,'📖',colors[i%colors.length],
          book?`recipe:${book.id}:${category.id}:${recipe.id}`:`prep-entry:${recipe.id}`,'recipe-tile',recipe.photo||'',
          {size:recipe.tileTitleSize,weight:recipe.tileTitleWeight}));
    }
    input.addEventListener('input', () => {
      homeSearch = input.value;
      refreshResults();
    });
    refreshResults();
  }

  function searchText(value) {
    return String(value??'').trim().toLocaleLowerCase('pl').normalize('NFD')
      .replace(/\p{M}/gu,'').replace(/ł/g,'l');
  }

  function recipePager(results) {
    const pageSize = 48;
    let entries = [], cardMarkup, shown = 0;
    results.innerHTML = `<div class="grid"></div><div class="empty" hidden>
      <h2>Nie znaleziono przepisu</h2><p>Spróbuj wpisać inną nazwę.</p></div>
      <button type="button" class="quiet-button recipe-more" hidden>Pokaż kolejne</button>`;
    const grid = results.querySelector('.grid');
    const empty = results.querySelector('.empty');
    const more = results.querySelector('.recipe-more');
    function appendPage(keepFocus=false) {
      const page = entries.slice(shown,shown+pageSize);
      const firstIndex = shown;
      grid.insertAdjacentHTML('beforeend',page.map((entry,i)=>cardMarkup(entry,firstIndex+i)).join(''));
      shown += page.length;
      more.hidden = shown>=entries.length;
      if (!more.hidden) more.textContent = `Pokaż kolejne (${entries.length-shown})`;
      if (keepFocus) grid.children[firstIndex]?.focus();
    }
    more.addEventListener('click',()=>appendPage(true));
    return {
      set(items,markup) {
        entries = items;
        cardMarkup = markup;
        shown = 0;
        grid.replaceChildren();
        empty.hidden = entries.length>0;
        appendPage();
      }
    };
  }

  function recipeMatches(recipe,query) {
    const prep = recipe.prep;
    const values = [recipe.name,recipe.description];
    if (prep) values.push('prep sous-vide',prep.name,prep.temperature == null ? '' : prepTemperature(recipe),prep.duration,prep.size,prep.notes);
    return searchText(values.join(' ')).includes(query);
  }
  function renderBook(){const b=bookBy(route.book);if(!b){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'}, {label:b.name}])}<section class="page-head"><div><div class="eyebrow">Książka kucharska</div><h1 class="heading">${esc(b.name)}</h1><p class="subheading">Wybierz dział albo dodaj nowy.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-book:${b.id}">Edytuj</button><button class="primary-button" data-action="new-category:${b.id}">＋ Dodaj dział</button></div></section>${b.categories.length?`<div class="grid">${b.categories.map((c,i)=>`<div class="tile-edit-wrap">${card(c.name,`${c.recipes.length} ${plural(c.recipes.length,'przepis','przepisy','przepisów')}`,icons[(i+1)%icons.length],colors[(i+2)%colors.length],`category:${b.id}:${c.id}`,'',c.photo||'',{size:c.tileTitleSize,weight:c.tileTitleWeight})}<button type="button" class="text-button tile-edit-link" data-action="edit-category:${b.id}:${c.id}">Edytuj dział i zdjęcie</button></div>`).join('')}</div>`:empty('Dodaj pierwszy dział','Działy pomagają uporządkować przepisy, na przykład na „Sosy”, „Zupy” albo „Ciasta”.','＋ Dodaj dział',`new-category:${b.id}`)}`;
  }
  function renderCategory(){const b=bookBy(route.book),c=catBy(b,route.category);if(!b||!c){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name}])}<section class="page-head"><div><div class="eyebrow">Dział w książce „${esc(b.name)}”</div><h1 class="heading">${esc(c.name)}</h1><p class="subheading">Twoje sprawdzone przepisy, zawsze pod ręką.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-category:${b.id}:${c.id}">Edytuj dział</button><button class="quiet-button" data-action="scan-photo:${b.id}:${c.id}">▧ Ze zdjęcia</button><button type="button" class="quiet-button" data-action="dictate-recipe:${b.id}:${c.id}">Podyktuj przepis</button><button type="button" class="quiet-button" data-action="import-recipe-link:${b.id}:${c.id}">Dodaj przepis z linku</button><button class="primary-button" data-action="new-recipe:${b.id}:${c.id}">＋ Dodaj przepis</button></div></section><input id="recipe-photo" class="hidden" type="file" accept="image/*">${c.recipes.length?`<div class="toolbar"><input id="recipe-search" class="search" type="search" placeholder="⌕  Szukaj przepisu…" value="${esc(search)}"></div><div id="recipe-search-results"></div>`:empty('Ten dział czeka na przepisy','Dodaj pierwszy przepis ze zdjęcia albo wpisz go ręcznie.','＋ Dodaj przepis',`new-recipe:${b.id}:${c.id}`)}`;
    const input = main.querySelector('#recipe-search');
    if (input) {
      const pager = recipePager(main.querySelector('#recipe-search-results'));
      const refreshResults = () => {
        const query = searchText(search);
        const recipes = query ? c.recipes.filter(recipe=>recipeMatches(recipe,query)) : c.recipes;
        pager.set(recipes,(r,i)=>card(r.name,r.sections.length?`${r.sections.length} ${plural(r.sections.length,'etap','etapy','etapów')}`:'Otwórz przepis',
          ['🍲','🥘','🍝','🥧','🥗','🍮'][i%6],colors[(i+1)%colors.length],`recipe:${b.id}:${c.id}:${r.id}`,'recipe-tile',r.photo||'',
          {size:r.tileTitleSize,weight:r.tileTitleWeight}));
      };
      input.addEventListener('input', () => {
        search = input.value;
        refreshResults();
      });
      refreshResults();
    }
  }
  function renderRecipe(){const b=bookBy(route.book),c=catBy(b,route.category),r=recipeBy(b,c,route.recipe);if(!b||!c||!r){route={type:'home'};return renderHome()};
    const base=Number(r.servings)||4;
    const ingredientRows=r.sections.flatMap((section,si)=>(section.ingredients||[]).map((ingredient,ii)=>({section:si,index:ii,sectionName:section.name||`Etap ${si+1}`,amount:ingredient.amount||'',name:ingredient.name||''})));
    const scaleable=ingredientRows.filter(item=>readQuantity(item.amount)?.value>0&&!readQuantityRange(item.amount));
    main.innerHTML=`<div class="recipe-screen" id="recipe-zoom-area">${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name,route:`category:${b.id}:${c.id}`},{label:r.name}])}${viewZoomControls('Widok przepisu','<button type="button" class="quiet-button" id="recipe-print">Zapisz / drukuj PDF</button>')}<article class="recipe-view"><header class="recipe-cover">${r.photo?`<img class="recipe-photo" src="${esc(r.photo)}" alt="Zdjęcie przepisu">`:''}<div class="eyebrow">${esc(c.name)} · ${esc(b.name)}</div><h1 class="heading">${esc(r.name)}</h1>${r.description?`<p class="recipe-description">${esc(r.description)}</p>`:''}${recipeSourceMarkup(r.sourceUrl)}</header><section class="portion-control" aria-label="Przeliczanie przepisu"><div class="calc-field"><label for="scale-scope">Przelicz</label><select id="scale-scope"><option value="all">Cały przepis</option>${r.sections.map((s,i)=>`<option value="${i}">Tylko: ${esc(s.name||`Etap ${i+1}`)}</option>`).join('')}</select></div><div class="calc-field"><label for="scale-mode">Według</label><select id="scale-mode"><option value="portions">Liczby porcji</option><option value="ingredient">Ilości składnika</option><option value="mass">Docelowej masy</option>${r.showPansAndMixer!==false?'<option value="pans">Liczby foremek</option>':''}</select></div><div class="calc-field portion-field" id="portion-setting"><label for="portion-count">Porcje</label><input id="portion-count" type="number" min="1" max="100" step="1" value="${base}"></div><div id="ingredient-setting" class="calc-field" hidden><label for="scale-ingredient">Składnik</label><select id="scale-ingredient"></select></div><div id="target-setting" class="calc-field" hidden><label for="scale-target">Nowa ilość</label><input id="scale-target" type="text" placeholder="np. 300 g"></div><div class="calc-field" id="fixed-goal-setting" hidden><label for="fixed-goal">Cel dla etapu</label><select id="fixed-goal">
      <option value="">Przelicz proporcjonalnie</option><option value="mass">Zachowaj składnik i dopasuj masę</option>
      ${r.showPansAndMixer!==false?'<option value="pans">Zachowaj składnik i dopasuj foremki</option>':''}
    </select></div><div class="calc-field" id="target-mass-setting" hidden><label for="target-mass">Docelowa masa etapu (g)</label><input id="target-mass" type="number" min="1" inputmode="decimal"></div><div class="calc-field" id="pan-count-setting" hidden><label for="pan-count">Liczba foremek</label><input id="pan-count" type="number" min="1" step="1" inputmode="numeric"></div><details class="baking-settings" ${r.showPansAndMixer===false?'hidden':''}><summary>Foremki i limit robota</summary><div class="baking-fields"><div class="calc-field"><label for="pan-mass">Ciasto na foremkę (g)</label><input id="pan-mass" type="number" min="1" inputmode="decimal"></div><div class="calc-field"><label for="mixer-limit">Limit masy ciasta robota (g)</label><input id="mixer-limit" type="number" min="1" inputmode="decimal"></div></div></details><p id="baking-summary" class="calc-note" aria-live="polite" hidden></p><p id="scale-note" class="calc-note">Wybierz, czy przeliczać cały przepis, czy tylko jeden etap.</p></section><div class="top-actions recipe-actions" style="justify-content:flex-end;margin:0 0 14px">${r.sections.length ? `<button type="button" class="quiet-button" data-action="cook-recipe:${b.id}:${c.id}:${r.id}">Tryb gotowania</button>` : ''}<button class="quiet-button" data-action="edit-recipe:${b.id}:${c.id}:${r.id}">Edytuj przepis</button><button type="button" class="quiet-button" data-action="copy-recipe:${b.id}:${c.id}:${r.id}">Skopiuj przepis</button><button class="danger-button" data-action="delete-recipe:${b.id}:${c.id}:${r.id}">Usuń</button></div>${r.sections.map((s,i)=>`<section class="recipe-section" data-scale-section="${i}"><h2>${esc(s.name||`Etap ${i+1}`)}</h2>${s.description?`<p class="section-description">${esc(s.description)}</p>`:''}${s.ingredients?.length?`<div class="label">Składniki</div><ul class="ingredient-list">${s.ingredients.map((x,j)=>`<li><span class="amount" data-base-amount="${esc(x.amount||'')}" data-scale-section="${i}" data-scale-item="${i}:${j}">${esc(x.amount||'')}</span><span>${esc(x.name||'')}${linkedIngredientButton(x)}${r.bakerPercentages?`<small class="baker-percent" data-baker-percent hidden></small>`:''}</span></li>`).join('')}</ul>`:''}${s.instructions?`<div class="label" style="margin-bottom:8px">Jak przygotować</div><p class="instructions">${esc(s.instructions)}</p>`:''}${stagePhotosMarkup(s)}${r.bakerPercentages?`<p class="baker-summary" data-baker-summary hidden></p>`:''}<p class="stage-mass" data-stage-mass hidden></p></section>`).join('')}<div class="bake-journal-button"><button type="button" class="quiet-button" data-action="journal-recipe:${b.id}:${c.id}:${r.id}">Dziennik wypieków</button></div></article></div>`;
    setupRecipeScaling(r,base,scaleable);
    bindViewZoom(r.viewZoom,zoom=>saveViewZoom(r,zoom));
    main.querySelector('#recipe-print').addEventListener('click',()=>window.print());
  }

  function viewZoomControls(label,extra='') {
    return `<div class="recipe-tools"><span>${label}</span>
      <button type="button" class="quiet-button" id="recipe-zoom-out" aria-label="Pomniejsz widok">−</button>
      <output id="recipe-zoom-level">100%</output>
      <button type="button" class="quiet-button" id="recipe-zoom-in" aria-label="Powiększ widok">＋</button>${extra}</div>`;
  }

  function bindViewZoom(initialValue,onChange) {
    const area = main.querySelector('#recipe-zoom-area');
    const level = main.querySelector('#recipe-zoom-level');
    let zoom;
    function setZoom(value,persist) {
      zoom = Math.min(1.4,Math.max(.4,Math.round(value*10)/10));
      area.style.setProperty('--recipe-zoom',zoom);
      level.textContent = Math.round(zoom*100)+'%';
      if (persist) onChange(zoom);
    }
    setZoom(Number(initialValue)||1,false);
    main.querySelector('#recipe-zoom-out').addEventListener('click',()=>setZoom(zoom-.1,true));
    main.querySelector('#recipe-zoom-in').addEventListener('click',()=>setZoom(zoom+.1,true));

  function mentionsPrepMethod(text) {

  function recipeBelongsToPrep(recipe,category) {
    if (recipe.hideFromPrepIndex) return false;
    if (recipe.prep || mentionsPrepMethod(category.name)) return true;
    return mentionsPrepMethod([recipe.name,recipe.description,
      ...(recipe.sections||[]).flatMap(stage=>[stage.name,stage.instructions])].join(' '));

  function readPrepParameters(recipe) {
    const text = [recipe.name,recipe.description,
      ...(recipe.sections||[]).flatMap(stage=>[stage.name,stage.instructions])].join('\n');
    const pairs = new Map();
    for (const line of text.split(/\r?\n/)) {
      if (!mentionsPrepMethod(line) && !/kąpiel/iu.test(line)) continue;
      const temperatures = [...line.matchAll(/(?<![\d.,+–−-])(\d+(?:[,.]\d+)?)\s*°\s*C(?![\p{L}\d])/giu)];
      const durations = [...line.matchAll(/(?<![\d.,+–−-])\d+(?:[,.]\d+)?\s*(?:godz(?:in(?:a|y)?)?\.?|h|min(?:ut(?:a|y)?)?\.?)(?![\p{L}\d])/giu)];
      if (temperatures.length!==1 || durations.length!==1 ||
          /\d\s*[–−-]\s*\d/u.test(line)) continue;
      const temperature = Number(temperatures[0][1].replace(',','.'));
      if (!Number.isFinite(temperature) || temperature<=0) continue;
      const duration = durations[0][0].trim();
      pairs.set(`${temperature}:${duration}`,{temperature:`${String(temperature).replace('.',',')} °C`,duration});
    }
    if (pairs.size===1) return pairs.values().next().value;
  }

  function prepTemperature(recipe) {
    return new Intl.NumberFormat('pl',{maximumFractionDigits:2}).format(recipe.prep.temperature)+' °C';
  }

  function instructionTimers(text) {
    const duration = /(?<![\p{L}\d.,])(\d+(?:[,.]\d+)?)\s*(?:(?:[–—-]|do\b)\s*(\d+(?:[,.]\d+)?)\s*)?(godz(?:in(?:y|a|ę)?)?\.?|h|min(?:ut(?:y|a|ę)?)?\.?|sek(?:und(?:y|a|ę)?)?\.?|s)(?![\p{L}\d])/giu;
    const times = new Map();
    let previous;
    function add(seconds,label) {
      const rounded = Math.round(seconds);
      if (rounded>0 && rounded<=86400) times.set(rounded,label);
    }
    function flush() {
      if (previous) add(previous.seconds,text.slice(previous.start,previous.end));
      previous = null;
    }
    for (const match of text.matchAll(duration)) {
      const unit = match[3].toLowerCase();
      const multiplier = unit==='h'||unit.startsWith('godz') ? 3600 : unit.startsWith('min') ? 60 : 1;
      const seconds = Number(match[1].replace(',','.'))*multiplier;
      if (match[2]) {
        flush();
        add(seconds,`${match[1]} ${match[3]}`);
        add(Number(match[2].replace(',','.'))*multiplier,`${match[2]} ${match[3]}`);
        continue;
      }
      const gap = previous ? text.slice(previous.end,match.index) : '';
      if (previous && previous.unit>multiplier && /^[ \t]+(?:i[ \t]+)?$/iu.test(gap)) {
        previous.seconds += seconds;
        previous.unit = multiplier;
        previous.end = match.index+match[0].length;
      } else {
        flush();
        previous = {seconds,unit:multiplier,start:match.index,end:match.index+match[0].length};
      }
    }
    flush();
    return times;
  }

  const cookingTimer = (() => {
    const dock = document.querySelector('#cooking-timer-dock');
    const dockClock = dock.querySelector('output');
    const dockStop = dock.querySelector('button');
    const clockKey = 'moja-kuchnia-cooking-deadline';
    let deadline = 0, interval, audio, alarm, view, finished = false;
    try { deadline = Number(sessionStorage.getItem(clockKey))||0; } catch {}

    function setDeadline(value) {
      deadline = value;
      try {
        if (value) sessionStorage.setItem(clockKey,String(value));
        else sessionStorage.removeItem(clockKey);
      } catch {}
    }

    function updateClock(text) {
      dock.hidden = Boolean(view)||(!deadline&&!finished);
      dockClock.textContent = text;
      dockStop.textContent = finished ? 'Zamknij' : 'Zatrzymaj';
      if (view) {
        view.clock.textContent = text;
        view.stop.hidden = !deadline&&!finished;
        view.stop.textContent = finished ? 'Zamknij komunikat' : 'Zatrzymaj minutnik';
      }
    }

    function stop() {
      clearInterval(interval);
      interval = undefined;
      if (alarm) {
        alarm.stop();
        alarm = undefined;
      }
      setDeadline(0);
      finished = false;
      updateClock('');
    }

    function playAlarm() {
      if (audio?.state!=='running') return;
      const oscillator = audio.createOscillator();
      const volume = audio.createGain();
      const start = audio.currentTime+.02;
      volume.gain.value = 0;
      for (let i=0;i<8;i++) {
        const pulse = start+i*.8;
        oscillator.frequency.setValueAtTime(i%2 ? 940 : 720,pulse);
        volume.gain.setValueAtTime(0,pulse);
        volume.gain.linearRampToValueAtTime(.8,pulse+.03);
        volume.gain.setValueAtTime(.8,pulse+.32);
        volume.gain.linearRampToValueAtTime(0,pulse+.42);
      }
      oscillator.connect(volume).connect(audio.destination);
      oscillator.addEventListener('ended',()=>{
        if (alarm===oscillator) alarm = undefined;
        oscillator.disconnect();
        volume.disconnect();
      },{once:true});
      oscillator.start(start);
      oscillator.stop(start+6.4);
      alarm = oscillator;
    }

    function tick() {
      if (!deadline) {
        updateClock(finished ? 'Czas minął!' : '');
        return;
      }
      const seconds = Math.max(0,Math.ceil((deadline-Date.now())/1000));
      if (!seconds && !document.hidden) {
        clearInterval(interval);
        interval = undefined;
        setDeadline(0);
        finished = true;
        updateClock('Czas minął!');
        navigator.vibrate?.([250,150,250,150,250]);
        if (audio?.state==='running') playAlarm();
        else audio?.resume().then(()=>{if (finished) playAlarm();}).catch(()=>{});
      } else {
        updateClock(`Minutnik: ${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`);
      }
    }

    dockStop.addEventListener('click',stop);
    document.addEventListener('visibilitychange',()=>{if (!document.hidden&&deadline) tick();});
    if (deadline) {
      interval = setInterval(tick,1000);
      tick();
    }
    return {
      start(seconds) {
        stop();
        const Audio = window.AudioContext||window.webkitAudioContext;
        if (Audio && !audio) {
          try { audio = new Audio(); } catch {}
        }
        audio?.resume().catch(()=>{});
        setDeadline(Date.now()+seconds*1000);
        interval = setInterval(tick,1000);
        tick();
      },
      stop,
      mount(elements) {
        view = elements;
        tick();
      }
    };
  })();

  function startCooking(recipe) {
    const displayed = new Map([...main.querySelectorAll('[data-scale-item]')].map(el=>[el.dataset.scaleItem,el.textContent]));
    const checked = new Set();
    let step = 0;
    showForm('Tryb gotowania',`<div id="cook-stage"></div>
      <div class="cooking-nav"><button type="button" class="quiet-button" id="cook-back">Wstecz</button>
        <button type="button" class="quiet-button" id="cook-next">Dalej</button></div>

        <button type="button" class="quiet-button" id="cook-stop" hidden>Zatrzymaj minutnik</button></div>`);
    const stage = document.querySelector('#cook-stage');
    const back = document.querySelector('#cook-back');
    const next = document.querySelector('#cook-next');
    const clock = document.querySelector('#cook-timer');
    const stop = document.querySelector('#cook-stop');
    cookingTimer.mount({clock,stop});

    function renderStage() {
      const section = recipe.sections[step];
      const text = section.instructions || '';
      const times = instructionTimers(text);
      stage.innerHTML = `<p class="eyebrow">Etap ${step+1} z ${recipe.sections.length}</p>
        <h3>${esc(section.name || `Etap ${step+1}`)}</h3>
        ${section.description ? `<p>${esc(section.description)}</p>` : ''}
        <ul class="cooking-ingredients">${(section.ingredients||[]).map((item,i)=>{
          const key = `${step}:${i}`;
          const amount = displayed.get(key) ?? item.amount ?? '';
          return `<li><label><input type="checkbox" data-cook-ingredient="${key}" ${checked.has(key)?'checked':''}>
            <span>${esc(amount)} ${esc(item.name||'')}</span></label></li>`;
        }).join('')}</ul>
        ${text ? `<p class="instructions">${esc(text)}</p>` : ''}
        ${stagePhotosMarkup(section)}
        <div class="cooking-nav">${[...times].map(([seconds,label])=>
          `<button type="button" class="quiet-button" data-cook-timer="${seconds}">Minutnik · ${esc(label)}</button>
          ${appleTouchDevice ? `<a class="quiet-button" href="shortcuts://run-shortcut?name=Minutnik%20Moja%20kuchnia&amp;input=text&amp;text=${seconds}">Zegar iPhone’a · ${esc(label)}</a>` : ''}`).join('')}</div>
        ${appleTouchDevice && times.size ? '<p class="scan-help">Po zablokowaniu telefonu użyj opcji „Zegar iPhone’a”. Wymaga skrótu „Minutnik Moja kuchnia”.</p>' : ''}`;
      back.disabled = step===0;
      next.disabled = step===recipe.sections.length-1;
    }
    stage.addEventListener('change',event=>{
      const key = event.target.dataset.cookIngredient;
      if (!key) return;
      if (event.target.checked) checked.add(key);
      else checked.delete(key);
    });
    stage.addEventListener('click',event=>{
      const button = event.target.closest('[data-cook-timer]');
      if (!button) return;
      cookingTimer.start(Number(button.dataset.cookTimer));
    });
    back.addEventListener('click',()=>{step--;renderStage();});
    next.addEventListener('click',()=>{step++;renderStage();});
    stop.addEventListener('click',cookingTimer.stop);
    formCleanup = ()=>cookingTimer.mount(null);
    renderStage();
  }

  function setupRecipeScaling(recipe,base,scaleable) {
    const scope = main.querySelector('#scale-scope');
    const mode = main.querySelector('#scale-mode');
    const portions = main.querySelector('#portion-count');
    const items = main.querySelector('#scale-ingredient');
    const target = main.querySelector('#scale-target');
    const targetMass = main.querySelector('#target-mass');
    const fixedGoal = main.querySelector('#fixed-goal');
    const panCount = main.querySelector('#pan-count');
    const panMass = main.querySelector('#pan-mass');
    const mixerLimit = main.querySelector('#mixer-limit');
    const note = main.querySelector('#scale-note');
    const bakingSummary = main.querySelector('#baking-summary');
    const sections = [...main.querySelectorAll('.recipe-section[data-scale-section]')];
    const amountsBySection = sections.map(section => [...section.querySelectorAll('[data-base-amount]')]);
    const addedMasses = amountsBySection.map((amounts,i) =>
      measuredStageMass(amounts.map(el=>el.dataset.baseAmount),recipe.sections[i].ingredients));
    const baseMasses = [];
    recipe.sections.forEach((stage,i)=>{
      const previous = stage.continuesPreviousStage ? baseMasses[i-1] : null;
      baseMasses.push(combineStageMass(addedMasses[i],previous));
    });
    const defaultStage = addedMasses.findLastIndex(mass=>mass?.max>0);
    if (recipe.showPansAndMixer!==false) mixerLimit.value = localStorage.getItem('domowa-kuchnia-mixer-limit') || '';

    function refreshItems() {
      const previous = items.value;
      const visible = scaleable.filter(item=>scope.value==='all'||String(item.section)===scope.value);
      items.innerHTML = visible.length ? visible.map(item=>
        `<option value="${item.section}:${item.index}">${esc(item.sectionName)} · ${esc(item.name)} (${esc(item.amount)})</option>`
      ).join('') : '<option value="">Brak składników z jedną określoną ilością</option>';
      const selected = visible.find(item=>`${item.section}:${item.index}`===previous) || visible[0];
      if (selected) items.value = `${selected.section}:${selected.index}`;
      target.value = selected?.amount || '';
    }

    function recalculate() {
      const ingredientMode = mode.value==='ingredient';
      const fixed = ingredientMode && Boolean(fixedGoal.value);
      const byMass = mode.value==='mass' || (fixed && fixedGoal.value==='mass');
      const byPans = mode.value==='pans' || (fixed && fixedGoal.value==='pans');
      const baking = byMass || byPans;
      const selected = ingredientMode ? scaleable.find(item=>`${item.section}:${item.index}`===items.value) : null;
      scope.options[0].disabled = baking && !fixed;
      if (baking && !fixed && scope.value==='all' && defaultStage>=0) scope.value = String(defaultStage);
      main.querySelector('#portion-setting').hidden = mode.value!=='portions';
      main.querySelector('#ingredient-setting').hidden = !ingredientMode;
      main.querySelector('#target-setting').hidden = !ingredientMode;
      main.querySelector('label[for=scale-target]').textContent = fixed ? 'Ilość stała' : 'Nowa ilość';
      main.querySelector('#fixed-goal-setting').hidden = !ingredientMode;
      main.querySelector('#target-mass-setting').hidden = !byMass;
      main.querySelector('#pan-count-setting').hidden = !byPans;
      const selectedStage = fixed && selected ? selected.section : scope.value==='all' ? defaultStage : Number(scope.value);
      const gramsPerPan = Number(panMass.value);
      let ratio = Math.min(100,Math.max(1,Number(portions.value)||base))/base;
      let targetLabel = '';
      let fixedIngredientRatio;
      let explanation = 'Przeliczenie zmienia tylko podgląd.';
      if (ingredientMode) {
        const source = readQuantity(selected?.amount);
        const desired = readQuantity(target.value);
        const sourceMass = ingredientMassUnit(source?.tail,selected?.name);
        const desiredMass = ingredientMassUnit(desired?.tail,selected?.name);
        const sourceVolume = !sourceMass && volumeUnit(source?.tail);
        const desiredVolume = !desiredMass && volumeUnit(desired?.tail);
        const sourceFactor = sourceMass || sourceVolume;
        const desiredFactor = desiredMass || desiredVolume;
        const compatible = desired && (!desired.tail.trim() || (sourceMass && desiredMass) || (sourceVolume && desiredVolume) ||
          (!sourceFactor && !desiredFactor && canonicalIngredientUnit(source?.tail)===canonicalIngredientUnit(desired.tail)));
        if (!source || !desired || desired.value<=0 || !compatible || readQuantityRange(target.value)) {
          ratio = 1;
          explanation = 'Wpisz dodatnią ilość w zgodnej jednostce.';
        } else {
          ratio = (desired.value*(desiredFactor||sourceFactor||1))/(source.value*(sourceFactor||1));
          targetLabel = desired.tail.trim() ? target.value.trim() : target.value.trim()+source.tail;
        }
      }
      if (baking) {
        const previous = recipe.sections[selectedStage]?.continuesPreviousStage ? baseMasses[selectedStage-1] : null;
        const carriedWeight = previous?.min || 0;
        const addedWeight = addedMasses[selectedStage];
        const pans = Number(panCount.value);
        const wanted = byMass ? Number(targetMass.value) : (Number.isInteger(pans) && pans>0 ? pans*gramsPerPan : 0);
        const fixedLabel = targetLabel;
        ratio = 1;
        targetLabel = '';
        if (fixed && !fixedLabel) {
          explanation = 'Wybierz składnik i wpisz dodatnią ilość w zgodnej jednostce.';
        } else if (!Number.isFinite(wanted) || wanted<=0) {
          explanation = byMass ? 'Wpisz docelową masę etapu w gramach.' : 'Wpisz liczbę foremek i masę ciasta na jedną foremkę.';
        } else if (previous && (previous.partial || previous.min!==previous.max)) {
          explanation = 'Podaj dokładne ilości w poprzednich etapach tego ciasta.';
        } else if (wanted<carriedWeight) {
          explanation = `Ciasto z poprzedniego etapu waży już ${formatGrams(carriedWeight)}.`;
        } else if (fixed) {
          const ingredient = recipe.sections[selectedStage].ingredients[selected.index];
          const amounts = amountsBySection[selectedStage].map(el=>el.dataset.baseAmount);
          const others = measuredStageMass(amounts.filter((_,i)=>i!==selected.index),
            recipe.sections[selectedStage].ingredients.filter((_,i)=>i!==selected.index));
          const fixedMass = summarizeMass([fixedLabel],[ingredient]);
          const originalFixed = summarizeMass([selected.amount],[ingredient]);
          const available = wanted-carriedWeight-(fixedMass?.min||0);
          if (!fixedMass || fixedMass.min!==fixedMass.max || !originalFixed || originalFixed.min!==originalFixed.max ||
              (others && (others.partial || others.min!==others.max))) {
            explanation = 'Podaj masę stałego składnika i dokładne ilości pozostałych składników w tym etapie.';
          } else if (available<0) {
            explanation = previous ? 'Ciasto z poprzedniego etapu i stały składnik razem przekraczają docelową masę.'
              : 'Stały składnik waży więcej niż docelowa masa całego etapu.';
          } else if (!others?.min && available>0) {
            explanation = 'Podaj masę składników, których ilość można dopasować.';
          } else {
            ratio = others?.min ? available/others.min : 1;
            targetLabel = fixedLabel;
            if (/^(zaczyn|zakwas)(?=\s|$)/iu.test((ingredient.name||'').trim()) && originalFixed.min>0) {
              fixedIngredientRatio = fixedMass.min/originalFixed.min;
            }
            explanation = `Stała ilość: ${formatGrams(fixedMass.min)}. Pozostałe składniki: ${formatGrams(available)}. Przeliczono tylko etap „${selected.sectionName}”.`;
          }
        } else if (!addedWeight || addedWeight.min<=0 || addedWeight.partial || addedWeight.min!==addedWeight.max) {
          explanation = 'Wybierz etap, w którym wszystkie dodawane składniki mają podaną dokładną masę.';
        } else {
          ratio = (wanted-carriedWeight)/addedWeight.min;
          explanation = previous
            ? `Uwzględniono ${formatGrams(carriedWeight)} ciasta z poprzedniego etapu. Przeliczono tylko dodawane składniki.`
            : 'Przeliczono wybrany etap. Pozostałe etapy zachowują zapisane ilości.';
        }
      }
      note.textContent = explanation;
      let previousBaker, previousMass;
      const currentMasses = sections.map((section,i) => {
        const inScope = fixed ? selectedStage===i : scope.value==='all' || Number(scope.value)===i;
        for (const el of amountsBySection[i]) {
          const amount = el.dataset.baseAmount;
          el.textContent = !inScope ? amount : targetLabel && el.dataset.scaleItem===items.value
            ? targetLabel : scaleAmount(amount,ratio,1);
        }
        const amounts = amountsBySection[i].map(el=>el.textContent);
        const stage = recipe.sections[i];
        if (recipe.bakerPercentages) {
          previousBaker = updateBakerPercentages(section,stage,amounts,inScope?(fixedIngredientRatio??ratio):1,
            stage.continuesPreviousStage ? previousBaker : undefined);
        }
        const carried = stage.continuesPreviousStage ? previousMass : null;
        previousMass = combineStageMass(measuredStageMass(amounts,stage.ingredients),carried);
        renderStageMass(section,previousMass,Boolean(carried));
        return previousMass;
      });
      const mass = currentMasses[selectedStage];
      const messages = [];
      const limit = Number(mixerLimit.value);
      if (mass && !mass.unmeasured && (limit>0 || gramsPerPan>0)) {
        const min = roundedGrams(mass.min), max = roundedGrams(mass.max);
        messages.push(recipe.sections[selectedStage].name || `Etap ${selectedStage+1}`);
        if (limit>0) {
          if (mass.estimated) messages.push(`Szacunkowa masa: ${formatQuantityBounds(mass,'g')}. Limit robota: ${formatGrams(limit)}`);
          else if (min>limit) messages.push(`Przekroczony limit robota o co najmniej ${formatGrams(min-limit)}`);
          else if (mass.partial || max>limit) messages.push('Nie można potwierdzić, czy masa mieści się w limicie robota');
          else messages.push(`Masa mieści się w limicie robota (${formatGrams(limit)})`);
        }
        if (gramsPerPan>0) {
          if (!mass.partial && mass.min===mass.max) {
            const full = Math.floor(min/gramsPerPan+1e-10);
            const remainder = Math.max(0,min-full*gramsPerPan);
            messages.push(`${mass.estimated?'Szacunkowo pełne foremki':'Pełne foremki'}: ${full}. Pozostanie: ${formatGrams(remainder)}`);
          } else messages.push('Dokładna liczba foremek wymaga pełnej masy etapu');
        }
      }
      bakingSummary.textContent = messages.join(' · ');
      bakingSummary.hidden = !messages.length;
    }

    scope.addEventListener('change',()=>{refreshItems();recalculate();});
    mode.addEventListener('change',()=>{
      if (mode.value==='pans') main.querySelector('.baking-settings').open = true;
      if (mode.value==='ingredient') refreshItems();
      recalculate();
    });
    items.addEventListener('change',()=>{
      target.value = scaleable.find(item=>`${item.section}:${item.index}`===items.value)?.amount || '';
      recalculate();
    });
    fixedGoal.addEventListener('change',()=>{
      if (fixedGoal.value==='pans') main.querySelector('.baking-settings').open = true;
      recalculate();
    });
    for (const field of [portions,target,targetMass,panCount,panMass,mixerLimit]) field.addEventListener('input',recalculate);
    mixerLimit.addEventListener('change',()=>localStorage.setItem('domowa-kuchnia-mixer-limit',mixerLimit.value));
    refreshItems();
    recalculate();
  }
  function plural(n,a,b,c){return n===1?a:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c}
  const fractions={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
  const groupedInteger = String.raw`(?:\d{1,3}(?:[ \u00a0\u202f]\d{3})+|\d+)`;
  const quantityNumber = String.raw`(?:${groupedInteger}\s+\d+\s*[/⁄]\s*\d+|\d+\s*[/⁄]\s*\d+|${groupedInteger}?\s*[¼½¾⅓⅔⅛⅜⅝⅞]|${groupedInteger}(?:[,.]\d+)?)`;
  const quantityPattern = new RegExp(String.raw`^\s*(${quantityNumber})`);
  const fractionPattern = new RegExp(String.raw`^(?:(${groupedInteger})\s+)?(\d+)\s*[/⁄]\s*(\d+)$`);
  function readQuantity(text) {
    const input = String(text||'');
    const match = input.match(quantityPattern);
    if (!match) return null;
    const number = match[1].trim();
    const fraction = number.match(fractionPattern);
    const unicode = number.match(/^(.*?)([¼½¾⅓⅔⅛⅜⅝⅞])$/u);
    const value = fraction ? Number((fraction[1]||'').replace(/\s/g,''))+Number(fraction[2])/Number(fraction[3])
      : unicode ? Number(unicode[1].replace(/\s/g,''))+fractions[unicode[2]]
      : Number(number.replace(/\s/g,'').replace(',','.'));
    return Number.isFinite(value) ? {value,tail:input.slice(match[0].length)} : null;
  }

  function readQuantityRange(text) {
    const first = readQuantity(text);
    const connector = first?.tail.match(/^(\s*[\p{L}.]*\s*)([-–—])(?=\s*(?:\d|[¼½¾⅓⅔⅛⅜⅝⅞]))/u);
    if (!connector) return null;
    const end = readQuantity(first.tail.slice(connector[0].length));
    return end ? {start:{value:first.value,tail:connector[1]},separator:connector[2],end} : null;
  }

  const scaledNumber = new Intl.NumberFormat('pl',{maximumFractionDigits:6,useGrouping:false});
  function scaleAmount(value,target,base) {
    if (base<=0 || target===base) return value;
    const factor = target/base;
    const scaled = quantity => scaledNumber.format(quantity.value*factor)+quantity.tail;
    const range = readQuantityRange(value);
    if (range) return scaled(range.start)+range.separator+scaled(range.end);
    const quantity = readQuantity(value);
    return quantity ? scaled(quantity) : value;
  }

  function normalizeQuantityUnit(unit = '') {
    return unit.trim().toLocaleLowerCase('pl').replace(/\.$/u,'');
  }

  function massUnit(unit) {
    const name = normalizeQuantityUnit(unit);
    if (/^(kg|kilogram(?:a|y|ów)?)$/u.test(name)) return 1000;
    if (/^(dag|dkg|dekagram(?:a|y|ów)?)$/u.test(name)) return 10;
    if (/^(g|gram(?:a|y|ów)?)$/u.test(name)) return 1;
    if (/^(mg|miligram(?:a|y|ów)?)$/u.test(name)) return .001;
    return 0;
  }

  function volumeUnit(unit) {
    const name = normalizeQuantityUnit(unit);
    if (/^(l|litr(?:a|y|ów)?)$/u.test(name)) return 1000;
    if (name==='dl') return 100;
    if (name==='cl') return 10;
    if (/^(ml|mililitr(?:a|y|ów)?)$/u.test(name)) return 1;
    return 0;
  }

  function waterIngredient(name = '') {
    return /^(woda|wody)(?=\s|$)/iu.test(name.trim());
  }

  function ingredientMassUnit(unit,name) {
    return massUnit(unit) || (waterIngredient(name) ? volumeUnit(unit) : 0);
  }

  function quantityBounds(amount,factorForUnit) {
    const range = readQuantityRange(amount);
    const end = range?.end || readQuantity(amount);
    const endFactor = factorForUnit(end?.tail.trim() || range?.start.tail);
    if (!end || !endFactor) return null;
    const max = end.value*endFactor;
    if (!range) return [max,max];
    const startFactor = range.start.tail.trim() ? factorForUnit(range.start.tail) : endFactor;
    if (!startFactor) return null;
    const min = range.start.value*startFactor;
    return [Math.min(min,max),Math.max(min,max)];
  }

  function massInGrams(amount,name) {
    return quantityBounds(amount,unit=>ingredientMassUnit(unit,name));
  }

  function summarizeBounds(bounds) {
    const measured = bounds.filter(Boolean);
    if (!measured.length) return null;
    const [min,max] = measured.reduce(([low,high],[start,end])=>[low+start,high+end],[0,0]);
    return {min,max,partial:measured.length<bounds.length};
  }

  function summarizeMass(amounts,ingredients = []) {
    let estimated = false;
    const bounds = amounts.map((amount,i)=>{
      const name = ingredients[i]?.name;
      const mass = massInGrams(amount,name);
      if (mass) return mass;
      const volume = quantityBounds(amount,volumeUnit);
      if (volume) estimated = true;
      return volume;
    });
    const total = summarizeBounds(bounds);
    return total ? {...total,estimated} : null;
  }

  function measuredStageMass(amounts,ingredients) {
    return summarizeMass(amounts,ingredients) ||
      (amounts.length ? {min:0,max:0,partial:true,estimated:false,unmeasured:true} : null);
  }

  function combineStageMass(added,carried) {
    if (!added || !carried) return added || carried;
    return {
      min:added.min+carried.min,
      max:added.max+carried.max,
      partial:added.partial||carried.partial,
      estimated:added.estimated||carried.estimated,
      unmeasured:added.unmeasured&&carried.unmeasured
    };
  }

  function updateBakerPercentages(section,stage,amounts,ratio,previous) {
    const summary = section.querySelector('[data-baker-summary]');
    const labels = section.querySelectorAll('[data-baker-percent]');
    const masses = amounts.map((amount,i)=>{
      const bounds = massInGrams(amount,stage.ingredients?.[i]?.name);
      return bounds && bounds[0]===bounds[1] ? bounds[0] : null;
    });
    let flour = (previous?.flour||0)+(Number(stage.starterFlourGrams)||0)*ratio;
    let water = (previous?.water||0)+(Number(stage.starterWaterGrams)||0)*ratio;
    let missing = previous?.missing || false;
    let hasFlour = Boolean(previous?.hasFlour || flour>0);
    (stage.ingredients||[]).forEach((item,i)=>{
      const name = (item.name||'').trim().toLocaleLowerCase('pl');
      const isFlour = /^(mąka|mąki|maka|maki)(?:\s|$)/u.test(name);
      const isWater = waterIngredient(name) || /^(lód|lod|lodu)(?=\s|$)/u.test(name);
      hasFlour ||= isFlour;
      if (!isFlour && !isWater) return;
      if (masses[i]===null) {
        missing = true;
        return;
      }
      if (isFlour) flour += masses[i];
      else water += masses[i];
    });
    const format = new Intl.NumberFormat('pl',{maximumFractionDigits:1});
    const percent = grams=>format.format(grams/flour*100)+'%';
    const canCalculate = flour>0 && !missing;
    labels.forEach((label,i)=>{
      label.hidden = !canCalculate || masses[i]===null;
      if (!label.hidden) label.textContent = percent(masses[i]);
    });
    summary.hidden = !hasFlour;
    if (hasFlour) {
      const label = previous ? 'Hydracja po tym etapie' : 'Hydracja';
      summary.textContent = canCalculate
        ? `${label}: ${percent(water)} · Mąka: ${formatGrams(flour)} · Woda: ${formatGrams(water)}`
        : 'Podaj dokładne masy mąki i wody, aby obliczyć hydrację.';
    }
    return {flour,water,missing,hasFlour};
  }

  const roundedGrams = value=>Math.round(value*1000)/1000;

  function formatGrams(value) {
    return new Intl.NumberFormat('pl',{maximumFractionDigits:3}).format(value)+' g';
  }

  function formatQuantityBounds(total,unit) {
    const number = new Intl.NumberFormat('pl',{maximumFractionDigits:3});
    const min = number.format(total.min), max = number.format(total.max);
    return (min===max ? min : min+'–'+max)+' '+unit;
  }

  function renderStageMass(section,mass,includesPrevious) {
    const output = section.querySelector('[data-stage-mass]');
    output.hidden = !mass || mass.unmeasured;
    const notes = [];
    if (includesPrevious) notes.push('z poprzednim etapem');
    if (mass?.estimated) notes.push('dla płynów przyjęto 1 ml ≈ 1 g');
    if (mass?.partial) notes.push('suma podanych mas');
    output.textContent = mass ? `Masa etapu: ${mass.estimated?'ok. ':''}${formatQuantityBounds(mass,'g')}${notes.length?' ('+notes.join(', ')+')':''}` : '';
  }


  function classifyOcrRows(text) {
    const lines = String(text||'').split(/\r\n?|\n/u).map(line=>line.trim()).filter(Boolean);
    const hasContent = line=>/[\p{L}\p{N}]/u.test(line) && !/^\d+\s*(?:tyg\.?|tygodni|dni|godz\.?)\s+temu$/iu.test(line);
    const ingredientHeading = /^(?:składniki|lista składników|ingredients)\s*:?\s*$/iu;
    const methodHeading = /^(?:przygotowanie|sposób przygotowania|wykonanie|instrukcja|directions|method)(?:\s*:\s*(.*))?$/iu;
    const numberedStep = /^\d+\s*[.)]\s+\p{L}/u;
    const amountPattern = /^(\d+\s+\d+\s*\/\s*\d+|\d+\s*\/\s*\d+|\d+(?:[,.]\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])\s*((?:kg|mg|ml|dag|dkg|g|l|łyżeczk[ai]|łyżeczek|łyżk[ai]|łyżek|szklank[ai]|szklanek|szt\.?|opak\.?|ząbk[ió]w?|puszk[ai])(?=\s|$))?\s+(.+)$/iu;
    const first = lines.findIndex(hasContent);
    let mode = '';
    const rows = [];
    for (const [index,line] of lines.entries()) {
      if (!hasContent(line)) continue;
      if (ingredientHeading.test(line)) {
        mode = 'ingredient';
        continue;
      }
      const method = line.match(methodHeading);
      if (method) {
        mode = 'instruction';
        if (method[1]) rows.push({type:mode,amount:'',value:method[1]});
        continue;
      }
      if (numberedStep.test(line)) mode = 'instruction';
      const amount = mode==='instruction' ? null : line.match(amountPattern);
      if (index===first && !amount && mode!=='instruction') {
        rows.push({type:'title',amount:'',value:line});
      } else if (amount) {
        rows.push({type:'ingredient',amount:[amount[1],amount[2]].filter(Boolean).join(' '),value:amount[3]});
      } else if (mode!=='instruction' && (/^[\p{L}][\p{L}\s-]{1,38}:$/u.test(line) || ingredientHeading.test(lines[index+1]||''))) {
        rows.push({type:'heading',amount:'',value:line.replace(/:$/u,'')});
      } else {
        rows.push({type:mode||'instruction',amount:'',value:line});
      }
    }
    return rows;
  }

  function reviewOcrText(text,book,cat,sourcePhoto=''){

  function loadOcrLibrary() {
    if (window.Tesseract?.createWorker) return Promise.resolve(window.Tesseract);
    if (!ocrLibraryPromise) {
      ocrLibraryPromise = new Promise((resolve,reject)=>{
        const script = document.createElement('script');
        script.src = new URL('./tesseract.min.js',location.href).href;
        script.onload = ()=>{
          if (window.Tesseract?.createWorker) resolve(window.Tesseract);
          else {
            script.remove();
            reject(new Error('OCR library unavailable'));
          }
        };
        script.onerror = ()=>{
          script.remove();
          reject(new Error('OCR library loading failed'));
        };
        document.head.append(script);
      }).catch(error=>{
        ocrLibraryPromise = null;
        throw error;
      });
    }
    return ocrLibraryPromise;
  }

    const status = document.querySelector('#overlay-root .scan-status');

      if (imageUrl) URL.revokeObjectURL(imageUrl);

  function navigate(value) {
    const [type,book,category,recipe] = value.split(':');
    let next;
    if (type==='home' || type==='prep-index') next={type};
    else if (type==='prep-entry' || type==='custom-table') next={type,id:book};
    else if (type==='book') next={type,book};
    else if (type==='category') next={type,book,category};
    else if (type==='recipe') next={type,book,category,recipe};
    else return;

    if (route.type==='home' && (type==='recipe' || type==='prep-entry')) homeSearch='';
    const changed = JSON.stringify(next)!==JSON.stringify(route);
    const depth = history.state?.cookbook ? history.state.depth : 0;
    if (changed) {
      if (useAppBackStack) appBackStack.push(navigationState(appBackStack.length));
      else history.replaceState(navigationState(depth),'');
    }
    route = next;
    if (type==='home' || type==='category') search='';

      rememberCurrentView();
      return;
    }
    if (changed) {
      displayedDepth = depth+1;
      history.pushState(navigationState(displayedDepth),'');
    }
    else history.replaceState(navigationState(depth),'');

  function setupBackNavigation() {

          return;
        }
        displayedDepth = previous.depth;

        return;

  function readBakingStage(section,index) {
    const flour = Number(section.querySelector('[data-starter-flour]').value);
    const water = Number(section.querySelector('[data-starter-water]').value);
    return {
      ...(flour>0?{starterFlourGrams:flour}:{}),
      ...(water>0?{starterWaterGrams:water}:{}),
      ...(index>0&&section.querySelector('[data-baker-continue]').checked?{continuesPreviousStage:true}:{})
    };
  }
  function parseDictatedStage(text,defaultName,numbered) {
    const method = /(?:^|[\s.!?:;,])(?:sposób przygotowania|przygotowanie|wykonanie)(?=[\s:.,;]|$)\s*[:.,;]?\s*/iu.exec(text);
    const beforeMethod = method ? text.slice(0,method.index) : text;
    const ingredientHeading = /(?:^|[\s.!?:;,])(?:lista składników|składniki)(?=[\s:.,;]|$)\s*[:.,;]?\s*/iu.exec(beforeMethod);
    const firstQuantity = numbered && !ingredientHeading ? firstMeasuredIngredient.exec(beforeMethod) : null;
    const start = ingredientHeading || firstQuantity;
    const nameText = (start ? beforeMethod.slice(0,start.index) : beforeMethod)
      .replace(/^[\s:.,;–—-]+|[\s:.,;–—-]+$/gu,'').trim();
    const ingredientText = start ? beforeMethod.slice(start.index+start[0].length) : '';
    const ingredients = parseDictatedIngredients(ingredientText.replace(/\bprzecinek\b/giu,','));
    const instructions = method ? text.slice(method.index+method[0].length).trim() : '';
    if (!ingredients.length && !instructions) return null;
    return {name:nameText||defaultName,ingredients,instructions};
  }

  function parseDictatedRecipe(text) {
    const source = text.trim().replace(/\bnowy wiersz\b/giu,'\n');
    const markers = [...source.matchAll(/(?<![\p{L}\d])etap\s+(?:nr\.?\s+)?(?:\d+|pierwszy|drugi|trzeci|czwarty|piąty|piaty|szósty|szosty|siódmy|siodmy|ósmy|osmy|dziewiąty|dziewiaty|dziesiąty|dziesiaty|jeden|dwa|trzy|cztery|pięć)(?=[\s:.,;–—-]|$)[\s:.,;–—-]*/giu)];
    const title = value => value.trim().replace(/^tytuł(?: przepisu)?[\s:.,;]+/iu,'')
      .replace(/[\s:.,;]+$/u,'').slice(0,90).trim();
    const stageMarkers = markers.filter((marker,i)=>parseDictatedStage(
      source.slice(marker.index+marker[0].length,markers[i+1]?.index),'',true));
    if (stageMarkers.length && stageMarkers[0]===markers[0]) {
      const name = title(source.slice(0,stageMarkers[0].index)) || 'Podyktowany przepis';
      const sections = stageMarkers.map((marker,i)=>parseDictatedStage(
        source.slice(marker.index+marker[0].length,stageMarkers[i+1]?.index),`Etap ${i+1}`,true));
      return {name,servings:1,sections};
    }
    const stage = parseDictatedStage(source,'',false);
    const name = title(stage?.name||'');
    if (!name || !stage.ingredients.length || !stage.instructions) return null;
    return {name,servings:1,sections:[{...stage,name:'Przygotowanie'}]};
  }

  const ingredientUnits = [
    ['mg','mg|miligram(?:a|y|ów)?'], ['g','g|gram(?:a|y|ów)?'],
    ['dag','dag|dkg|dekagram(?:a|y|ów)?'], ['kg','kg|kilogram(?:a|y|ów)?'],
    ['ml','ml|mililitr(?:a|y|ów)?'], ['l','l|litr(?:a|y|ów)?'], ['dl','dl'], ['cl','cl'],
    ['szt.','szt|sztuk(?:a|i|ę)?'], ['łyżka','łyż(?:ka|ki|kę|ek)'],
    ['łyżeczka','łyżecz(?:ka|ki|kę|ek)'], ['szklanka','szkl(?:anka|anki|ankę|anek)']
  ].map(([unit,pattern])=>({unit,pattern,accepts:new RegExp('^(?:'+pattern+')$','iu')}));
  const unitPattern = ingredientUnits.map(entry=>entry.pattern).join('|');
  const recipeAmount = String.raw`${quantityNumber}(?:\s*[-–—]\s*${quantityNumber})?`;
  const measuredIngredient = String.raw`${recipeAmount}\s*(?:${unitPattern})\.?(?=\s|$)`;
  const firstMeasuredIngredient = new RegExp(String.raw`(?:^|[\s:;,])(?=${measuredIngredient})`,'iu');
  const unitStart = new RegExp(String.raw`^(?:${unitPattern})\.?(?=\s|$)`,'iu');
  const lastMeasured = new RegExp(String.raw`^(\p{L}.*?)\s+(${recipeAmount})\s*((?:${unitPattern})\.?)$`,'iu');
  const basicNumbers = {pół:'0,5',jeden:'1',jedna:'1',jedną:'1',jedno:'1',dwa:'2',dwie:'2',trzy:'3',cztery:'4',pięć:'5',sześć:'6',siedem:'7',osiem:'8',dziewięć:'9',dziesięć:'10'};

  function canonicalIngredientUnit(unit) {
    const value = normalizeQuantityUnit(unit);
    return ingredientUnits.find(entry=>entry.accepts.test(value))?.unit || value;
  }

  function isLeadingQuantity(line) {
    const word = /^\p{L}+(?=\s)/u.exec(line)?.[0].toLocaleLowerCase('pl');
    return Boolean(readQuantity(line) || Object.hasOwn(basicNumbers,word));
  }

  function splitDictatedIngredientLine(line) {
    const measures = [...line.matchAll(new RegExp(String.raw`(?<![\p{L}\p{N},./])${measuredIngredient}`,'giu'))];
    if (isLeadingQuantity(line)) {
      const starts = [0,...measures.filter(measure=>measure.index>0).map(measure=>measure.index)];
      return starts.map((start,i)=>line.slice(start,starts[i+1]).replace(/\s+i\s*$/iu,''));
    }
    const ends = [0,...measures.map(measure=>measure.index+measure[0].length),line.length];
    return ends.slice(1).map((end,i)=>line.slice(ends[i],end));
  }

  function parseDictatedIngredients(text,{split=true}={}) {
    const lines = split ? text.replace(/\bprzecinek\b/giu,',').replace(/\bnowy wiersz\b/giu,'\n')
      .split(/\r?\n|;|(?<!\d),|,(?!\d)/u) : [text];
    return lines.map(line=>line.trim().replace(/^[•–-]\s*/u,''))
      .flatMap(line=>split ? splitDictatedIngredientLine(line) : [line])
      .map(chunk=>chunk.trim().replace(/^i\s+/iu,'').replace(/[.!?]+$/u,'').trim())
      .filter(Boolean)
      .map(chunk=>{
        const reversed = chunk.match(lastMeasured);
        if (reversed) {
          const [,name,number,unit] = reversed;
          return {amount:number+' '+canonicalIngredientUnit(unit),name:name.trim().replace(/\s*[:–—-]$/u,'')};
        }
        const first = chunk.match(/^([\p{L}]+)\s+/u);
        const word = first?.[1].toLocaleLowerCase('pl');
        const normalized = first && Object.hasOwn(basicNumbers,word) ? basicNumbers[word]+' '+chunk.slice(first[0].length) : chunk;
        const quantity = readQuantityRange(normalized)?.end || readQuantity(normalized);
        if (!quantity) return {amount:'',name:chunk};
        const number = normalized.slice(0,normalized.length-quantity.tail.length).trim();
        const tail = quantity.tail.trim();
        const unit = tail.match(unitStart)?.[0];
        const name = unit ? tail.slice(unit.length).trim() : tail;
        if (!name) return {amount:'',name:chunk};
        return {amount:unit ? number+' '+canonicalIngredientUnit(unit) : number,name};
      });
  }

  const RECIPE_IMPORT_ENDPOINT_KEY = 'moja-kuchnia-recipe-import-endpoint';

  function recipeWebUrl(value,{httpsOnly=false}={}) {
    try {
      const url = new URL(value);
      if ((url.protocol==='https:' || (!httpsOnly && url.protocol==='http:')) && !url.username && !url.password) return url;
    } catch {}
    return null;
  }

  function recipeSourceMarkup(value) {
    const source = recipeWebUrl(value);
    return source ? `<p class="scan-help">Źródło · <a href="${esc(source.href)}" target="_blank" rel="noopener noreferrer">${esc(source.hostname)}</a></p>` : '';
  }

  async function fetchRecipePage(url,signal,viaEndpoint) {
    const response = await fetch(url,{signal,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
    if (!response.ok) {
      const error = new Error('HTTP '+response.status);
      error.status = response.status;
      throw error;
    }
    const responseUrl = viaEndpoint ? response.headers.get('X-Recipe-URL') : response.url;
    const reader = response.body?.getReader();
    if (!reader) return {html:'',responseUrl};
    const charset = response.headers.get('Content-Type')?.match(/charset\s*=\s*["']?([^;\s"']+)/i)?.[1];
    let decoder;
    try { decoder = new TextDecoder(charset); } catch { decoder = new TextDecoder(); }
    let size = 0;
    let html = '';
    try {
      while (true) {
        const {done,value} = await reader.read();
        if (done) return {html:html+decoder.decode(),responseUrl};
        size += value.byteLength;
        if (size>2_500_000) {
          const error = new Error('Page too large');
          error.status = 413;
          throw error;
        }
        html += decoder.decode(value,{stream:true});
      }
    } finally {
      reader.cancel().catch(()=>{});
    }
  }

  function recipeImportMessage(error,endpoint,timeout) {
    if (timeout || error.status===504) return 'Strona z przepisem odpowiada zbyt długo. Spróbuj ponownie później.';
    if (navigator.onLine===false) return 'Połącz się z internetem, aby pobrać przepis.';
    switch (error.status) {
      case 400: return 'Adres został odrzucony. Wklej pełny adres strony z przepisem.';
      case 401:
      case 403: return endpoint ? 'Usługa importu odmówiła dostępu. Sprawdź jej adres i konfigurację.' : 'Strona odmówiła dostępu. Spróbuj użyć usługi importu.';
      case 404: return endpoint ? 'Brak usługi pod zapisanym adresem. Sprawdź ustawienia importu.' : 'Strony nie znaleziono. Sprawdź adres przepisu.';
      case 413: return 'Strona jest za duża do automatycznego odczytu.';
      case 415: return 'Adres prowadzi do innego pliku niż strona z przepisem.';
      case 429: return 'Przekroczono limit zapytań. Spróbuj ponownie za chwilę.';
      case 502: return 'Usługa importu nie mogła pobrać strony z przepisem. Sprawdź adres i spróbuj ponownie.';
      default: return endpoint ? 'Nie udało się połączyć z usługą importu. Sprawdź jej adres.'
        : 'Przeglądarka nie mogła pobrać strony. Spróbuj użyć usługi importu.';
    }
  }

  function importedRecipeDraft(recipe,source) {
    const ingredients = recipe.ingredients.map(line=>
      parseDictatedIngredients(line,{split:false})[0] || {amount:'',name:line});
    const sections = recipe.instructions.map(({name,steps},index)=>({
      name:(name || (recipe.instructions.length===1 ? 'Przygotowanie' : `Etap ${index+1}`)).slice(0,60),
      ingredients:[],
      instructions:steps.join('\n\n')
    }));
    if (sections.length===1) sections[0].ingredients = ingredients;
    else if (ingredients.length || !sections.length) sections.unshift({name:'Składniki',ingredients,instructions:''});
    return {
      name:recipe.name.slice(0,90),description:recipe.description.slice(0,280),
      servings:recipe.servings,sections,sourceUrl:source.href
    };
  }

  function importRecipeLink(book,category) {
    let importer = '';
    try { importer = localStorage.getItem(RECIPE_IMPORT_ENDPOINT_KEY)||''; } catch {}
    showForm('Dodaj przepis z linku',`<form id="edit-form" class="form">
      <div class="field"><label for="recipe-import-url">Adres przepisu</label>
        <input id="recipe-import-url" name="link" type="url" required placeholder="https://blog-kulinarny.pl/przepis/…"></div>
      <p class="scan-help">Przepis trafi do działu „${esc(category.name)}” po sprawdzeniu i zapisaniu szkicu.</p>
      <details>
        <summary>Ustawienia importu</summary>
        <div class="field"><label for="recipe-import-endpoint">Adres usługi importu</label>
          <input id="recipe-import-endpoint" name="endpoint" type="url" value="${esc(importer)}"
            placeholder="https://import.twoja-domena.pl">
          <p class="scan-help">Jeśli strona blokuje pobieranie z przeglądarki, wklej adres usługi importu. Aplikacja wyśle do niej tylko link do przepisu.</p></div>
      </details>
      <p class="scan-help" role="status" id="recipe-import-status" hidden></p>
      <div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button>
        <button type="submit" class="primary-button">Pobierz przepis</button></div>
    </form>`,async(data,form)=>{
      const source = recipeWebUrl(String(data.get('link')).trim());
      const endpointValue = String(data.get('endpoint')).trim();
      const endpoint = recipeWebUrl(endpointValue,{httpsOnly:true});
      const message = form.querySelector('#recipe-import-status');
      const submit = form.querySelector('[type=submit]');
      const status = text=>{message.textContent=text;message.hidden=false};
      if (!source) return status('Podaj pełny adres przepisu zaczynający się od https:// lub http://.');
      if (endpointValue && !endpoint) return status('Podaj prawidłowy adres usługi importu zaczynający się od https://.');
      if (submit.disabled) return;
      if (source.protocol==='http:' && !endpoint) {
        form.querySelector('details').open = true;
        return status('Do pobrania przepisu z adresu http:// potrzebna jest usługa importu.');
      }
      source.hash = '';
      if (endpoint) endpoint.hash = '';
      try {
        if (endpoint) localStorage.setItem(RECIPE_IMPORT_ENDPOINT_KEY,endpoint.href);
        else localStorage.removeItem(RECIPE_IMPORT_ENDPOINT_KEY);
      } catch {}
      const request = endpoint || source;
      if (endpoint) request.searchParams.set('url',source.href);
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(),12000);
      formCleanup = ()=>controller.abort();
      status('Pobieram przepis…');
      submit.disabled = true;
      try {
        const {html,responseUrl} = await fetchRecipePage(request,controller.signal,Boolean(endpoint));
        if (!form.isConnected) return;
        const recipe = globalThis.recipeLinkImport.parse(html,source.href,responseUrl);
        if (!recipe) return status('Na tej stronie nie udało się znaleźć składników ani kroków przepisu.');
        recipeForm(book,category,importedRecipeDraft(recipe,source),true);
      } catch (error) {
        if (!form.isConnected) return;
        if (!endpoint && (error instanceof TypeError || error.status===403)) form.querySelector('details').open = true;
        status(recipeImportMessage(error,endpoint,controller.signal.aborted));
      } finally {
        clearTimeout(timeout);
        submit.disabled = false;
      }
    });
  }

  function ingredientMarkup(x={}) {
    const link = x.recipeLink ? 'recipe:'+x.recipeLink : x.tableLink||'';
    return `<div class="ingredient-editor" data-ingredient-link="${esc(link)}">
      <input data-amount aria-label="Ilość" value="${esc(x.amount||'')}" placeholder="Ilość">
      <input data-ing-name aria-label="Składnik" value="${esc(x.name||'')}" placeholder="np. mąki">

        <button type="button" data-link-ingredient class="ingredient-link-button${link?' is-linked':''}"

  function tableRowName(table,row) {
    const column = table.columns.find(column=>row.cells[column.id]?.trim());
    return column ? row.cells[column.id] : 'Wiersz tabeli';
  }

  function resolveIngredientLink(link) {
    const [tableId,rowId] = String(link||'').split(':');
    const table = state.tables.find(item=>item.id===tableId);
    const row = table?.rows.find(item=>item.id===rowId);
    return row ? {table,row} : null;
  }

  function resolveRecipeLink(recipeId) {
    for (const book of state.books) {
      for (const category of book.categories) {
        const recipe = recipeBy(book,category,recipeId);
        if (recipe) return {book,category,recipe};
      }
    }
    return null;
  }

  function linkedIngredientButton(ingredient) {
    if (ingredient.recipeLink) {
      const linked = resolveRecipeLink(ingredient.recipeLink);
      if (!linked) return '<small>Powiązany przepis niedostępny</small>';
      const {recipe} = linked;
      return `<button type="button" class="text-button ingredient-linked-open"
        data-action="preview-linked-recipe:${esc(recipe.id)}">Podgląd: ${esc(recipe.name)}</button>`;
    }
    if (!ingredient.tableLink) return '';
    const linked = resolveIngredientLink(ingredient.tableLink);
    if (!linked) return '<small>Powiązany wpis z tabeli niedostępny</small>';
    const {table,row} = linked;
    return `<button type="button" class="text-button ingredient-linked-open"
      data-action="open-linked-table-row:${esc(table.id)}:${esc(row.id)}">Otwórz: ${esc(tableRowName(table,row))}</button>`;
  }

  const linkedPreviews = [];

  function showLinkedPreview(key,title,content) {
    const previous = linkedPreviews.findIndex(preview=>preview.key===key);
    if (previous>=0) linkedPreviews.splice(previous);
    linkedPreviews.push({key,title,content});
    renderLinkedPreview();

  function renderLinkedPreview() {
    const {title,content} = linkedPreviews.at(-1);
    const back = linkedPreviews.length>1
      ? '<button type="button" class="text-button" data-action="back-linked-preview">← Wróć do poprzedniego podglądu</button>'

  function bindIngredientDragging(root) {
    const scroller = root.closest('.dialog');
    let drag;
    let frame;

    function reorder() {
      const {row,group,y} = drag;
      const next = [...group.children].find(candidate=>{
        if (candidate===row) return false;
        const bounds = candidate.getBoundingClientRect();
        return y<bounds.top+bounds.height/2;
      }) || null;
      if (row.nextElementSibling!==next) group.insertBefore(row,next);
    }

    function autoScroll() {
      if (!drag?.active || !root.isConnected) return;
      const bounds = scroller.getBoundingClientRect();
      const list = drag.group.getBoundingClientRect();
      const margin = 48;
      let speed = 0;
      if (drag.y<bounds.top+margin && list.top<bounds.top) {
        speed = -Math.min(16,(bounds.top+margin-drag.y)/3);
      }
      if (drag.y>bounds.bottom-margin && list.bottom>bounds.bottom) {
        speed = Math.min(16,(drag.y-bounds.bottom+margin)/3);
      }
      if (speed) {
        scroller.scrollTop += speed;
        reorder();
      }
      frame = requestAnimationFrame(autoScroll);
    }

    function finish(event,cancelled=false) {
      if (!drag || event.pointerId!==drag.pointer) return;
      const {row,group,next,pointer} = drag;
      drag = undefined;
      cancelAnimationFrame(frame);
      row.classList.remove('ingredient-dragging');
      if (cancelled && group.contains(row)) group.insertBefore(row,next);
      if (root.hasPointerCapture(pointer)) root.releasePointerCapture(pointer);
    }

    root.addEventListener('pointerdown',event=>{
      const handle = event.target.closest('[data-drag-ingredient]');
      if (!handle || drag || event.button!==0 || !event.isPrimary) return;
      const row = handle.closest('.ingredient-editor');
      const group = row.parentElement;
      if (group.children.length<2) return;
      drag = {row,group,next:row.nextElementSibling,pointer:event.pointerId,startY:event.clientY,y:event.clientY,active:false};
      root.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    root.addEventListener('pointermove',event=>{
      if (!drag || event.pointerId!==drag.pointer) return;
      drag.y = event.clientY;
      if (!drag.active) {
        if (Math.abs(drag.y-drag.startY)<5) return;
        drag.active = true;
        drag.row.classList.add('ingredient-dragging');
        frame = requestAnimationFrame(autoScroll);
      }
      reorder();
    });
    root.addEventListener('pointerup',event=>finish(event));
    root.addEventListener('pointercancel',event=>finish(event,true));
    root.addEventListener('lostpointercapture',event=>finish(event,true));
    root.addEventListener('keydown',event=>{
      const handle = event.target.closest('[data-drag-ingredient]');
      if (!handle || (event.key!=='ArrowUp' && event.key!=='ArrowDown')) return;
      const row = handle.closest('.ingredient-editor');
      event.preventDefault();
      if (event.key==='ArrowUp') row.previousElementSibling?.before(row);
      else row.nextElementSibling?.after(row);
      handle.focus();
    });
  }

  function compressRecipePhoto(file,max=1400,quality=.78) {
    return new Promise((resolve,reject)=>{
      const url = URL.createObjectURL(file);
      const image = new Image();
      image.onload = ()=>{
        try {
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          const longest = Math.max(image.naturalWidth,image.naturalHeight);
          let scale = Math.min(1,max/longest);
          const budget = max<=720 ? 95_000 : max<=1100 ? 140_000 : 180_000;
          let photo;
          while (true) {
            canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
            canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));
            context.fillStyle = '#fff';
            context.fillRect(0,0,canvas.width,canvas.height);
            context.drawImage(image,0,0,canvas.width,canvas.height);
            photo = canvas.toDataURL('image/jpeg',quality);
            if (photo.length<=budget || longest*scale<=480) break;
            scale *= .78;
            quality = Math.max(.65,quality-.04);
          }
          resolve(photo);
        } catch (error) {
          reject(error);
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      image.onerror = ()=>{
        URL.revokeObjectURL(url);
        reject(new Error('Invalid image'));
      };
      image.src = url;
    });
  }

  function addHomeItem() {
