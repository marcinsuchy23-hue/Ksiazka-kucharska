<!doctype html>
<html lang="pl">
<head>

  <link rel="manifest" href="manifest.webmanifest">

  <title>Domowa książka kucharska</title>
  <style>
    .portion-control{display:flex;align-items:end;gap:10px;border:1px solid var(--line);background:var(--card);padding:14px;border-radius:15px;margin:0 0 15px;box-shadow:var(--shadow);flex-wrap:wrap}.calc-field{display:grid;gap:6px;flex:1 1 150px;min-width:130px}.calc-field label{font-size:12px;font-weight:750;color:var(--green)}.calc-field input,.calc-field select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:var(--ink)}.calc-field.portion-field{flex:0 1 110px;min-width:90px}.portion-control [hidden]{display:none!important}.calc-note{font-size:12px;color:var(--muted);flex-basis:100%;line-height:1.45}.scan-help{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.scan-preview{max-height:180px;max-width:100%;object-fit:contain;border-radius:13px;margin:0 auto 12px;display:block}.progress-track{height:9px;background:#e9e5d9;border-radius:99px;overflow:hidden}.progress-track span{height:100%;display:block;background:var(--green);width:30%;animation:scan-progress 1.3s ease-in-out infinite alternate}@keyframes scan-progress{from{transform:translateX(-40%)}to{transform:translateX(245%)}}.scan-status{font-size:14px;color:var(--muted);text-align:center;margin:9px 0 14px}

  <style>@media(max-width:600px){.page-head .top-actions{width:100%;flex-wrap:wrap}.page-head .top-actions .quiet-button{flex:1}.page-head .top-actions .primary-button{flex:1 0 100%;width:100%}.portion-control{flex-wrap:wrap}.portion-control span{flex-basis:100%}}</style>
  <style>
    :root{--ink:#292c23;--muted:#77786d;--paper:#f8f6f0;--card:#fffefa;--green:#315d42;--green2:#e7eee4;--orange:#dc8057;--line:#e9e5d9;--shadow:0 10px 30px #3a39210d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0%,#eff0e4 0,transparent 34rem),var(--paper)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #dc805766;outline-offset:2px}.shell{max-width:1120px;margin:auto;padding:0 22px 64px}.topbar{height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;font-weight:750;letter-spacing:-.03em}.brandmark{display:grid;place-items:center;width:38px;height:38px;background:var(--green);color:white;border-radius:13px;font-size:20px}.top-actions{display:flex;gap:10px;align-items:center}.icon-button,.quiet-button,.primary-button,.text-button,.danger-button{border:0;border-radius:13px;padding:11px 15px;font-weight:650}.quiet-button,.icon-button{background:#eeece4;color:var(--ink)}.primary-button{background:var(--green);color:white;box-shadow:0 5px 14px #315d4226}.primary-button:hover{background:#244a33}.danger-button{background:#faeae4;color:#a4432c}.text-button{background:transparent;color:var(--green);padding-left:0;padding-right:0}.main{padding-top:36px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--green);font-weight:800}.heading{font-family:Georgia,serif;font-size:clamp(34px,6vw,52px);letter-spacing:-.045em;line-height:1.06;margin:10px 0 10px;font-weight:500}.subheading{color:var(--muted);margin:0;line-height:1.55}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px}.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:15px}.crumb{border:0;background:none;padding:0;color:inherit}.crumb:hover{color:var(--green)}.crumb.current{color:var(--ink);font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.tile{min-height:190px;position:relative;overflow:hidden;text-align:left;padding:21px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);transition:transform .18s,box-shadow .18s}.tile:hover{transform:translateY(-3px);box-shadow:0 15px 32px #3a392119}.tile:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:var(--tint,#e7eee4);right:-48px;bottom:-58px;opacity:.72}.tile-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--tint,#e7eee4);font-size:22px;margin-bottom:21px}.tile-title{font-family:Georgia,serif;font-size:23px;display:block;letter-spacing:-.02em}.tile-meta{display:block;margin-top:7px;color:var(--muted);font-size:13px}.tile-arrow{position:absolute;right:19px;top:22px;color:var(--green);font-size:20px}.recipe-tile{min-height:154px}.recipe-tile .tile-icon{width:38px;height:38px;margin-bottom:14px;font-size:19px}.recipe-tile .tile-title{font-size:21px}.empty{border:1px dashed #d7d2c4;border-radius:24px;padding:42px 24px;text-align:center;background:#fffdf899}.empty-icon{font-size:35px}.empty h2{font:500 25px Georgia,serif;margin:13px 0 7px}.empty p{color:var(--muted);max-width:390px;margin:0 auto 18px;line-height:1.55}.toolbar{display:flex;gap:10px;margin:0 0 23px}.search{max-width:420px;width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:#fffefa}.search::placeholder{color:#99988c}.recipe-view{max-width:780px;margin:0 auto}.recipe-cover{background:linear-gradient(130deg,#e5ecdf,#f5e7d8);border-radius:26px;padding:30px;margin-bottom:19px;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}.recipe-cover .heading{font-size:clamp(34px,7vw,49px);margin:8px 0}.recipe-description{color:#55594e;line-height:1.65;max-width:650px;margin:0}.recipe-section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:15px;box-shadow:var(--shadow)}.recipe-section h2{font:500 25px Georgia,serif;margin:0 0 16px}.section-description{color:var(--muted);margin:-7px 0 16px;line-height:1.55}.ingredient-list{list-style:none;padding:0;margin:0 0 20px}.ingredient-list li{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid #f0ede5}.ingredient-list li:last-child{border-bottom:0}.amount{font-weight:750;color:var(--green);min-width:92px}.instructions{white-space:pre-wrap;line-height:1.75;color:#4f5048;margin:0}.form-overlay{position:fixed;inset:0;background:#1f251f77;display:grid;place-items:end center;padding:16px;z-index:5}.dialog{width:min(680px,100%);max-height:min(92vh,950px);overflow:auto;background:var(--paper);border-radius:25px;padding:25px;box-shadow:0 30px 90px #0004}.dialog-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.dialog h2{font:500 29px Georgia,serif;margin:0 0 5px}.dialog-intro{font-size:14px;color:var(--muted);margin:0}.form{display:grid;gap:14px}.field{display:grid;gap:7px}.field label,.label{font-size:13px;font-weight:750}.field input,.field textarea{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:12px 13px;color:var(--ink)}.field textarea{resize:vertical;min-height:85px;line-height:1.5}.field .small-area{min-height:65px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:7px}.section-editor{border:1px solid var(--line);border-radius:18px;background:#fffefa;padding:17px}.section-editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.section-editor-head input{font-weight:750}.ingredient-editor{display:grid;grid-template-columns:minmax(85px,.75fr) 2fr auto;gap:8px;margin:8px 0}.ingredient-editor input{min-width:0;background:white;border:1px solid var(--line);border-radius:10px;padding:10px}.remove-small{border:0;background:transparent;color:#a4432c;font-size:19px}.add-link{border:0;background:transparent;color:var(--green);font-weight:750;padding:8px 0}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 17px;background:#283b2d;color:white;border-radius:13px;z-index:9;box-shadow:var(--shadow)}.footer-note{color:#88887d;font-size:12px;text-align:center;margin-top:38px}.hidden{display:none!important}
    @media(max-width:600px){.shell{padding:0 16px 44px}.topbar{height:68px}.brand-name{font-size:14px}.top-actions .backup-label{display:none}.main{padding-top:26px}.page-head{align-items:flex-start;flex-direction:column}.page-head .primary-button{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:158px;padding:15px;border-radius:19px}.tile-icon{width:39px;height:39px;border-radius:14px;margin-bottom:16px}.tile-title{font-size:19px}.tile-meta{font-size:12px}.tile-arrow{right:13px;top:15px}.recipe-tile{min-height:139px}.recipe-tile .tile-title{font-size:18px}.empty{padding:33px 17px}.toolbar{width:100%}.search{max-width:none}.recipe-cover{padding:22px;min-height:180px}.recipe-section{padding:19px}.amount{min-width:75px}.form-overlay{padding:0;align-items:end}.dialog{border-radius:25px 25px 0 0;max-height:94dvh;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}.field-row{grid-template-columns:1fr}.ingredient-editor{grid-template-columns:minmax(70px,.8fr) 2fr auto;gap:6px}.ingredient-editor input{padding:9px 8px;font-size:14px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" id="home-link"><span class="brandmark">✳</span><span class="brand-name">Moja kuchnia</span></a>
    <div class="top-actions"><button class="quiet-button" id="import-button" title="Wczytaj kopię zapasową">↥ <span class="backup-label">Wczytaj kopię</span></button><button class="quiet-button" id="export-button" title="Zapisz kopię zapasową">↧ <span class="backup-label">Kopia zapasowa</span></button><input id="import-file" type="file" accept="application/json,.json" class="hidden"></div>
  </header>
  <main id="main" class="main"></main>
  <p class="footer-note">Twoje przepisy są zapisane na tym urządzeniu.</p>
</div>
<div id="overlay-root"></div><div id="toast-root"></div>
<script src="./vendor/ocr/tesseract.min.js"></script>
<script>
(()=>{
  const KEY='domowa-kuchnia-v1';
  const colors=['#e7eee4','#f7e8dc','#eee8f4','#e5eef1','#f2ebd8','#f3e5e7'];
  const icons=['📖','🍃','🍲','🥣','🍰','🫙','🥗','🍋'];
  let state=load(), route={type:'home'}, search='';
  const main=document.querySelector('#main');
  function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.books)?d:{books:[]}}catch{return{books:[]}}}
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const bookBy=id=>state.books.find(x=>x.id===id), catBy=(b,id)=>b?.categories.find(x=>x.id===id), recipeBy=(b,c,id)=>c?.recipes.find(x=>x.id===id);
  function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
  function crumb(items){return `<nav class="crumbs">${items.map((x,i)=>i<items.length-1?`<button class="crumb" data-route="${x.route}">${esc(x.label)}</button><span>›</span>`:`<span class="crumb current">${esc(x.label)}</span>`).join('')}</nav>`}
  function card(title,meta,icon,tint,action,cls=''){return `<button class="tile ${cls}" data-action="${action}" style="--tint:${tint}"><span class="tile-arrow">↗</span><span class="tile-icon">${icon}</span><span class="tile-title">${esc(title)}</span><span class="tile-meta">${esc(meta)}</span></button>`}
  function empty(title,body,button,action){return `<div class="empty"><div class="empty-icon">🥄</div><h2>${title}</h2><p>${body}</p><button class="primary-button" data-action="${action}">${button}</button></div>`}
  function render(){
    if(route.type==='home')return renderHome();
    if(route.type==='book')return renderBook();
    if(route.type==='category')return renderCategory();
    if(route.type==='recipe')return renderRecipe();
  }
  function renderHome(){
    const books=state.books;
    main.innerHTML=`<section class="page-head"><div><div class="eyebrow">Twoje domowe zbiory</div><h1 class="heading">Smaki, do których<br>chce się wracać.</h1><p class="subheading">Wszystkie Twoje przepisy w jednym, przytulnym miejscu.</p></div><button class="primary-button" data-action="new-book">＋ Dodaj książkę</button></section>${books.length?`<div class="grid">${books.map((b,i)=>card(b.name,`${b.categories.length} ${plural(b.categories.length,'dział','działy','działów')}`,icons[i%icons.length],colors[i%colors.length],`book:${b.id}`)).join('')}</div>`:empty('Zacznij od swojej pierwszej książki','Utwórz książkę kucharską i poukładaj w niej przepisy tak, jak lubisz.','＋ Dodaj pierwszą książkę','new-book')}`;
  }
  function renderBook(){const b=bookBy(route.book);if(!b){route={type:'home'};return renderHome()};
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'}, {label:b.name}])}<section class="page-head"><div><div class="eyebrow">Książka kucharska</div><h1 class="heading">${esc(b.name)}</h1><p class="subheading">Wybierz dział albo dodaj nowy.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-book:${b.id}">Edytuj</button><button class="primary-button" data-action="new-category:${b.id}">＋ Dodaj dział</button></div></section>${b.categories.length?`<div class="grid">${b.categories.map((c,i)=>card(c.name,`${c.recipes.length} ${plural(c.recipes.length,'przepis','przepisy','przepisów')}`,icons[(i+1)%icons.length],colors[(i+2)%colors.length],`category:${b.id}:${c.id}`)).join('')}</div>`:empty('Dodaj pierwszy dział','Działy pomagają uporządkować przepisy, na przykład na „Sosy”, „Zupy” albo „Ciasta”.','＋ Dodaj dział',`new-category:${b.id}`)}`;
  }
  function renderCategory(){const b=bookBy(route.book),c=catBy(b,route.category);if(!b||!c){route={type:'home'};return renderHome()};
    const q=search.trim().toLocaleLowerCase('pl'), recipes=c.recipes.filter(r=>!q||`${r.name} ${r.description}`.toLocaleLowerCase('pl').includes(q));
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name}])}<section class="page-head"><div><div class="eyebrow">Dział w książce „${esc(b.name)}”</div><h1 class="heading">${esc(c.name)}</h1><p class="subheading">Twoje sprawdzone przepisy, zawsze pod ręką.</p></div><div class="top-actions"><button class="quiet-button" data-action="edit-category:${b.id}:${c.id}">Edytuj dział</button><button class="quiet-button" data-action="scan-photo:${b.id}:${c.id}">▧ Ze zdjęcia</button><button class="primary-button" data-action="new-recipe:${b.id}:${c.id}">＋ Dodaj przepis</button></div></section><input id="recipe-photo" class="hidden" type="file" accept="image/*">${c.recipes.length?`<div class="toolbar"><input id="recipe-search" class="search" type="search" placeholder="⌕  Szukaj przepisu…" value="${esc(search)}"></div>${recipes.length?`<div class="grid">${recipes.map((r,i)=>card(r.name,r.sections.length?`${r.sections.length} ${plural(r.sections.length,'etap','etapy','etapów')}`:'Otwórz przepis',['🍲','🥘','🍝','🥧','🥗','🍮'][i%6],colors[(i+1)%colors.length],`recipe:${b.id}:${c.id}:${r.id}`,'recipe-tile')).join('')}</div>`:`<div class="empty"><div class="empty-icon">⌕</div><h2>Nie znaleziono przepisu</h2><p>Spróbuj wpisać inną nazwę.</p></div>`}`:empty('Ten dział czeka na przepisy','Dodaj pierwszy przepis ze zdjęcia albo wpisz go ręcznie.','＋ Dodaj przepis',`new-recipe:${b.id}:${c.id}`)}`;
    const input=document.querySelector('#recipe-search');if(input)input.addEventListener('input',e=>{search=e.target.value;const pos=input.selectionStart;renderCategory();const next=document.querySelector('#recipe-search');next.focus();next.setSelectionRange(pos,pos)});
  }
  function renderRecipe(){const b=bookBy(route.book),c=catBy(b,route.category),r=recipeBy(b,c,route.recipe);if(!b||!c||!r){route={type:'home'};return renderHome()};
    const base=Number(r.servings)||4;
    const ingredientRows=r.sections.flatMap((section,si)=>(section.ingredients||[]).map((ingredient,ii)=>({section:si,index:ii,sectionName:section.name||`Etap ${si+1}`,amount:ingredient.amount||'',name:ingredient.name||''})));
    const scaleable=ingredientRows.filter(item=>{const parsed=readQuantity(item.amount);return parsed&&Number.isFinite(parsed.value)&&parsed.value>0});
    main.innerHTML=`${crumb([{label:'Moja kuchnia',route:'home'},{label:b.name,route:`book:${b.id}`},{label:c.name,route:`category:${b.id}:${c.id}`},{label:r.name}])}<article class="recipe-view"><header class="recipe-cover"><div class="eyebrow">${esc(c.name)} · ${esc(b.name)}</div><h1 class="heading">${esc(r.name)}</h1>${r.description?`<p class="recipe-description">${esc(r.description)}</p>`:''}</header><section class="portion-control" aria-label="Przeliczanie przepisu"><div class="calc-field"><label for="scale-scope">Przelicz</label><select id="scale-scope"><option value="all">Cały przepis</option>${r.sections.map((s,i)=>`<option value="${i}">Tylko: ${esc(s.name||`Etap ${i+1}`)}</option>`).join('')}</select></div><div class="calc-field"><label for="scale-mode">Według</label><select id="scale-mode"><option value="portions">Liczby porcji</option><option value="ingredient">Ilości składnika</option></select></div><div class="calc-field portion-field" id="portion-setting"><label for="portion-count">Porcje</label><input id="portion-count" type="number" min="1" max="100" step="1" value="${base}"></div><div id="ingredient-setting" class="calc-field" hidden><label for="scale-ingredient">Składnik</label><select id="scale-ingredient"></select></div><div id="target-setting" class="calc-field" hidden><label for="scale-target">Nowa ilość</label><input id="scale-target" type="text" placeholder="np. 300 g"></div><p id="scale-note" class="calc-note">Wybierz, czy przeliczać cały przepis, czy tylko jeden etap.</p></section><div class="top-actions" style="justify-content:flex-end;margin:0 0 14px"><button class="quiet-button" data-action="edit-recipe:${b.id}:${c.id}:${r.id}">Edytuj przepis</button><button class="danger-button" data-action="delete-recipe:${b.id}:${c.id}:${r.id}">Usuń</button></div>${r.sections.map((s,i)=>`<section class="recipe-section" data-scale-section="${i}"><h2>${esc(s.name||`Etap ${i+1}`)}</h2>${s.description?`<p class="section-description">${esc(s.description)}</p>`:''}${s.ingredients?.length?`<div class="label">Składniki</div><ul class="ingredient-list">${s.ingredients.map((x,j)=>`<li><span class="amount" data-base-amount="${esc(x.amount||'')}" data-scale-section="${i}" data-scale-item="${i}:${j}">${esc(x.amount||'')}</span><span>${esc(x.name||'')}</span></li>`).join('')}</ul>`:''}${s.instructions?`<div class="label" style="margin-bottom:8px">Jak przygotować</div><p class="instructions">${esc(s.instructions)}</p>`:''}</section>`).join('')}</article>`;
    setupRecipeScaling(r,base,scaleable);
  }
  function setupRecipeScaling(recipe,base,scaleable){const scope=document.querySelector('#scale-scope'),mode=document.querySelector('#scale-mode'),portions=document.querySelector('#portion-count'),items=document.querySelector('#scale-ingredient'),target=document.querySelector('#scale-target'),portionSetting=document.querySelector('#portion-setting'),ingredientSetting=document.querySelector('#ingredient-setting'),targetSetting=document.querySelector('#target-setting'),note=document.querySelector('#scale-note');
    function refreshItems(){const old=items.value,chosenScope=scope.value;const visible=scaleable.filter(item=>chosenScope==='all'||String(item.section)===chosenScope);items.innerHTML=visible.length?visible.map(item=>`<option value="${item.section}:${item.index}">${esc(item.sectionName)} · ${esc(item.name)} (${esc(item.amount)})</option>`).join(''):'<option value="">Brak składników z podaną ilością</option>';const selected=visible.find(item=>`${item.section}:${item.index}`===old)||visible[0];if(selected){items.value=`${selected.section}:${selected.index}`;target.value=selected.amount}else{target.value=''}}
    function recalculate(){const selectedScope=scope.value,ingredientMode=mode.value==='ingredient';portionSetting.hidden=ingredientMode;ingredientSetting.hidden=!ingredientMode;targetSetting.hidden=!ingredientMode;let ratio=(Math.min(100,Math.max(1,Number(portions.value)||base)))/base;let selected=null,desired=null;if(ingredientMode){selected=scaleable.find(item=>`${item.section}:${item.index}`===items.value);const source=selected&&readQuantity(selected.amount);desired=readQuantity(target.value);if(!source||!desired||!Number.isFinite(desired.value)||desired.value<=0){note.textContent='Wpisz dodatnią ilość w tej samej jednostce co wybrany składnik.';document.querySelectorAll('[data-base-amount]').forEach(el=>el.textContent=el.dataset.baseAmount);return}ratio=desired.value/source.value;note.textContent='Ilości zmienią się tylko w podglądzie. Zapisany przepis pozostaje bez zmian.'}
      else note.textContent='Przeliczenie zmienia tylko podgląd, według liczby porcji i wybranego zakresu.';
      document.querySelectorAll('[data-base-amount]').forEach(el=>{const itemScope=el.dataset.scaleSection;const inScope=selectedScope==='all'||selectedScope===itemScope;if(!inScope){el.textContent=el.dataset.baseAmount;return}if(ingredientMode&&el.dataset.scaleItem===items.value){const original=readQuantity(selected.amount),typed=target.value.trim(),typedQuantity=readQuantity(typed);el.textContent=typedQuantity&&typedQuantity.tail?typed:`${typed}${original?.tail||''}`;return}el.textContent=scaleAmount(el.dataset.baseAmount,ratio,1)})}
    scope.addEventListener('change',()=>{refreshItems();recalculate()});mode.addEventListener('change',recalculate);portions.addEventListener('input',recalculate);items.addEventListener('change',()=>{const selected=scaleable.find(item=>`${item.section}:${item.index}`===items.value);target.value=selected?.amount||'';recalculate()});target.addEventListener('input',recalculate);refreshItems();recalculate();
  }
  function plural(n,a,b,c){return n===1?a:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?b:c}
  const fractions={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
  function readQuantity(text){let m=String(text||'').match(/^\s*(\d+)\s+(\d+)\/(\d+)(.*)$/);if(m)return{value:Number(m[1])+Number(m[2])/Number(m[3]),tail:m[4]};m=String(text||'').match(/^\s*(\d+)\/(\d+)(.*)$/);if(m)return{value:Number(m[1])/Number(m[2]),tail:m[3]};m=String(text||'').match(/^\s*(\d+)?\s*([¼½¾⅓⅔⅛⅜⅝⅞])(.*)$/);if(m)return{value:Number(m[1]||0)+fractions[m[2]],tail:m[3]};m=String(text||'').match(/^\s*(\d+(?:[,.]\d+)?)(.*)$/);return m?{value:Number(m[1].replace(',','.')),tail:m[2]}:null}
  function scaleAmount(value,target,base){if(base<=0)return value;const range=String(value||'').match(/^\s*(\d+(?:[,.]\d+)?)\s*([-–—])\s*(\d+(?:[,.]\d+)?)(.*)$/);const factor=target/base;const fmt=n=>String(Math.round(n*factor*100)/100).replace('.',',');if(range)return `${fmt(Number(range[1].replace(',','.')))}${range[2]}${fmt(Number(range[3].replace(',','.')))}${range[4]}`;const parsed=readQuantity(value);if(!parsed||!Number.isFinite(parsed.value))return value;return `${fmt(parsed.value)}${parsed.tail}`}
  function parseRecipeText(value){const lines=String(value||'').split(/\r?\n/).map(s=>s.replace(/^\s*[-•*·▪]+\s*/, '').trim()).filter(Boolean);const name=lines.shift()||'Przepis ze zdjęcia';const plain=s=>s.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLocaleLowerCase('pl').replace(/[:.]+$/,'').trim();const isIng=s=>/^(skladniki|lista skladnikow|potrzebne skladniki|ingredients)$/.test(plain(s));const isMethod=s=>/^(sposob przygotowania|przygotowanie|wykonanie|instrukcja|method|directions)$/.test(plain(s));let ingAt=-1,methodAt=-1;lines.forEach((line,i)=>{if(isIng(line)&&ingAt<0)ingAt=i;if(isMethod(line)&&methodAt<0)methodAt=i});const ingredients=[],instructions=[];if(ingAt>=0){const end=methodAt>ingAt?methodAt:lines.length;for(const line of lines.slice(ingAt+1,end)){const match=line.match(/^(\d+(?:[,.]\d+)?(?:\s+\d+\/\d+|\/\d+)?(?:\s*(?:g|kg|mg|ml|l|dag|łyżecz(?:ka|ki|ek)|łyż(?:ka|ki|ek)|szkl(?:anka|anki|anek)|szt\.?|opak\.?|ząbk(?:i|ów)?|puszk(?:a|i))?)[\s.·-]+)?(.+)$/iu);ingredients.push({amount:match?match[1].trim().replace(/[.·-]+$/,''):'',name:(match?match[2]:line).trim()})}}
    if(methodAt>=0)instructions.push(...lines.slice(methodAt+1));else if(ingAt<0)instructions.push(...lines);
    const sections=[];if(ingredients.length)sections.push({name:'Składniki',ingredients,instructions:''});if(instructions.length)sections.push({name:'Przygotowanie',ingredients:[{amount:'',name:''}],instructions:instructions.join('\n')});if(!sections.length)sections.push({name:'Przygotowanie',ingredients:[{amount:'',name:''}],instructions:''});const firstHeader=[ingAt,methodAt].filter(n=>n>=0).sort((a,b)=>a-b)[0];const description=firstHeader>0?lines.slice(0,firstHeader).join(' '):'';return{name,description,servings:4,sections}}
  function reviewOcrText(text,book,cat){const content=`<form id="edit-form" class="form"><p class="scan-help">Sprawdź i popraw odczytany tekst, zanim utworzymy szkic przepisu. Rozpoznawanie działa na tym urządzeniu; zdjęcie nie jest wysyłane do serwisu.</p><div class="field"><label for="ocr-transcription">Tekst ze zdjęcia</label><textarea id="ocr-transcription" name="text" style="min-height:260px" required>${esc(text)}</textarea></div><div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">Dalej: popraw przepis</button></div></form>`;showForm('Sprawdź tekst ze zdjęcia',content,fd=>{const draft=parseRecipeText(String(fd.get('text')||''));recipeForm(book,cat,draft,true)})}
  async function scanPhoto(file,book,cat){const imageUrl=URL.createObjectURL(file);showForm('Czytam zdjęcie',`<img class="scan-preview" src="${imageUrl}" alt="Wybrane zdjęcie przepisu"><div class="progress-track"><span style="width:30%"></span></div><p class="scan-status">Rozpoznaję tekst na urządzeniu… Przy pierwszym użyciu może to chwilę potrwać.</p><p class="scan-help" style="text-align:center">Najlepszy efekt dają wyraźne, równo ułożone zdjęcia drukowanego przepisu.</p>`);let worker;try{if(!window.Tesseract)throw new Error('Brak plików OCR');worker=await Tesseract.createWorker('pol',1,{workerPath:new URL('./vendor/ocr/worker.min.js',location.href).href,corePath:new URL('./vendor/ocr/tesseract-core-lstm.wasm.js',location.href).href,langPath:new URL('./vendor/ocr/',location.href).href,gzip:true});const result=await worker.recognize(file);const text=result.data.text||'';await worker.terminate();worker=null;URL.revokeObjectURL(imageUrl);if(!text.trim()){closeForm();toast('Nie udało się odczytać tekstu. Spróbuj wyraźniejszego zdjęcia.');return}reviewOcrText(text,book,cat)}catch(error){if(worker)try{await worker.terminate()}catch{}URL.revokeObjectURL(imageUrl);closeForm();toast('Nie udało się odczytać zdjęcia. Otwórz aplikację w przeglądarce przez plik startowy i spróbuj ponownie.')}}
  function navigate(value){const p=value.split(':');if(p[0]==='home'){route={type:'home'};search=''}else if(p[0]==='book'){route={type:'book',book:p[1]}}else if(p[0]==='category'){route={type:'category',book:p[1],category:p[2]};search=''}else if(p[0]==='recipe'){route={type:'recipe',book:p[1],category:p[2],recipe:p[3]}}render();window.scrollTo(0,0)}
  function toast(msg){const el=document.querySelector('#toast-root');el.innerHTML=`<div class="notice">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML='',2600)}
  function showForm(title,content,onSave){document.querySelector('#overlay-root').innerHTML=`<div class="form-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="dialog-head"><div><h2>${esc(title)}</h2><p class="dialog-intro">Zmiany zapisują się na tym urządzeniu.</p></div><button type="button" class="icon-button" data-close aria-label="Zamknij">✕</button></header>${content}</section></div>`;const over=document.querySelector('.form-overlay');over.addEventListener('click',e=>{if(e.target===over||e.target.closest('button[data-close]'))closeForm()});const form=document.querySelector('#edit-form');form?.addEventListener('submit',e=>{e.preventDefault();onSave(new FormData(form),form)})}
  function closeForm(){document.querySelector('#overlay-root').innerHTML=''}
  function simpleForm(title,label,value,saveText,save){showForm(title,`<form id="edit-form" class="form"><div class="field"><label for="item-name">${label}</label><input id="item-name" name="name" required maxlength="70" value="${esc(value)}" placeholder="Wpisz nazwę" autofocus></div><div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">${saveText}</button></div></form>`,f=>{const name=String(f.get('name')).trim();if(!name)return;save(name);closeForm();render()})}
  function sectionMarkup(s={},i=0){const ingredients=s.ingredients?.length?s.ingredients:[{amount:'',name:''}];return `<div class="section-editor" data-section><div class="section-editor-head"><span class="eyebrow">Część przepisu ${i+1}</span><button type="button" class="remove-small" data-remove-section title="Usuń część">×</button></div><div class="form" style="gap:11px"><div class="field"><label>Nazwa części / etapu</label><input data-s-name required maxlength="60" value="${esc(s.name||'')}" placeholder="np. Sos, ciasto, nadzienie"></div><div class="field"><span class="label">Składniki</span><div data-ingredients>${ingredients.map(ing=>ingredientMarkup(ing)).join('')}</div><button type="button" class="add-link" data-add-ingredient>＋ Dodaj składnik</button></div><div class="field"><label>Sposób przygotowania</label><textarea data-s-instructions placeholder="Opisz, co zrobić w tym etapie…">${esc(s.instructions||'')}</textarea></div></div></div>`}
  function ingredientMarkup(x={}){return `<div class="ingredient-editor"><input data-amount aria-label="Ilość" value="${esc(x.amount||'')}" placeholder="Ilość"><input data-ing-name aria-label="Składnik" value="${esc(x.name||'')}" placeholder="np. mąki"><button class="remove-small" type="button" data-remove-ingredient aria-label="Usuń składnik">×</button></div>`}
  function recipeForm(book,cat,old,draft=false){const existing=Boolean(old&&!draft);const sections=old?.sections?.length?old.sections:[{name:'',ingredients:[{amount:'',name:''}],instructions:''}];
    const content=`<form id="edit-form" class="form"><div class="field"><label for="recipe-name">Nazwa przepisu</label><input id="recipe-name" name="name" required maxlength="90" value="${esc(old?.name||'')}" placeholder="np. Sos pomidorowy"></div><div class="field"><label for="recipe-description">Krótki opis</label><textarea id="recipe-description" name="description" class="small-area" maxlength="280" placeholder="Kilka słów o tym przepisie…">${esc(old?.description||'')}</textarea></div><div class="field"><label for="recipe-servings">Podstawowa liczba porcji</label><input id="recipe-servings" name="servings" type="number" min="1" max="100" step="1" value="${Number(old?.servings)||4}"><span class="scan-help">Na tej podstawie aplikacja przeliczy ilości składników.</span></div><div id="sections">${sections.map((s,i)=>sectionMarkup(s,i)).join('')}</div><button type="button" class="add-link" id="add-section">＋ Dodaj część / etap</button><div class="form-actions"><button type="button" class="quiet-button" data-close>Anuluj</button><button class="primary-button">${existing?'Zapisz zmiany':'Zapisz przepis'}</button></div></form>`;
    showForm(existing?'Edytuj przepis':'Nowy przepis',content,(fd,form)=>{const name=String(fd.get('name')).trim();if(!name)return;const blocks=[...form.querySelectorAll('[data-section]')];const parsed=blocks.map(el=>({name:el.querySelector('[data-s-name]').value.trim(),instructions:el.querySelector('[data-s-instructions]').value.trim(),ingredients:[...el.querySelectorAll('.ingredient-editor')].map(row=>({amount:row.querySelector('[data-amount]').value.trim(),name:row.querySelector('[data-ing-name]').value.trim()})).filter(x=>x.name||x.amount)})).filter(s=>s.name||s.instructions||s.ingredients.length);const recipe={id:existing?old.id:id(),name,description:String(fd.get('description')).trim(),servings:Math.min(100,Math.max(1,Number(fd.get('servings'))||4)),sections:parsed};if(existing)Object.assign(old,recipe);else cat.recipes.push(recipe);save();closeForm();render();toast(existing?'Przepis zaktualizowany':'Przepis zapisany')});
    const sectionsRoot=document.querySelector('#sections');sectionsRoot.addEventListener('click',e=>{if(e.target.closest('[data-add-ingredient]')){const container=e.target.closest('[data-section]').querySelector('[data-ingredients]');container.insertAdjacentHTML('beforeend',ingredientMarkup());container.lastElementChild.querySelector('[data-amount]').focus()}if(e.target.closest('[data-remove-ingredient]')){const group=e.target.closest('[data-ingredients]');if(group.children.length>1)e.target.closest('.ingredient-editor').remove();else{group.firstElementChild.querySelectorAll('input').forEach(x=>x.value='')}}if(e.target.closest('[data-remove-section]')){if(sectionsRoot.children.length>1)e.target.closest('[data-section]').remove();else toast('Przepis musi mieć przynajmniej jeden etap')}});
    document.querySelector('#add-section').addEventListener('click',()=>{sectionsRoot.insertAdjacentHTML('beforeend',sectionMarkup({},sectionsRoot.children.length));sectionsRoot.lastElementChild.scrollIntoView({behavior:'smooth',block:'center'})});
  }
  document.addEventListener('click',e=>{const cr=e.target.closest('[data-route]');if(cr){navigate(cr.dataset.route);return}const a=e.target.closest('[data-action]');if(!a)return;const [act,...p]=a.dataset.action.split(':');
    if(act==='book')return navigate(`book:${p[0]}`);if(act==='category')return navigate(`category:${p[0]}:${p[1]}`);if(act==='recipe')return navigate(`recipe:${p[0]}:${p[1]}:${p[2]}`);
    if(act==='new-book')return simpleForm('Nowa książka','Nazwa książki','', 'Utwórz książkę',name=>{state.books.push({id:id(),name,categories:[]});save()});
    if(act==='edit-book'){const b=bookBy(p[0]);return simpleForm('Zmień nazwę książki','Nazwa książki',b.name,'Zapisz',n=>{b.name=n;save()})}
    if(act==='new-category'){const b=bookBy(p[0]);return simpleForm('Nowy dział','Nazwa działu','', 'Dodaj dział',name=>{b.categories.push({id:id(),name,recipes:[]});save()})}
    if(act==='edit-category'){const b=bookBy(p[0]),c=catBy(b,p[1]);return simpleForm('Zmień nazwę działu','Nazwa działu',c.name,'Zapisz',n=>{c.name=n;save()})}
    if(act==='new-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]));
    if(act==='scan-photo')return document.querySelector('#recipe-photo').click();
    if(act==='edit-recipe')return recipeForm(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),recipeBy(bookBy(p[0]),catBy(bookBy(p[0]),p[1]),p[2]));
    if(act==='delete-recipe'){const b=bookBy(p[0]),c=catBy(b,p[1]),r=recipeBy(b,c,p[2]);if(confirm(`Usunąć przepis „${r.name}”?`)){c.recipes=c.recipes.filter(x=>x.id!==r.id);save();navigate(`category:${b.id}:${c.id}`);toast('Przepis usunięty')}}
  });
  document.addEventListener('change',e=>{if(e.target.id==='recipe-photo'&&e.target.files?.[0]){const b=bookBy(route.book),c=catBy(b,route.category);if(b&&c)scanPhoto(e.target.files[0],b,c);e.target.value=''}});
  document.querySelector('#home-link').addEventListener('click',e=>{e.preventDefault();navigate('home')});
  document.querySelector('#export-button').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:'domowa-kuchnia',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moja-ksiazka-kucharska.json';a.click();URL.revokeObjectURL(a.href);toast('Kopia zapasowa pobrana')});
  document.querySelector('#import-button').addEventListener('click',()=>document.querySelector('#import-file').click());
  document.querySelector('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.books)||!data.books.every(b=>typeof b.name==='string'&&Array.isArray(b.categories)))throw new Error('bad');if(confirm('Wczytać kopię zapasową? Obecne przepisy zostaną zastąpione zawartością kopii.')){state={books:data.books};save();navigate('home');toast('Kopia zapasowa wczytana')}}catch{toast('Nie udało się wczytać tego pliku')}e.target.value=''});
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
